<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rounding Ridge</title><style>
[hidden]{display:none!important}*{box-sizing:border-box}body{margin:0;background:#eef3f4;color:#173b45;font-family:Arial,sans-serif}main{max-width:900px;margin:auto;padding:24px}header{display:flex;justify-content:space-between;align-items:center;gap:12px}h1{font-size:24px}button,input{font:inherit}button{cursor:pointer;border:2px solid #286878;border-radius:14px;background:white;color:#173b45;min-height:52px;padding:12px 22px;font-weight:bold}button:hover{background:#e3f2f2}button:focus-visible,input:focus-visible{outline:4px solid #e7ad43;outline-offset:3px}.primary{background:#176579;color:white}.primary:hover{background:#124e60}.card{background:white;border-radius:24px;padding:30px;text-align:center;box-shadow:0 8px 30px #183e4510;min-height:425px}h2{font-size:30px;margin:18px 0 24px}.number{font-size:48px;font-weight:bold;letter-spacing:3px;margin:18px}.tag{font-size:15px;text-transform:uppercase;letter-spacing:2px;color:#52717a}.choices{display:flex;justify-content:center;gap:18px;flex-wrap:wrap;margin:24px 0}.choices button{font-size:26px;min-width:150px}input{width:240px;max-width:100%;font-size:36px;text-align:center;border:2px solid #73939a;border-radius:12px;padding:12px}form{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin:24px}#feedback{min-height:28px;font-size:20px;margin:16px}#progress{font-size:18px}.secondary{border-color:#a6b9bd;font-size:16px}svg{width:100%;max-width:690px;display:block;margin:auto}details{margin:24px 0;color:#49636b;font-size:16px;line-height:1.6}mark{background:#ffe5a3;color:inherit;border-radius:6px;padding:4px}.equation{font-size:34px;margin:30px 0}.small{font-size:18px}footer{display:flex;justify-content:space-between;gap:15px;margin-top:18px}@media(max-width:550px){main{padding:12px}.card{padding:20px 12px}h2{font-size:25px}.number{font-size:40px}header{flex-wrap:wrap}.choices button{min-width:120px}}

.digits{display:flex;justify-content:center;gap:10px;margin:22px 0;align-items:end}.digit{display:inline-flex;flex-direction:column;align-items:center;font-size:40px;padding:8px;min-width:55px;font-weight:bold}.digit small{font-size:13px;font-weight:normal;letter-spacing:0;margin-bottom:8px}.digits button{font-size:40px;min-width:55px;padding:8px 12px}.focus{background:#ffe5a3;border-bottom:4px solid #b77b14;border-radius:7px}.muted{opacity:.35}.build{display:flex;justify-content:center;align-items:center;gap:14px;min-height:90px;font-size:40px;margin:20px 0}.slot{border-bottom:3px solid #76949c;min-width:90px;min-height:60px}.caption{font-size:20px;margin:12px 0}.replay{display:block;margin:12px auto}.hill-card h2{margin:12px 0}.hill-card .number{font-size:32px;margin:10px}.hill-card svg{max-height:290px}.hill-card .choices{margin:12px 0}button:disabled{opacity:.5;cursor:default}.hint{font-size:18px;line-height:1.5}.choice-caption{display:block;font-size:16px;margin-top:8px;font-weight:normal}@media(max-width:550px){.digit{min-width:42px;font-size:32px;padding:4px}.digits{gap:6px}.digits button{min-width:45px;font-size:32px}.build{font-size:30px}form{margin:18px 0}.hill-card svg{min-height:205px}}

.mountain{position:relative;max-width:680px;aspect-ratio:680/350;margin:16px auto 0}.mountain svg{width:100%;height:100%;max-height:none;display:block}.hill-point{position:absolute;transform:translate(-50%,-50%);width:46px;min-height:46px;padding:0;border-radius:50%;font-size:22px;background:white}.hill-point:disabled{opacity:1;border-color:transparent;background:transparent;color:#173b45}.hill-end{position:absolute;bottom:0;min-width:130px;font-size:27px;background:white}.hill-end.left{left:0}.hill-end.right{right:0}.hill-end:disabled{opacity:1;border-color:transparent;background:transparent}.hill-point.teach-point{background:#ffe5a3;border:3px solid #ad720d}.hill-card .number{margin:10px}.hill-card #feedback{margin:8px}.hill-card #motion-note{min-height:30px}@media(max-width:550px){.hill-point{width:30px;min-height:36px;font-size:16px;border-width:1px}.hill-end{min-width:105px;font-size:23px;padding:8px}.mountain{margin-top:28px;margin-bottom:16px;aspect-ratio:680/420}.mountain svg{min-height:0}.hill-card .mountain{max-height:none}}

.full-sheet{border-collapse:collapse;width:100%;margin:20px auto;text-align:left;font-size:18px}.full-sheet th,.full-sheet td{padding:10px 12px;border-bottom:1px solid #dbe6e8}.full-sheet th{font-weight:normal;width:62%}.full-sheet td{font-weight:bold}.full-sheet tr.active{background:#fff0c9}.full-sheet .done{color:#126346}.full-sheet .pending{color:#69828a}.full-task{border:2px solid #e8b64f;border-radius:16px;padding:16px;margin-top:18px}.full-task h3{font-size:23px;margin:4px 0 15px}.full-task form{margin:12px 0}.full-heading{font-size:25px!important}.full-summary{margin-bottom:12px}.full-summary .full-sheet{font-size:16px}.full-summary .full-sheet th,.full-summary .full-sheet td{padding:7px 10px}footer{flex-wrap:wrap}.full-final{font-size:27px;background:#e2f3ec;padding:18px;border-radius:12px}.full-sheet .row-number{color:#69828a;margin-right:10px}@media(max-width:550px){.full-sheet{font-size:16px}.full-sheet th,.full-sheet td{padding:9px 6px}.full-task{padding:12px 8px}.full-task .digits{gap:5px}}

.memory-chant{margin:18px 0;padding:20px;background:#fff2cf;border:2px solid #dfb54e;border-radius:16px}.memory-chant h3{font-size:22px;margin:0 0 12px}.memory-chant p{font-size:22px;line-height:1.55;margin:10px 0}.memory-chant .chant-help{font-size:17px}.memory-chant .round-rule{font-weight:bold;color:#175b68}
.digit.copy-digit{position:relative}.digit.copy-digit::after{content:"";position:absolute;left:2px;right:2px;bottom:-9px;border-bottom:5px solid #156b81;border-radius:2px}
#motion-note{font-size:clamp(25px,4vw,30px);font-weight:700;line-height:1.35}
</style><main><header><h1>Rounding Ridge</h1><div id="progress" aria-label="Independent progress"></div><button class="secondary" id="speak">Read aloud</button></header><section class="card" id="app"></section><footer><button class="secondary" id="help">Help me</button><button class="secondary" id="restart">Start again</button><button class="secondary" id="full-practice">Practise all steps</button></footer></main><script>
const app=document.querySelector('#app');
let n=null,streak=0,mode='independent',step=0,show=false,supported=false,used=new Set(),round=0,frame=0,animationToken=0;
const low=()=>Math.floor(n/10)*10, high=()=>low()+10, ones=()=>n%10, answer=()=>Math.floor((n+5)/10)*10;
const fmt=x=>String(x).replace(/\B(?=(\d{3})+(?!\d))/g,' ');
const titles=['Tap on the digit in the tens place.','Copy from the left. Include the tens digit.','Put 0 after your digits.','Find the higher ten.','Tap on the digit in the ones place.','Which number will you choose?'];
function stopMotion(){cancelAnimationFrame(frame);animationToken++}
function digits(value,focus=-1,labels=false,clickable=false,copyTo=-1){const a=String(value).split('');return '<div class="digits">'+a.map((d,i)=>{const label=['Ones','Tens','Hundreds','Thousands','Ten thousands'][a.length-1-i];return clickable?`<button data-digit="${i}" aria-label="Digit ${d}, position ${i+1}">${d}</button>`:`<span class="digit ${i===focus?'focus':''} ${i<=copyTo?'copy-digit':''}">${labels?`<small>${label}</small>`:''}${d}</span>`}).join('')+'</div>'}
function form(label){return `<form><label class="small" for="entry">${label}</label><div class="choices" style="width:100%;margin:0"><input id="entry" inputmode="numeric" autocomplete="off" aria-label="${label}"><button class="primary" type="submit">Check</button></div></form>`}
function hill(){return `<svg viewBox="0 0 680 310" role="img" aria-label="Ones digit ${ones()}. Zero to four roll to ${low()}; five to nine roll to ${high()}."><path d="M60 215 L340 70 L620 215 Z" fill="#e3eff0" stroke="#547e85" stroke-width="4"/>${Array.from({length:11},(_,i)=>`<circle cx="${60+i*56}" cy="${215-Math.min(i,10-i)*29}" r="4" fill="#365e69"/><text x="${60+i*56}" y="245" text-anchor="middle" font-size="20">${i}</text>`).join('')}<text x="110" y="285" text-anchor="middle" font-size="28">${fmt(low())}</text><text x="570" y="285" text-anchor="middle" font-size="28">${fmt(high())}</text><text x="145" y="85" text-anchor="middle" font-size="24">← 0–4</text><text x="535" y="85" text-anchor="middle" font-size="24">5–9 →</text><text x="340" y="28" text-anchor="middle" font-size="20">5: halfway →</text><g id="ball"><circle r="14" fill="#e9a829" stroke="#70480e" stroke-width="3"/><path d="M-13 0 H13 M0 -13 V13" stroke="#70480e" stroke-width="2"/></g></svg><button id="roll" class="secondary replay">Watch it roll</button><p id="motion-note" class="caption" aria-live="polite">Ones digit: ${ones()}</p>`}
function ballAt(p,angle=0){const b=document.querySelector('#ball');if(b)b.setAttribute('transform',`translate(${60+p*56} ${199-Math.min(p,10-p)*29}) rotate(${angle})`)}
function teach(){const tens=String(n).length-2,prefix=Math.floor(n/10);switch(step){case 0:return `<p class="caption">Nearest ten → find the tens place.</p>${digits(n,tens,true)}<p class="hint">Tens is just left of ones.</p>`;
case 1:return digits(n,tens,true,false,tens)+`<p class="caption">Copy from the left. Stop after the tens digit.</p><div class="build" id="copy-row"><span class="slot" id="copy-value"></span></div><button id="copy" class="secondary replay">Watch the digits copy</button>`;
case 2:return `<div class="build"><span>${prefix}</span><span>→</span><span>${prefix}<mark>0</mark></span></div><p class="caption">${fmt(low())} is the lower ten.</p>`;
case 3:return `<p class="caption">Add 10 to the lower ten.</p><p class="small">Lower ten: ${fmt(low())}</p><div id="add-digits">${digits(low(),String(low()).length-2,true)}</div><p id="add-note" class="caption">Add one ten.</p><button id="add" class="secondary replay">Watch +10</button><p class="hint" id="ten-options" hidden></p>`;
case 4:return digits(n,String(n).length-1,true)+`<p class="caption">Look at the ones digit: ${ones()}.</p>`;
case 5:return `<div class="number">${fmt(n)}</div>`+hill();}}
function activity(){const tens=String(n).length-2;switch(step){case 0:return digits(n,-1,false,true);case 1:return digits(n,tens,false,false,tens)+`<p class="hint">Copy from the left. Stop after the tens digit.</p>`+form('Type the copied digits');case 2:return `<div class="build">${Math.floor(n/10)} <span>→</span> ?</div>`+form('Type the lower ten');case 3:return `<p class="caption">Add 10 to the lower ten.</p><div class="equation">${fmt(low())} + 10 = ?</div>`+form('Type the higher ten');case 4:return digits(n,-1,false,true);case 5:return `<div class="number">${fmt(n)}</div><div class="choices"><button data-answer="${low()}">${fmt(low())}</button><button data-answer="${high()}">${fmt(high())}</button></div>`;}}
function render(){stopMotion();document.querySelector('#progress').textContent='★'.repeat(streak)+'☆'.repeat(3-streak)+'  '+streak+'/3';document.querySelector('#help').hidden=!['independent','retry'].includes(mode);app.classList.toggle('hill-card',mode==='steps'&&step===5&&show);
document.querySelector('#full-practice').hidden=!['independent','retry','success','win'].includes(mode);
if(mode==='full'){renderFull();return}
if(mode==='steps'&&step===5){renderHill();return}
if(mode==='win'){app.innerHTML='<div class="tag">Practice complete</div><h2>Three in a row!</h2><div class="number">★★★</div><p>You rounded independently.</p><button id="again" class="primary">Play again</button>';document.querySelector('#again').onclick=reset;return}
if(mode==='success'){app.innerHTML=`<div class="tag">Correct</div><h2>${fmt(n)} ≈ ${fmt(answer())}</h2><p>${supported?'Now try a fresh question.':'One independent answer completed.'}</p><button id="next" class="primary">Next question</button>`;document.querySelector('#next').onclick=next;return}
if(mode==='bridge'){app.innerHTML=`<div class="tag">Write the number</div><h2>${fmt(n)} rounds to ${fmt(answer())}.</h2><p class="caption">Your answer is <strong>${fmt(answer())}</strong>.</p><p class="hint">Write the number, not “higher ten” or “lower ten”.</p><button id="retry" class="primary">My turn</button>`;document.querySelector('#retry').textContent='Practise all the steps together';document.querySelector('#retry').onclick=()=>beginFull();return}
const correction=mode==='steps';app.innerHTML=`<div class="tag">${correction?(show?'Watch':'Your turn'):mode==='retry'?'Try it without help':'Your question'}</div><h2>${correction?titles[step]:`Round ${fmt(n)} to the nearest ten.`}</h2>${correction?(show?teach():activity()):form('Write your answer as a number')} ${correction&&show?'<button id="myturn" class="primary">My turn</button>':''}<div id="feedback" role="status" aria-live="polite"></div>`;
if(show&&correction){document.querySelector('#myturn').onclick=()=>{show=false;render()};if(step===1)document.querySelector('#copy').onclick=copyDigits;if(step===3)document.querySelector('#add').onclick=addTen;if(step===5){ballAt(ones());document.querySelector('#roll').onclick=rollBall}return}
app.querySelectorAll('[data-digit]').forEach(b=>b.onclick=()=>submit(Number(b.dataset.digit)));
app.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>submit(Number(b.dataset.answer)));
const f=app.querySelector('form');if(f)f.onsubmit=e=>{e.preventDefault();const v=document.querySelector('#entry').value.trim();if(!/^(?:\d+|\d{1,3}(?:,\d{3})+|\d{1,3}(?: \d{3})+)$/.test(v)){document.querySelector('#feedback').textContent=/higher|lower/i.test(v)?'Write the number itself.':'Type a number, then tap Check.';return}submit(Number(v.replace(/[ ,]/g,'')))};
}
function timeline(duration,update,done){stopMotion();const token=animationToken;let start=null;function tick(t){if(token!==animationToken)return;if(start===null)start=t;const progress=Math.min(1,(t-start)/duration);update(progress);if(progress<1)frame=requestAnimationFrame(tick);else if(done)done()}frame=requestAnimationFrame(tick)}
function copyDigits(){const prefix=String(Math.floor(n/10));timeline(prefix.length*650+400,p=>{const count=Math.min(prefix.length,Math.floor(p*(prefix.length+1)));document.querySelector('#copy-value').textContent=prefix.slice(0,count);const ds=app.querySelectorAll('.digits .digit');ds.forEach((d,i)=>d.classList.toggle('focus',i===Math.min(count,prefix.length-1)));});}
function addTen(){document.querySelector('#ten-options').hidden=true;const lo=low(),hi=high(),a=String(lo).padStart(String(hi).length,'0'),b=String(hi),len=b.length,carry=a[len-2]==='9';let last=-1;timeline(carry?4200:2800,p=>{const phase=Math.min(carry?3:2,Math.floor(p*(carry?4:3)));if(phase===last)return;last=phase;const box=document.querySelector('#add-digits'),note=document.querySelector('#add-note');if(phase===0){box.innerHTML=digits(lo,String(lo).length-2,true);note.textContent='Add 1 to the tens digit.'}else if(phase===1){note.textContent=`${a[len-2]} tens + 1 ten = ${Number(a[len-2])+1} tens`;box.innerHTML=digits(lo,String(lo).length-2,true)}else if(carry&&phase===2){note.textContent='10 tens = 1 hundred. Carry to the left.';box.innerHTML=digits(hi,len-3,true)}else{box.innerHTML='<div class="digits">'+b.split('').map((d,i)=>`<span class="digit ${a[i]!==d?'focus':''}"><small>${['Ones','Tens','Hundreds','Thousands','Ten thousands'][len-1-i]}</small>${d}</span>`).join('')+'</div>';note.textContent=`${fmt(lo)} + 10 = ${fmt(hi)}. The higher ten is ${fmt(hi)}.`;const options=document.querySelector('#ten-options');options.hidden=false;options.textContent=`When rounding, choose ${fmt(lo)} or ${fmt(hi)}.`}})}
let hillPhase='place';
function renderHill(){
 hillPhase='place';app.classList.add('hill-card');
 app.innerHTML=`<div class="tag">Your turn</div><h2 id="hill-title">Place the ball.</h2><div class="number">${fmt(n)}</div><p class="caption" id="motion-note">Tap on the digit in the ones place.</p><div class="mountain"><svg viewBox="0 0 680 350" preserveAspectRatio="none" aria-label="Rounding mountain" role="img"><path d="M55 230 L340 70 L625 230 Z" fill="#e3eff0" stroke="#547e85" stroke-width="4"/><g id="ball" visibility="hidden"><circle r="14" fill="#e9a829" stroke="#70480e" stroke-width="3"/><path d="M-13 0 H13 M0 -13 V13" stroke="#70480e" stroke-width="2"/></g></svg>${Array.from({length:11},(_,i)=>`<button class="hill-point" data-point="${i}" style="left:${(55+i*57)/680*100}%;top:${(230-Math.min(i,10-i)*32)/350*100}%" aria-label="Place ball at ${i}" ${i===10?'disabled':''}>${i}</button>`).join('')}<button class="hill-end left" data-end="${low()}" disabled>${fmt(low())}</button><button class="hill-end right" data-end="${high()}" disabled>${fmt(high())}</button></div><button id="roll" class="secondary replay" hidden>Watch it roll</button><button id="hill-retry" class="primary" hidden>My turn</button><div id="feedback" role="status" aria-live="polite"></div>`;
 app.querySelectorAll('[data-point]').forEach(b=>b.onclick=()=>placeBall(Number(b.dataset.point)));
 app.querySelectorAll('[data-end]').forEach(b=>b.onclick=()=>chooseEnd(Number(b.dataset.end)));
 document.querySelector('#roll').onclick=rollBall;
}
function mountainBall(p,angle=0){const b=document.querySelector('#ball');b.setAttribute('visibility','visible');b.setAttribute('transform',`translate(${55+p*57} ${211-Math.min(p,10-p)*32}) rotate(${angle})`)}
function placeBall(p){if(hillPhase!=='place')return;app.querySelectorAll('[data-point]').forEach(b=>b.disabled=true);mountainBall(p);
 if(p!==ones()){hillPhase='teach';document.querySelector('#motion-note').textContent=`The ones digit is ${ones()}. Put the ball at ${ones()}.`;mountainBall(ones());app.querySelector(`[data-point="${ones()}"]`).classList.add('teach-point');const retry=document.querySelector('#hill-retry');retry.hidden=false;retry.onclick=render;return}
 hillPhase='ready';document.querySelector('#hill-title').textContent='Watch the ball roll.';document.querySelector('#motion-note').textContent=`Ones digit: ${ones()}`;document.querySelector('#roll').hidden=false;
}
function rollBall(){if(!['ready','choose'].includes(hillPhase))return;hillPhase='rolling';app.querySelectorAll('[data-end]').forEach(b=>b.disabled=true);const start=ones(),end=start<5?0:10,roll=document.querySelector('#roll'),note=document.querySelector('#motion-note');roll.disabled=true;mountainBall(start);note.textContent=start===0?'0: the ball stays at the lower ten.':start<5?'0–4: roll to the lower ten.':'5–9: roll to the higher ten.';
 timeline(3000,p=>{const t=p===1?1:Math.max(0,(p-.18)/.82),pos=start+(end-start)*t;mountainBall(pos,(pos-start)*160)},()=>{hillPhase='choose';document.querySelector('#hill-title').textContent='Tap the ten where the ball stopped.';note.textContent=`${fmt(low())} or ${fmt(high())}?`;app.querySelectorAll('[data-end]').forEach(b=>b.disabled=false);roll.disabled=false;roll.textContent='Roll again'})
}
function chooseEnd(v){if(hillPhase!=='choose')return;if(v===answer()){if(mode==='full'){fullAnswers[5]=v;fullStep=6;render()}else{mode='bridge';show=false;render()}return}hillPhase='teach';app.querySelectorAll('[data-end]').forEach(b=>b.disabled=true);document.querySelector('#roll').hidden=true;document.querySelector('#feedback').textContent=`The ones digit is ${ones()}. Choose ${fmt(answer())}.`;const retry=document.querySelector('#hill-retry');retry.hidden=false;retry.onclick=()=>{document.querySelector('#ball').setAttribute('visibility','hidden');document.querySelector('#feedback').textContent='';retry.hidden=true;hillPhase='choose';app.querySelectorAll('[data-end]').forEach(b=>b.disabled=false)}}

let fullStep=0,fullAnswers=[],fullTeaching=false;
const fullLabels=['Find the tens digit','Copy from the left, including the tens digit','Put 0 after → lower ten','Add 10 → higher ten','Find the ones digit','Choose where the ball stops','Write the rounded number'];
function beginFull(){stopMotion();supported=true;streak=0;mode='full';fullStep=0;fullAnswers=[];fullTeaching=false;render()}
function fullTable(){return '<table class="full-sheet" aria-label="My rounding steps"><tbody>'+fullLabels.map((label,i)=>{let value='—';if(i<fullStep){if(i===0||i===4)value=String(n)[fullAnswers[i]];else if(i===2)value=fullAnswers[1]+' → '+fmt(fullAnswers[i]);else if(i===3)value=fmt(fullAnswers[2])+' + 10 = '+fmt(fullAnswers[i]);else value=fmt(fullAnswers[i]);}return `<tr class="${i===fullStep?'active':''}"><th scope="row"><span class="row-number">${i+1}</span>${label}</th><td class="${i<fullStep?'done':'pending'}">${i<fullStep?'✓ ':''}${value}</td></tr>`}).join('')+'</tbody></table>'}
function renderFull(){

function startHelp(){streak=0;supported=true;mode='steps';step=0;show=true;render()}
function submit(v){if(mode==='steps'){const expected=[String(n).length-2,Math.floor(n/10),low(),high(),String(n).length-1,answer()][step];if(v!==expected){show=true;render();return}step++;if(step===6){mode='bridge';show=false}else show=true;render();return}if(!['independent','retry'].includes(mode))return;if(v===answer()){if(mode==='independent'&&!supported)streak++;mode=streak===3?'win':'success';render()}else startHelp()}
function next(){round++;const d=[4,5,9,1,6,3,8,2,7][(round-1)%9];let candidates=[];for(let base=100;base<1000;base++){const v=base*10+d;if(!used.has(v))candidates.push(v)}if(!candidates.length){used=new Set([n]);return next()}n=candidates[Math.floor(Math.random()*candidates.length)];if(round%4===0){const cross=candidates.filter(v=>Math.floor(v/10)%10===9);if(cross.length)n=cross[Math.floor(Math.random()*cross.length)]}used.add(n);mode='independent';show=false;supported=false;render()}
function reset(){const previous=n;do{n=1000+Math.floor(Math.random()*9000)}while(n===previous||n%10===0);streak=0;mode='independent';step=0;show=false;supported=false;used=new Set([n]);round=0;render()}
