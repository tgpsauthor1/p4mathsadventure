#18324b}.row0{color:var(--green)}.row1{color:var(--purple)}.row0 input.cell{background:#dcf5e3;border-color:#267644}.row1 input.cell{background:#ede2ff;border-color:#7750a8}.row0 .rowlabel,.row1 .rowlabel{border-left:4px solid currentColor}.cell{width:54px;height:52px;text-align:center;border-radius:9px;padding:0;justify-self:center;font-size:29px}.carryline{min-height:48px}.carryline .cell{width:46px;height:44px;font-size:23px}.carryline span{font-size:23px}.carryline .rowlabel{font-size:13px!important}.used{text-decoration:line-through;text-decoration-thickness:2px;opacity:.65}.source{background:#dcf5e3;text-decoration:underline;text-underline-offset:6px;text-decoration-thickness:3px;border-radius:6px;font-weight:800}.source.second{background:#ede2ff}.carry-now{background:#fff0b3;border-bottom:3px double #a96800}.teach,.outline{background:#edf7f7;padding:14px 18px;border-radius:12px}.teach{background:#fff4dc;border-left:5px solid #d99a24}.teach .equation{margin:6px 0}.outline{font-size:17px;margin-bottom:14px}.memory{display:grid;gap:10px}.memory p{background:#edf7f7;border-radius:12px;padding:12px 16px;margin:0}.dots{display:flex;gap:7px}.dot{width:15px;height:15px;border:2px solid #8ea6b6;border-radius:50%}.dot.on{background:#087d83;border-color:#087d83}footer{margin-top:18px}.audio{font-size:14px;color:#526b7d;margin-top:10px}.choices{display:flex;gap:12px;flex-wrap:wrap;margin:16px 0}.success{background:#e9f8f0;border:1px solid #aad8be;border-radius:14px;padding:18px}.paper{background:#f0f5ff;padding:18px;border-radius:14px}.checklist{font-size:18px}.step-strip{font-size:16px;display:flex;gap:8px;justify-content:center;margin:8px 0}.step-strip span{padding:6px 12px;border-radius:8px;background:#f0f5f8}.step-strip .done{text-decoration:line-through}.step-strip .now{font-weight:700;border-bottom:3px solid #087d83}[hidden]{display:none!important}@media(max-width:600px){.wrap{padding:10px}.card{padding:18px 10px}.line{grid-template-columns:74px repeat(5,48px);font-size:28px}.cell{width:44px;height:48px;font-size:26px}.carryline .cell{width:44px}.rowlabel{font-size:12px!important}.labels{font-size:10px}.brand{font-size:15px}h1{font-size:24px}.equation{font-size:26px}.answer{width:130px}.secondary{padding:8px 10px}.step-strip{font-size:14px;gap:4px}.step-strip span{padding:6px 8px}}@media(max-width:360px){.wrap{padding:4px}.card{padding:14px 5px}.line{grid-template-columns:64px repeat(5,46px)}}

</style></head><body><div class="wrap"><header><div class="brand">✦ Long multiplication<br><span class="muted">3 digits × 2 digits</span></div><div id="progress"></div><button class="secondary" id="listen">Listen</button></header><main class="card" id="app"></main><div id="audio" class="audio" role="status"></div><footer><span class="muted">Take your time. Have paper ready.</span><button class="secondary" id="restart">Start again</button></footer></div>
<script>
'use strict';
const $=s=>document.querySelector(s),app=$('#app'),places=['ten thousands','thousands','hundreds','tens','ones'];
const pool=[[167,29],[248,36],[356,24],[278,43],[469,27],[584,32],[637,24],[726,38],[853,26],[192,47],[364,58],[475,63],[528,49],[681,35],[739,46],[862,57],[947,28],[316,72]];
let S={q:null,seen:new Set(),streak:0,mode:'test',stage:0,rows:[],carries:[],used:[],digit:0,phase:'mul',product:0,total:0,repair:false};
const blank=()=>Array(5).fill(''),digits=n=>String(n).padStart(5,' ').split('').map(x=>x.trim()),fmt=n=>n.toLocaleString('en-GB');
function data(){let[a,b]=S.q;return{a,b,m:[b%10,Math.floor(b/10)],top:[a%10,Math.floor(a/10)%10,Math.floor(a/100)],r:[a*(b%10),a*Math.floor(b/10)*10,a*b]};}
function stop(){if('speechSynthesis'in window)speechSynthesis.cancel();$('#audio').textContent='';}
function set(html){stop();app.innerHTML=html;$('#progress').innerHTML=`<div class="dots" aria-label="${S.streak} of 3 independent answers correct in a row">${[0,1,2].map(i=>`<span class="dot ${i<S.streak?'on':''}"></span>`).join('')}</div>`;window.scrollTo(0,0);}
const btn=(label,act,cls='primary')=>`<button type="button" class="${cls}" data-act="${act}">${label}</button>`;
const fb=()=>'<div id="feedback" class="feedback" role="status" aria-live="polite"></div>';
function msg(t){$('#feedback').textContent=t;}
function parse(v){v=v.trim();return /^(?:\d+|\d{1,3}(?:,\d{3})+|\d{1,3}(?: \d{3})+)$/.test(v)?Number(v.replace(/[, ]/g,'')):null;}
function next(){let avail=pool.filter(q=>!S.seen.has(q.join(',')));if(!avail.length){S.seen.clear();avail=pool.filter(q=>q.join(',')!==S.q?.join(','));}S.q=avail[Math.floor(Math.random()*avail.length)];S.seen.add(S.q.join(','));S.mode='test';test();}
function resetWork(){S.stage=0;S.rows=[blank(),blank(),blank()];S.carries=[blank(),blank()];S.used=[blank(),blank()];S.sumcarry=blank();S.digit=0;S.phase='mul';S.repair=false;}
function test(){let{a,b}=data();set(`<p class="eyebrow">${S.mode==='retry'?'TRY AGAIN ON PAPER':'YOUR TURN • ON PAPER'}</p><h1>What is <span class="token">${a} × ${b}</span>?</h1><p>Use long multiplication on paper.<br>Enter your answer as a number.</p><form id="testform"><div class="equation"><label for="answer">Answer</label><input id="answer" class="answer" inputmode="numeric" autocomplete="off"></div><div class="actions"><button class="primary">Check</button>${btn('Help me','help','secondary')}</div></form>${fb()}`);$('#testform').onsubmit=e=>{e.preventDefault();let n=parse($('#answer').value);if(n===null){msg('Enter a whole number, such as 240.');return;}if(n!==a*b){S.streak=0;startSupport();return;}let retry=S.mode==='retry';if(!retry)S.streak++;if(S.streak===3){complete();return;}set(`<p class="eyebrow">${retry?'PAPER RETRY COMPLETE':'CORRECT'}</p><h1>${fmt(a*b)} is correct.</h1><p>${retry?'Now try a fresh question from memory.':`${S.streak} of 3 independent answers correct in a row.`}</p>${btn('Next question','new')}`);};}
function startSupport(){S.streak=0;resetWork();S.mode='guide';guide();}
function input(id,label,value='',carry=false){return `<input class="cell" id="${id}" aria-label="${label}" inputmode="numeric" pattern="[0-9]*" maxlength="1" autocomplete="off" value="${value}">`;}
function staticLine(n,label='',cls='',focus=-1,second=false){return `<div class="line ${cls}"><span class="rowlabel">${label}</span>${digits(n).map((v,i)=>`<span class="${i===focus?'source '+(second?'second':''):''}">${v}</span>`).join('')}</div>`;}
function board({row=-1,edit=[],carryEdit=[],source=false,carryFocus=false,showRows=S.stage,headers=true}={}){let d=data(),k=S.stage;let h='<div class="board">';if(headers)h+='<div class="line labels"><span class="rowlabel">Place value</span><span>10 000</span><span>1 000</span><span>100</span><span>10</span><span>1</span></div>';
for(let j=0;j<2;j++){if(j>k&&S.mode!=='recall')continue;if(j>k)continue;h+=`<div class="line carryline row${j}"><span class="rowlabel">Row ${j+1}<br>carry</span>`;for(let i=0;i<5;i++){let editable=j===row&&carryEdit.includes(i);h+=editable?input('c'+i,`Row ${j+1} carry above ${places[i]} digit`,S.carries[j][i],true):`<span class="${S.used[j][i]?'used':''} ${carryFocus&&j===k&&i===4-S.digit?'carry-now':''}" ${S.used[j][i]?'aria-label="Used carry '+S.carries[j][i]+'"':''}>${S.carries[j][i]}</span>`;}h+='</div>';}
h+=staticLine(d.a,'','',source?4-S.digit:-1,k===1)+staticLine(d.b,'×','rule',source?4-k:-1,k===1);
if(showRows>=2){h+='<div class="line carryline"><span class="rowlabel">Addition<br>carry</span>';for(let i=0;i<5;i++)h+=row===2&&i<4?input('a'+i,`Addition carry in the ${places[i]} column`,S.sumcarry[i]):`<span class="${S.stage>2?'used':''}">${S.sumcarry[i]||''}</span>`;h+='</div>';}
for(let j=0;j<=Math.min(showRows,2);j++){h+=`<div class="line ${j<2?'row'+j:'sum'}"><span class="rowlabel">${j<2?'Row '+(j+1):'Total'}${j===1&&showRows>=2?' +':''}</span>`;for(let i=0;i<5;i++)h+=j===row&&edit.includes(i)?input('d'+i,`${places[i]} digit in ${j===2?'total':'row '+(j+1)}`,S.rows[j][i]):`<span>${S.rows[j][i]}</span>`;h+='</div>';}
return h+'</div>';}
function strip(){return `<div class="step-strip" aria-label="Multiply all three digits, right to left">${['Ones','Tens','Hundreds'].map((t,i)=>`<span class="${i<S.digit?'done':i===S.digit?'now':''}">${t}${i<S.digit?' ✓':''}</span>`).join('')}</div>`;}
function calcInfo(){let d=data(),k=S.stage,j=S.digit,m=d.m[k],x=d.top[j],carry=j?Number(S.carries[k][4-j]||0):0,product=x*m;return {d,k,j,m,x,carry,product,total:product+carry,col:4-j-k};}
function guide(){if(S.stage===2){rowEntry();return;}let z=calcInfo(),{d,k,j,m,x,carry,total,col}=z;let title='',body='',edit=[],ce=[],src=false,cf=false;
if(S.phase==='zero'){title='Start the tens row with 0.';body=`<p>The ${m} in ${d.b} means <strong>${m} tens</strong>. Products in this row are whole tens.</p><p><strong>Write 0 in the ones column.</strong></p>`;edit=[4];}
else if(S.phase==='mul'){title=`Multiply the ${['ones','tens','hundreds'][j]} digit.`;src=true;body=`<form id="calcform"><div class="equation"><label for="calc">${x} × ${m} =</label><input class="answer" id="calc" inputmode="numeric" autocomplete="off"></div></form>`;}
else if(S.phase==='add'){title='Now add this row’s carry.';cf=true;body=`<p class="muted">${x} × ${m} = ${S.product}</p><form id="calcform"><div class="equation"><label for="calc">${S.product} + ${carry} =</label><input class="answer" id="calc" inputmode="numeric" autocomplete="off"></div></form>`;}
else{title='Write the result in your working.';let n=S.total;body=`<p class="equation"><span>${x} × ${m}${carry?' + '+carry:''} = ${n}</span></p>`;if(j<2){edit=[col];ce=[3-j];body+=`<p><strong>Write ${n%10} in the ${places[col]} column.</strong><br>${n>=10?`Carry ${Math.floor(n/10)} above the ${d.top[j+1]} in ${d.a}.`:'No carry is needed. Leave the small box blank.'}</p>`;}else{edit=n>=10?[col-1,col]:[col];body+=`<p><strong>Write ${n} to the left of the last digit.</strong></p>`;}}
set(`<p class="eyebrow">${S.repair?'FIX THIS PART':'LET’S BUILD THE METHOD'} • ${d.a} × ${d.b} • ROW ${k+1}</p><h1>${title}</h1>${body}${strip()}${board({row:k,edit,carryEdit:ce,source:src,carryFocus:cf})}<div class="actions">${btn('Check this step','guidecheck')}${btn('Show this step','showstep','secondary')}</div>${fb()}`);
if($('#calcform'))$('#calcform').onsubmit=e=>{e.preventDefault();guideCheck();};wireCells();}
function wireCells(){app.querySelectorAll('input.cell').forEach(el=>el.oninput=()=>{el.value=el.value.replace(/\D/g,'').slice(0,1);});}
function guideExpected(){let z=calcInfo();return S.phase==='mul'?z.product:S.phase==='add'?S.product+z.carry:0;}
function guideCheck(){let z=calcInfo(),{k,j,col,total}=z;if(S.phase==='mul'||S.phase==='add'){let n=parse($('#calc').value);if(n===null){msg('Enter a whole number first.');return;}if(n!==guideExpected()){showStep();return;}if(S.phase==='mul'){S.product=n;if(z.carry){S.phase='add';guide();return;}}S.total=n;S.phase='place';guide();return;}
let expect={};if(S.phase==='zero')expect.d4='0';else{if(j<2){expect['d'+col]=String(S.total%10);expect['c'+(3-j)]=S.total>=10?String(Math.floor(S.total/10)):'';}else{String(S.total).split('').forEach((v,i,arr)=>expect['d'+(col-arr.length+1+i)]=v);}}
let missing=false,wrong=false;for(let[id,val]of Object.entries(expect)){let got=$('#'+id).value;if(val&&got==='')missing=true;else if(got!==val&&!(val===''&&got==='0'))wrong=true;}if(wrong){showStep();return;}if(missing){msg('Finish the highlighted boxes. Keep the digits you have entered.');return;}
for(let[id,val]of Object.entries(expect)){if(id[0]==='d')S.rows[k][+id.slice(1)]=$('#'+id).value;else S.carries[k][+id.slice(1)]=$('#'+id).value;}
if(S.phase==='zero'){S.phase='mul';guide();return;}if(z.carry)S.used[k][4-j]=true;
if(S.repair){S.repair=false;S.mode='recall';S.phase='entry';rowEntry();return;}
S.digit++;if(S.digit===3){S.stage++;S.digit=0;S.phase=S.stage===1?'zero':'entry';}else S.phase='mul';guide();}
function showStep(){let z=calcInfo(),{x,m,carry,k,j,col,d}=z,body='';if(S.phase==='mul')body=`<div class="equation">${x} × ${m} = ${z.product}</div><p>${m} groups of ${x} make ${z.product}.</p>`;else if(S.phase==='add')body=`<div class="equation">${S.product} + ${carry} = ${S.product+carry}</div><p>Add the carry from row ${k+1}, above the ${x}.</p>`;else if(S.phase==='zero')body=`<p>${m} means ${m} tens. This row is ${d.a} × ${m*10}.</p><p>Write <strong>0 in the ones column</strong>, directly below the ones digit of row 1.</p>`;else body=`<div class="equation">${x} × ${m}${carry?' + '+carry:''} = ${S.total}</div><p>${j<2?`Write <strong>${S.total%10}</strong> in the ${places[col]} column. ${S.total>=10?`Carry <strong>${Math.floor(S.total/10)}</strong> above the ${d.top[j+1]}.`:'There is no new carry.'}`:`Write <strong>${S.total}</strong> to the left of the digits already written.`}</p>`;
// Preserve only completed work. The answer is removed on My turn.
set(`<p class="eyebrow">LOOK AT THIS STEP</p><h1>${S.phase==='add'?'Multiply first. Then add the carry.':'Try this part again.'}</h1><div class="teach">${body}</div>${board({source:S.phase==='mul',carryFocus:S.phase==='add'})}<div class="actions">${btn('Hide it — my turn','hideguide')}</div>`);}
function connect(){S.mode='connect';let d=data();set(`<p class="eyebrow">PUT THE METHOD TOGETHER</p><h1>${d.a} × ${d.b}</h1><div class="memory"><p><strong>1. Multiply by ${d.m[0]}.</strong> Ones, tens, hundreds. Multiply first, then add the carry.</p><p><strong>2. Multiply by ${d.m[1]*10}.</strong> Start with 0 in the ones column. Use a new set of carries.</p><p><strong>3. Add the rows.</strong> Keep the columns straight.</p></div>${board({showRows:2,headers:false})}<p class="muted">Next, hide this working and build whole rows yourself.</p>${btn('Practise all steps','recall')}`);}
function recall(){resetWork();S.mode='recall';S.phase='choose';choose();}
function choose(){let d=data();set(`<p class="eyebrow">PRACTISE ALL STEPS • ${d.a} × ${d.b}</p><div class="outline">Choose the operation. Complete its row. Check your working.</div><h1>${S.stage===0?'Which operation starts the working?':'Which operation comes next?'}</h1>${board({showRows:S.stage-1,headers:false})}<div class="choices">${btn('× '+d.m[1]*10,'pick1','secondary')}${btn('Add the rows','pick2','secondary')}${btn('× '+d.m[0],'pick0','secondary')}</div>${fb()}`);}
function pick(n){if(n!==S.stage){let d=data();set(`<p class="eyebrow">LOOK AT THE ORDER</p><h1>${S.stage===0?'Start with the ones digit.':S.stage===1?'Both multiplier digits are needed.':'Both multiplication rows are complete.'}</h1><div class="teach"><p>${S.stage===0?`${d.b} = ${d.m[1]*10} + ${d.m[0]}. Start with × ${d.m[0]}.`:S.stage===1?`You have multiplied by ${d.m[0]}. Now multiply by ${d.m[1]*10}.`:'Add the two partial products to find the total.'}</p></div>${board({showRows:S.stage-1,headers:false})}${btn('Hide it — my turn','hidechoice')}`);return;}S.phase='entry';rowEntry();}
function rowEntry(){let d=data(),k=S.stage;set(`<p class="eyebrow">${S.mode==='recall'?'PRACTISE ALL STEPS':'FINISH THE WORKING'} • ${d.a} × ${d.b}</p>${S.mode==='recall'?'<div class="outline">Choose the operation. Complete its row. Check your working.</div>':''}<h1>${k===2?(S.mode==='guide'?'Add from the ones column.':'Add the two rows.'):`Complete row ${k+1} yourself.`}</h1><p class="muted">One digit per box. Leave unused boxes blank. Use the small boxes for carries.</p>${board({row:k,edit:[0,1,2,3,4],carryEdit:k<2?[2,3]:[]})}<div class="actions">${btn(k===2?'Check the total':'Check the row','checkrow')}</div>${fb()}`);wireCells();}
function readRow(){for(let i=0;i<5;i++)S.rows[S.stage][i]=$('#d'+i).value;if(S.stage<2)for(let i of [2,3])S.carries[S.stage][i]=$('#c'+i).value;else for(let i=0;i<4;i++)S.sumcarry[i]=$('#a'+i).value;}
function trueCarry(k){let d=data(),a=Math.floor(d.top[0]*d.m[k]/10),b=Math.floor((d.top[1]*d.m[k]+a)/10);return{2:b,3:a};}
function checkRow(){readRow();let k=S.stage,d=data(),ex=digits(d.r[k]),v=S.rows[k];let bad=[];for(let i=0;i<5;i++)if(v[i]!==''&&v[i]!==ex[i]&&!(ex[i]===''&&v[i]==='0'))bad.push(i);
if(bad.length){repairRow(Math.max(...bad));return;}
if(ex.some((x,i)=>x&&v[i]==='')){msg('The digits entered are correct so far. Finish the '+(k===2?'total':'row')+'.');return;}
if(k<2){let cs=trueCarry(k);for(let i of [2,3])if(S.carries[k][i]!==''&&Number(S.carries[k][i])!==cs[i]){showCarry(i,cs[i]);return;}for(let i of [2,3])if(S.carries[k][i])S.used[k][i]=true;}
if(k===2){let c=0,a=digits(d.r[0]),b=digits(d.r[1]);for(let i=4;i>0;i--){c=Math.floor((Number(a[i])+Number(b[i])+c)/10);if(S.sumcarry[i-1]!==''&&Number(S.sumcarry[i-1])!==c){S.fixAdd=i-1;set(`<p class="eyebrow">CHECK THE ADDITION CARRY</p><h1>Carry into the next column.</h1><div class="teach"><p>The ${places[i]} column gives a carry of ${c} into the ${places[i-1]} column.</p></div>${board()}${btn('Hide it — my turn','hideadd')}`);return;}}}
S.stage++;if(S.stage===3){if(S.mode==='recall')remember();else connect();return;}S.phase='choose';choose();}
function showCarry(i,want){let d=data(),k=S.stage,j=3-i,old=j?trueCarry(k)[3]:0;S.fixCarry=i;set(`<p class="eyebrow">CHECK THIS CARRY • ROW ${k+1}</p><h1>Use the carry from this row.</h1><div class="teach"><p class="equation">${d.top[j]} × ${d.m[k]}${old?' + '+old:''} = ${d.top[j]*d.m[k]+old}</p><p>${want?`Carry ${want} above the ${d.top[j+1]} in ${d.a}.`:'No carry is needed here.'}</p></div>${board()}${btn('Hide it — my turn','hidecarry')}`);}
function repairRow(col){let k=S.stage,d=data();if(k===2){let a=digits(d.r[0]),b=digits(d.r[1]),c=0;for(let i=4;i>col;i--)c=Math.floor((Number(a[i])+Number(b[i])+c)/10);let t=Number(a[col])+Number(b[col])+c;S.fixCol=col;set(`<p class="eyebrow">CHECK THE ${places[col].toUpperCase()} COLUMN</p><h1>Add down one column.</h1><div class="teach"><p class="equation">${Number(a[col])} + ${Number(b[col])}${c?' + '+c:''} = ${t}</p><p>Write ${t%10} in the ${places[col]} column.${t>=10?' Carry 1 into the next column on the left.':''}</p></div>${board()}${btn('Hide it — my turn','hidesum')}`);return;}
if(k===1&&col===4){S.fixCol=col;set(`<p class="eyebrow">CHECK THE TENS ROW</p><h1>The ${d.m[1]} means ${d.m[1]} tens.</h1><div class="teach"><p>Row 2 is ${d.a} × ${d.m[1]*10}. It must have <strong>0 in the ones column</strong>.</p></div>${board()}${btn('Hide it — my turn','hidesum')}`);return;}
S.digit=Math.min(2,Math.max(0,4-col-k));let j=S.digit;S.repair=true;S.phase='mul';if(j){S.carries[k][4-j]=String(trueCarry(k)[4-j]||'');S.used[k][4-j]='';}S.rows[k][col]='';if(j===2)S.rows[k][col-1]='';guide();}
function remember(){S.mode='remember';set(`<p class="eyebrow">YOU BUILT THE WHOLE METHOD</p><h1>Remember it for paper.</h1>${board({showRows:2,headers:false})}<div class="memory"><p><strong>Ones, tens, hundreds:</strong> multiply, add the carry, write. Cross out each used carry.</p><p><strong>New row:</strong> start with 0. Use the tens digit and new carries. Then add from the ones column, keeping columns straight.</p></div><p class="muted">Cover your earlier working. Next, do the original question on a fresh part of your paper.</p>${btn('Hide the method — paper retry','retry')}`);}
function complete(){S.mode='complete';set(`<p class="eyebrow">PRACTICE COMPLETE</p><h1>Three fresh answers correct in a row.</h1><div class="success">You solved them without on-screen help.</div><div class="paper"><h2>Keep the method in your memory</h2><p>Tomorrow, try a fresh question on paper before opening this activity.</p></div>${btn('Practise again','restart')}`);}
app.addEventListener('click',e=>{let b=e.target.closest('[data-act]');if(!b)return;let a=b.dataset.act;if(a.startsWith('pick')){pick(Number(a.slice(4)));return;}switch(a){case'new':next();break;case'help':startSupport();break;case'guidecheck':guideCheck();break;case'showstep':showStep();break;case'hideguide':guide();break;case'recall':recall();break;case'hidechoice':choose();break;case'checkrow':checkRow();break;case'hideadd':S.sumcarry[S.fixAdd]='';rowEntry();break;case'hidecarry':S.carries[S.stage][S.fixCarry]='';rowEntry();break;case'hidesum':S.rows[S.stage][S.fixCol]='';rowEntry();break;case'retry':S.mode='retry';resetWork();test();break;case'restart':restart();break;}});
app.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.matches('.cell')){e.preventDefault();if((S.mode==='guide'&&S.stage<2)||S.repair)guideCheck();else checkRow();}});
function restart(){S.streak=0;next();}$('#restart').onclick=restart;
$('#listen').onclick=()=>{if(!('speechSynthesis'in window)){ $('#audio').textContent='Read-aloud is unavailable. All instructions are on screen.';return;}if(speechSynthesis.speaking){stop();return;}let u=new SpeechSynthesisUtterance(app.innerText.replace(/×/g,' times ').replace(/=/g,' equals '));u.lang='en-GB';u.rate=.85;window.currentSpeech=u;u.onerror=()=>$('#audio').textContent='Voice unavailable. Use the instructions on screen.';if(!speechSynthesis.getVoices().length)$('#audio').textContent='Read-aloud depends on the voices on this device.';speechSynthesis.speak(u);};next();
</script></body></html>
