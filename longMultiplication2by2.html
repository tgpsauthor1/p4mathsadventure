<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Long multiplication • Build it, remember it</title>
<style>
:root{font-family:Arial,sans-serif;color:#18324b;background:#edf5fb;font-size:20px}*{box-sizing:border-box}body{margin:0}button,input{font:inherit}button{cursor:pointer;min-height:48px;border:2px solid #c6d5e1;border-radius:12px;background:white;color:#18324b;padding:10px 18px;font-weight:700}button:hover{border-color:#087d83}button:focus-visible,input:focus-visible{outline:3px solid #e98b18;outline-offset:3px}.primary{background:#087d83;color:white;border-color:#087d83}.secondary{font-size:16px;background:transparent}.wrap{max-width:850px;margin:auto;padding:24px}header{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-bottom:22px}.brand{font-size:18px;font-weight:700}.dots{display:flex;gap:7px}.dot{width:16px;height:16px;border:2px solid #8ea6b6;border-radius:50%}.dot.on{background:#087d83;border-color:#087d83}.card{background:white;border-radius:24px;padding:28px;box-shadow:0 8px 35px #19324a0b;border:1px solid #dae6ee}.eyebrow{font-size:15px;font-weight:700;color:#537083;letter-spacing:.03em;margin:0 0 10px}h1{font-size:29px;line-height:1.25;margin:0 0 18px}h2{font-size:23px;margin:10px 0}p{line-height:1.5;margin:10px 0}.question{font-size:46px;font-weight:bold;white-space:nowrap;margin:24px 0}.equation{display:flex;gap:14px;align-items:center;flex-wrap:wrap}.answer{width:190px;font-size:32px;border:2px solid #7493a7;border-radius:12px;padding:10px;min-height:58px}.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:22px}.muted{color:#547083;font-size:17px}.feedback{min-height:28px;font-size:18px;font-weight:700;color:#8a4a05;margin-top:14px}.outline{background:#eef7f8;padding:12px 16px;border-radius:12px;font-size:17px;margin-bottom:20px}.math{white-space:nowrap}.board{width:max-content;max-width:100%;margin:16px auto}.line{display:grid;grid-template-columns:52px repeat(4,64px);align-items:center;min-height:56px;text-align:center;font-size:34px;font-variant-numeric:tabular-nums}.line.labels{font-size:13px;color:#587083;min-height:32px}.line.rule{border-bottom:2px solid #18324b}.line.sum{border-top:2px solid #18324b}.line input{width:54px;height:54px;text-align:center;font-size:30px;border:2px solid #7493a7;border-radius:9px;background:#fffdf7;padding:0}.line span{padding:5px 0}.rowlabel{font-size:16px!important;color:#42647b}.active-row{background:#f1f8fa;border-radius:10px;padding:5px 0}.carryarea{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap;margin:15px 0 4px;font-size:17px}.carryarea input{width:50px;height:48px;border:2px solid #7493a7;border-radius:8px;text-align:center;font-size:24px}.used{text-decoration:line-through;text-decoration-thickness:3px;color:#6a7780}.carryarea button{font-size:16px;padding:6px 12px}.past{font-size:16px;color:#627382;text-align:center;margin:5px}.teach{background:#fff5df;border-left:5px solid #eba22e;padding:16px 20px;border-radius:12px;margin:16px 0}.teach p{font-size:21px}.teach .big{font-size:28px;font-weight:700}.memory{display:grid;gap:12px}.memory p{padding:14px 18px;border-radius:14px;margin:0;background:#edf7f7}.memory strong{color:#086f75}.choices{display:flex;gap:14px;justify-content:center;margin:22px 0}.choice{font-size:34px;min-width:75px}.selectsource{display:flex;justify-content:flex-end;gap:8px}.strip{display:flex;gap:10px;align-items:center;justify-content:center}.pill{border-radius:20px;background:#fff0d1;padding:8px 15px;font-weight:700}.audio{margin-top:12px;color:#547083;font-size:14px}.success{background:#e9f8f0;border:1px solid #aad8be;padding:18px;border-radius:16px}.tiny{font-size:15px}.paper{padding:20px;background:#f0f5ff;border-radius:16px;margin-top:20px}footer{display:flex;justify-content:space-between;margin-top:18px;gap:12px;align-items:center}@media(max-width:550px){.wrap{padding:12px}.card{padding:20px 14px}header{margin-bottom:15px}h1{font-size:25px}.question{font-size:39px}.line{grid-template-columns:38px repeat(4,58px)}.line input{width:50px;height:52px}.brand{font-size:15px}.teach{padding:14px}.teach p{font-size:19px}.answer{width:160px}.line.labels{font-size:12px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}

/* Active inputs use both a strong border and a visible fill. */
input.answer,.line input:not(:disabled),.carryline input:not(:disabled){background:#fff0b3;border:3px solid #a96800;box-shadow:0 0 0 3px #fff8df}
input:focus{outline:3px solid #087d83;outline-offset:3px;background:#fff9df!important}
.line input:disabled{background:transparent;border:2px solid transparent;color:#18324b;opacity:1;-webkit-text-fill-color:#18324b}
.carryline{min-height:55px}.carryline input{width:46px;height:46px;font-size:24px;text-align:center;border-radius:8px;padding:0;justify-self:center}
.carryline .carrylabel{grid-column:1/4;text-align:right;padding-right:12px;font-size:16px;color:#536b7c}
.carryline input:disabled{border:0;background:transparent;color:#526476;opacity:1;-webkit-text-fill-color:#526476}
.inputkey{font-size:16px;color:#72500a;margin:5px 0 12px}.keybox{display:inline-block;background:#fff0b3;border:2px solid #a96800;width:17px;height:17px;vertical-align:-2px;margin-right:6px}

.line.row-one input:not(:disabled){background:#dcf5e3;border-color:#267644;box-shadow:0 0 0 3px #edf9ef}
.line.row-two input:not(:disabled){background:#ede2ff;border-color:#7750a8;box-shadow:0 0 0 3px #f6f0ff}
.line.row-one input:focus{background:#dcf5e3!important}.line.row-two input:focus{background:#ede2ff!important}
.line.row-one .carrylabel,.line.row-one .rowlabel{color:#22653b;font-weight:700}
.line.row-two .carrylabel,.line.row-two .rowlabel{color:#694096;font-weight:700}
.rowlabel small{display:block;font-size:12px;white-space:nowrap}.rowlabel b{display:block;font-size:20px}

.mul-focus{font-weight:800;text-decoration:underline;text-decoration-thickness:3px;text-underline-offset:5px;border-radius:5px;background:#dcf5e3;color:#22653b}
.mul-focus.second{background:#ede2ff;color:#694096}

</style></head><body><div class="wrap"><header><div class="brand">✦ Long multiplication</div><div id="progress"></div><button class="secondary" id="listen" aria-label="Read this screen aloud">Listen</button></header><main class="card" id="app"></main><div class="audio" id="audio" role="status"></div><footer><span class="muted">Take your time. Use paper too.</span><button class="secondary" id="restart">Start again</button></footer></div>
<script>
'use strict';
const $=s=>document.querySelector(s),app=$('#app');
const pool=[[67,29],[47,26],[58,34],[76,23],[32,21],[64,32],[39,42],[86,24],[57,36],[48,27],[73,25],[68,43],[54,28],[36,24],[82,31],[46,35]];
let S={q:null,seen:new Set(),streak:0,mode:'test',stage:0,rows:[],carry:['',''],cross:[false,false],phase:'row',failures:{},supported:false,demo:null,after:null};
const fmt=n=>n.toLocaleString('en-GB');
function data(){const[a,b]=S.q;return{a,b,u:a%10,t:Math.floor(a/10),v:b%10,w:Math.floor(b/10),r:[a*(b%10),a*Math.floor(b/10)*10,a*b]};}
function expected(k){return String(data().r[k]).padStart(4,' ').split('');}
function stop(){if('speechSynthesis'in window)speechSynthesis.cancel();$('#audio').textContent='';}
function set(html){stop();app.innerHTML=html;$('#progress').innerHTML=`<div class="dots" aria-label="${S.streak} of 3 independent answers correct">${[0,1,2].map(i=>`<span class="dot ${i<S.streak?'on':''}"></span>`).join('')}</div>`;window.scrollTo(0,0);}
function msg(t){$('#feedback').textContent=t;}
function feedback(){return '<div id="feedback" class="feedback" role="status" aria-live="polite"></div>';}
function button(text,act,cls='primary'){return `<button class="${cls}" data-act="${act}">${text}</button>`;}
function chooseNew(){let available=pool.filter(q=>!S.seen.has(q.join(',')));if(!available.length){S.seen.clear();available=pool.filter(q=>q.join(',')!==S.q?.join(','));}S.q=available[Math.floor(Math.random()*available.length)];S.seen.add(S.q.join(','));S.supported=false;S.mode='test';test();}
function parse(v){v=v.trim();if(!/^(?:\d+|\d{1,3}(?:,\d{3})+|\d{1,3}(?: \d{3})+)$/.test(v))return null;return Number(v.replace(/[, ]/g,''));}
function test(){let{a,b}=data();set(`<p class="eyebrow">${S.mode==='retry'?'TRY THE WHOLE QUESTION AGAIN':'YOUR TURN'}</p><h1>Use long multiplication.</h1><p class="muted">Work on paper. Enter your answer.</p><form id="answerform"><div class="equation"><label for="answer" class="question">${a} × ${b} =</label><input id="answer" class="answer" inputmode="numeric" autocomplete="off" aria-label="Answer"></div><div class="actions"><button class="primary" type="submit">Check</button>${button('Help me','help','secondary')}</div></form>${feedback()}`);$('#answerform').onsubmit=e=>{e.preventDefault();let n=parse($('#answer').value);if(n===null){msg('Enter a whole number, such as 240.');return;}if(n===a*b){if(S.mode==='test'&&!S.supported)S.streak++;if(S.streak>=3){complete();return;}set(`<p class="eyebrow">${S.mode==='retry'?'RETRY COMPLETE':'CORRECT'}</p><h1>${fmt(a*b)} is correct.</h1><p>${S.mode==='retry'?'Now try a new question without help.':`${S.streak} of 3 independent answers correct in a row.`}</p><div class="actions">${button('Next question','new')}</div>`);}else{S.streak=0;startSupport();}};}
function startSupport(){S.streak=0;S.supported=true;S.failures={};S.mode='diagnose';S.stage=0;S.rows=[];S.carry=['',''];S.cross=[false,false];S.phase='row';S.sub=1;S.demo=null;workspace();}
function activeCells(){if(S.mode!=='diagnose'||S.stage===2)return [0,1,2,3];if(S.sub===0)return [3];if(S.sub===1)return [S.stage===0?3:2];return S.stage===0?[0,1,2]:[0,1];}
function grid(k,editable=false,vals=null,labels=true){const{a,b}=data();let h='<div class="board">';if(labels)h+='<div class="line labels"><span></span><span>Thousands</span><span>Hundreds</span><span>Tens</span><span>Ones</span></div>';
if(editable&&k<2){let enabled=S.mode!=='diagnose'||S.sub===1;h+=`<div class="line carryline"><label class="carrylabel" for="carry">Carry</label><input id="carry" inputmode="numeric" maxlength="1" aria-label="Carry above the tens digit ${Math.floor(a/10)}" value="${S.carry[k]}" class="${S.cross[k]?'used':''} ${S.mode==='diagnose'&&S.sub===2&&S.carry[k]?'carry-add':''}" ${enabled?'':'disabled'}><span></span></div>`;}
if(!editable&&S.demo&&k<2){let c=Math.floor(data().u*(k===0?data().v:data().w)/10);if(c)h+=`<div class="line carryline"><span class="carrylabel">${S.sub===2?'Used carry':'Carry'}</span><span class="${S.sub===2?'used':''}">${c}</span><span></span></div>`;}
let focus=S.mode==='diagnose'&&k<2&&S.sub>0;h+=staticLine(a,'','',focus?(S.sub===1?3:2):-1,k)+staticLine(b,'×','rule',focus?(k===0?3:2):-1,k);for(let j=0;j<=k;j++){const v=vals&&j===k?vals:(S.rows[j]||['','','','']);h+=`<div class="line ${j===2?'sum ':''}${editable&&j===k?'active-row':''}"><span class="rowlabel">${j===1&&k===2?'+':''}</span>`;for(let i=0;i<4;i++){h+=editable&&j===k?`<input class="digit" id="d${i}" aria-label="${['Thousands','Hundreds','Tens','Ones'][i]} digit in ${j===2?'total':'row '+(j+1)}" inputmode="numeric" maxlength="1" autocomplete="off" value="${v[i]||''}" ${activeCells().includes(i)?'':'disabled'}>`:`<span>${v[i]||''}</span>`;}h+='</div>';}return h+'</div>';}
function staticLine(n,s='',cls='',focus=-1,row=0){return `<div class="line ${cls}"><span>${s}</span>${String(n).padStart(4,' ').split('').map((d,i)=>`<span class="${i===focus?'mul-focus '+(row===1?'second':''):''}" ${i===focus?'aria-label="'+d+', multiply this digit"':''}>${d}</span>`).join('')}</div>`;}
function workspace(){const{a,b,v,w}=data();let rehearse=S.mode==='rehearse';let prompt=S.stage===0?`Multiply ${a} by ${v}.`:S.stage===1?`Multiply ${a} by ${w*10}.`:'Add the two rows.';
if(!rehearse&&S.stage<2){let d=data(),m=S.stage===0?d.v:d.w,c=Math.floor(d.u*m/10);prompt=S.sub===0?`Multiply by ${m*10}. Write 0 in the ones column.`:S.sub===1?`${d.u} × ${m}: write the ${S.stage===0?'ones':'tens'} digit and carry if needed.`:`${d.t} × ${m}${c?`, then add the carried ${c}`:''}.`;}
if(S.mode==='diagnose'&&S.stage<2&&S.sub>0){const tone=S.stage===1?' second':'';prompt=prompt.replace(/^(\d+) × (\d+)/,(_,x,y)=>`<span class="mul-focus${tone}">${x}</span> × <span class="mul-focus${tone}">${y}</span>`);}
if(rehearse&&S.phase==='choose'){set(`<p class="eyebrow">PRACTISE ALL STEPS • ${a} × ${b}</p><div class="outline">Multiply each part. Then add the rows.</div><h1>Which digit will you multiply by ${S.stage===0?'first':'next'}?</h1>${grid(S.stage-1,false,null,false)}<div class="choices"><button class="choice" data-mult="${w}">${w}</button><button class="choice" data-mult="${v}">${v}</button></div>${feedback()}`);return;}
set(`<p class="eyebrow">${rehearse?'PRACTISE ALL STEPS':'LET’S CHECK YOUR WORKING'} • ${a} × ${b}</p>${rehearse?'<div class="outline">Multiply each part. Then add the rows.</div>':''}<h1>${prompt}</h1><p class="inputkey"><span class="keybox"></span>Type in the yellow boxes.</p><p class="muted">${S.stage===2?'Enter the whole total below the line.':rehearse?'Complete the whole row. Write one digit per box.':S.sub===2?'Write the result to the left of your last digit. Leave any unused box blank.':S.sub===1?'Put the carry in the small box above the tens digit.':''}</p>${S.stage===1&&S.carry[0]?`<p class="past">Previous carry: <s>${S.carry[0]}</s> — already used</p>`:''}${grid(S.stage,true,null,!rehearse)}<div class="actions">${button(S.mode==='diagnose'&&S.stage<2?'Check this step':'Check row','checkrow')}${button('Show this part','show','secondary')}</div>${feedback()}`);
app.querySelectorAll('.digit,#carry').forEach(el=>el.addEventListener('input',()=>{el.value=el.value.replace(/\D/g,'').slice(-1);if(el.id==='carry'){S.carry[S.stage]=el.value;S.cross[S.stage]=false;el.classList.remove('used');}}));}
function entries(){return [0,1,2,3].map(i=>$('#d'+i).value);}
function checkrow(){const val=entries(),exp=expected(S.stage).map(s=>s.trim()),d=data();
if(S.mode==='diagnose'&&S.stage<2){let m=S.stage===0?d.v:d.w,c=Math.floor(d.u*m/10),inds=activeCells();
if(inds.every(i=>val[i]==='')){msg('Fill in the yellow answer box'+(inds.length>1?'es':'')+' first.');return;}
if(S.sub===1&&c&&$('#carry').value===''){msg('Write the carried number in the yellow box above '+d.t+'.');$('#carry').focus();return;}
if(S.sub===2&&inds.some(i=>val[i]!==exp[i])&&inds.every(i=>!val[i]||val[i]===exp[i])){msg('These digits are correct. Finish the result in the yellow boxes.');return;}
if(inds.some(i=>val[i]!==exp[i])||(S.sub===1&&Number($('#carry').value||0)!==c)){showPart(val);return;}
S.rows[S.stage]=val;if(S.sub<2){S.sub++;workspace();return;}S.cross[S.stage]=true;S.stage++;S.sub=S.stage===1?0:1;workspace();return;}
if(val.every(s=>!s)){msg('Write your answer in the yellow boxes first.');return;}
if(val.some((s,i)=>s!==exp[i])){if(val.every((s,i)=>!s||s===exp[i])){msg('These digits are correct. Finish the whole row before checking.');return;}showPart(val);return;}
if(S.stage<2){const mult=S.stage===0?d.v:d.w,c=Math.floor(d.u*mult/10),typed=$('#carry').value;
if(S.mode==='rehearse'&&c&&typed===''){msg('The row is correct. Add the carried number above '+d.t+'.');$('#carry').focus();return;}
if(typed!==''&&Number(typed)!==c){showPart(val,'carry');return;}S.cross[S.stage]=true;}
S.rows[S.stage]=val;S.stage++;if(S.stage===3){if(S.mode==='rehearse')remember();else connect();return;}S.phase=S.mode==='rehearse'&&S.stage<2?'choose':'row';workspace();}
function showPart(val=null,reason=''){const{a,b,u,t,v,w,r}=data();let k=S.stage,m=k===0?v:w,c=Math.floor(u*m/10),ones=u*m,last=t*m+c;S.demo={val,reason};S.failures[k]=(S.failures[k]||0)+1;
if(S.mode==='diagnose'&&k<2){let text,shown=(S.rows[k]||['','','','']).slice();if(S.sub===0){text=`<p>The ${w} in ${b} means <strong>${w} tens</strong>.</p><p>Multiplying by ${w*10} gives whole tens: write <strong>0 in the ones column</strong>.</p>`;shown[3]='0';}else if(S.sub===1){text=`<p class="big">${u} × ${m} = ${ones}</p><p>Write <strong>${ones%10}</strong> in the ${k===0?'ones':'tens'} column.${c?` Carry <strong>${c}</strong> above the ${t} in ${a}.`:' No carry is needed.'}</p>`;shown[k===0?3:2]=String(ones%10);}else{text=`<p class="big">${t} × ${m} = ${t*m}</p>${c?`<p class="big">${t*m} + ${c} = ${last}</p>`:''}<p>Write <strong>${last}</strong> to the left of ${shown[k===0?3:2]}. ${c?'The carry has now been used.':''}</p>`;shown=expected(k).map(x=>x.trim());}
set(`<p class="eyebrow">LOOK AT THIS STEP • ${a} × ${b}</p><h1>${S.sub===0?'Start the tens row.':S.sub===1?'Multiply and carry.':'Multiply, then add the carry.'}</h1><div class="teach">${text}</div>${grid(k,false,shown)}<div class="actions">${button('Hide it — my turn','hide')}</div>`);return;}
let teaching='';if(k===0||k===1){let wrong=val?Number(val.join('')):null;if(k===1&&wrong===a*w&&reason!=='carry'){teaching=`<p>The ${w} in ${b} means <strong>${w} tens</strong>.</p><p class="big">${a} × ${w} = ${a*w}</p><p>${a*w} tens = <strong>${fmt(r[1])}</strong>.</p><p>Write <strong>0 in the ones column</strong> before multiplying.</p>`;}else if(val&&wrong===r[k]&&reason!=='carry'){teaching='<p>Each digit must stay in its place.</p><p>Keep ones under ones and tens under tens.</p>';}else{teaching=`${k===1?`<p>The ${w} means <strong>${w} tens</strong>. Put <strong>0 in the ones column</strong> first.</p>`:''}<p class="big">${u} × ${m} = ${ones}</p><p>Write ${ones%10} in the <strong>${k===0?'ones':'tens'}</strong> column.${c?` Carry <strong>${c}</strong>.`:' No carry is needed.'}</p><p class="big">${t} × ${m} = ${t*m}${c?` &nbsp; → &nbsp; ${t*m} + ${c} = ${last}`:''}</p><p>Write ${last} to the left.${c?` Cross out the used carry: <s>${c}</s>.`:''}</p>`;}}
else{const x=String(r[0]).padStart(4,'0'),y=String(r[1]).padStart(4,'0');let carry=0;let lines=[];for(let i=3;i>=0;i--){let total=+x[i]+ +y[i]+carry;lines.push(`<p><strong>${['Thousands','Hundreds','Tens','Ones'][i]}:</strong> ${+x[i]} + ${+y[i]}${carry?' + '+carry:''} = ${total}${total>=10?` — write ${total%10}, carry 1`:''}</p>`);carry=Math.floor(total/10);}teaching='<p>Add down the columns, starting with the ones.</p>'+lines.join('');}
if(k<2&&S.failures[k]>1){teaching+=`<p><strong>${ones} ${k===0?'ones':'tens'} = ${c} ${k===0?'tens':'hundreds'} + ${ones%10} ${k===0?'ones':'tens'}.</strong></p>`;}
set(`<p class="eyebrow">LOOK AT THIS PART • ${a} × ${b}</p><h1>${k===2?'Keep the columns straight.':reason==='carry'?'Use this row’s carry.':'Multiply, then add the carry.'}</h1><div class="teach">${teaching}</div>${grid(k,false,expected(k).map(s=>s.trim()))}<div class="actions">${button('Hide it — my turn','hide')}</div>`);}
function connect(){const{a,b,v,w}=data();set(`<p class="eyebrow">PUT THE METHOD TOGETHER</p><h1>${a} × ${b}</h1><div class="memory"><p><strong>1.</strong> Multiply by ${v}. Add the carry after multiplying.</p><p><strong>2.</strong> Multiply by ${w*10}. Start with 0 in the ones column. Use the new carry.</p><p><strong>3.</strong> Add down the columns, starting with the ones.</p></div>${grid(2)}<p class="muted">Next, cover your paper working. Complete one blank workspace from memory.</p><div class="actions">${button('Try the whole method','rehearse')}</div>`);}
function reconstruct(){S.mode='reconstruct';S.demo=null;let {a,b}=data();let h=`<p class="eyebrow">PUT IT TOGETHER YOURSELF</p><h1>${a} × ${b}</h1><p>Complete the long multiplication without step-by-step help.</p><p class="inputkey">Match each carry to the row of the same colour.<br>One digit per box. Leave unused boxes blank.</p><div class="board">`;
for(let j=0;j<2;j++)h+=`<div class="line carryline ${j===0?'row-one':'row-two'}"><label class="carrylabel" for="rc${j}">Carry for row ${j+1}</label><input id="rc${j}" inputmode="numeric" maxlength="1" value="${S.carry[j]||''}" aria-label="Carry for row ${j+1}, above the tens digit"><span></span></div>`;
h+=staticLine(a)+staticLine(b,'×','rule');for(let j=0;j<3;j++){h+=`<div class="line ${j===2?'sum':j===0?'row-one':'row-two'}"><span class="rowlabel">${j<2?'<small>Row '+(j+1)+'</small>':''}${j===1?'<b>+</b>':''}</span>`;for(let i=0;i<4;i++)h+=`<input id="r${j}d${i}" class="recDigit" inputmode="numeric" maxlength="1" value="${S.rows[j]?.[i]||''}" aria-label="${['Thousands','Hundreds','Tens','Ones'][i]} digit, ${j===2?'total':'row '+(j+1)}">`;h+='</div>';}h+='</div>';set(h+`<div class="actions">${button('Check my working','checkall')}</div>${feedback()}`);
app.querySelectorAll('input').forEach(el=>el.addEventListener('input',()=>{el.value=el.value.replace(/\D/g,'').slice(-1);}));}
function checkAll(){S.rows=[0,1,2].map(j=>[0,1,2,3].map(i=>$('#r'+j+'d'+i).value));S.carry=[0,1].map(j=>$('#rc'+j).value);let d=data();for(let j=0;j<3;j++){let ex=expected(j).map(x=>x.trim()),v=S.rows[j];if(v.some((x,i)=>x!==ex[i])){if(v.every((x,i)=>!x||x===ex[i])){msg('Finish '+(j===2?'the total':'row '+(j+1))+' before checking.');return;}S.stage=j;S.repair=true;showPart(v);return;}
if(j<2&&S.carry[j]!==''&&Number(S.carry[j])!==Math.floor(d.u*(j===0?d.v:d.w)/10)){S.stage=j;S.repair=true;showPart(v,'carry');return;}}
set(`<p class="eyebrow">METHOD COMPLETE</p><h1>You put the steps together.</h1>${grid(2,false,null,false)}<p>Now use the method on a new question.</p><div class="actions">${button('Next question','new')}</div>`);}
function complete(){S.mode='complete';set(`<p class="eyebrow">PRACTICE COMPLETE</p><h1>Three fresh answers in a row.</h1><div class="success">You solved them without help.</div><div class="paper"><h2>One more — on paper</h2><p class="question">69 × 24</p><p>Show your long multiplication. Check your columns and carries.</p></div><div class="actions">${button('Practise again','restart')}</div>`);}
app.addEventListener('keydown',e=>{if(e.key==='Enter'&&S.mode==='reconstruct'&&e.target.matches('input')){e.preventDefault();checkAll();return;}if(e.key==='Enter'&&e.target.matches('.digit,#carry')){e.preventDefault();checkrow();}});
app.addEventListener('click',e=>{const el=e.target.closest('button');if(!el)return;if(el.dataset.mult){const d=data(),want=S.stage===0?d.v:d.w;if(Number(el.dataset.mult)!==want){set(`<p class="eyebrow">CHOOSE THE MULTIPLIER</p><h1>${S.stage===0?'Start with the ones digit.':'Now use the tens digit.'}</h1><div class="teach"><p class="big">${d.b} = ${d.w*10} + ${d.v}</p><p>${S.stage===0?`Multiply by ${d.v} first.`:`The ${d.w} means ${d.w} tens. Multiply by ${d.w*10} next.`}</p></div><div class="actions">${button('Hide it — my turn','chooseagain')}</div>`);}else{S.phase='row';workspace();}return;}
switch(el.dataset.act){case'help':startSupport();break;case'new':chooseNew();break;case'checkrow':checkrow();break;case'show':showPart(entries());break;case'hide':if(S.mode==='reconstruct'){let ex=expected(S.stage).map(x=>x.trim());if(S.demo?.reason==='carry'){S.carry[S.stage]='';}else{S.rows[S.stage]=S.rows[S.stage].map((x,i)=>x===ex[i]?x:'');}S.demo=null;reconstruct();break;}S.demo=null;if(S.stage<2&&(S.mode!=='diagnose'||S.sub===1)){S.carry[S.stage]='';S.cross[S.stage]=false;}workspace();break;case'chooseagain':workspace();break;case'rehearse':S.stage=0;S.rows=[];S.carry=['',''];S.cross=[false,false];S.repair=false;reconstruct();break;case'checkall':checkAll();break;case'retry':S.mode='retry';test();break;case'restart':restart();break;}});
function restart(){S.streak=0;chooseNew();}$('#restart').onclick=restart;
$('#listen').onclick=()=>{if(!('speechSynthesis'in window)){ $('#audio').textContent='Read-aloud is unavailable. All instructions are on screen.';return;}if(speechSynthesis.speaking){speechSynthesis.cancel();return;}const text=app.innerText.replace(/×/g,' times ').replace(/→/g,', then ').replace(/=/g,' equals ');const u=new SpeechSynthesisUtterance(text);u.lang='en-GB';u.rate=.86;window.currentSpeech=u;u.onerror=()=>$('#audio').textContent='Voice unavailable. You can read the instructions on screen.';if(!speechSynthesis.getVoices().length)$('#audio').textContent='Read-aloud depends on the voices available on this device.';speechSynthesis.speak(u);};
chooseNew();
