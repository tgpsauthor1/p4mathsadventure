<!doctype html>
<html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mixed numbers · Simplest form</title>
<style>
:root{font-family:Arial,sans-serif;color:#20334a;background:#eef4fa;font-size:20px}*{box-sizing:border-box}body{margin:0}button,input{font:inherit}button{min-height:48px;border:2px solid #b1c3d5;border-radius:13px;background:white;color:#20334a;padding:10px 19px;cursor:pointer;font-weight:bold}button:hover{background:#edf5ff;border-color:#306db6}button:focus-visible,input:focus-visible{outline:4px solid #efad32;outline-offset:3px}button.primary{background:#234f90;color:white;border-color:#234f90}button.secondary{font-size:16px;padding:8px 13px;font-weight:normal}header{max-width:900px;margin:auto;padding:22px 24px 12px;display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{font-size:17px;font-weight:bold;letter-spacing:.04em}.sub{font-size:15px;color:#53657b;margin-top:5px}main{max-width:860px;margin:10px auto 24px;background:white;border:1px solid #d6e1ed;border-radius:24px;padding:28px 34px;box-shadow:0 12px 35px #304d6a0b;min-height:475px}.topline{display:flex;justify-content:space-between;gap:10px;align-items:center}.tag{font-size:15px;font-weight:bold;color:#34577c;background:#eaf1fa;border-radius:30px;padding:7px 12px}h1{font-size:28px;line-height:1.3;margin:22px 0 18px}h2{font-size:23px}p{line-height:1.45}.equation{display:flex;align-items:center;justify-content:center;gap:24px;margin:28px 0;flex-wrap:wrap}.mixed{display:inline-flex;align-items:center;gap:10px;white-space:nowrap;vertical-align:middle;font-size:40px}.frac{display:inline-flex;flex-direction:column;align-items:stretch;text-align:center;vertical-align:middle;line-height:1.2;min-width:45px}.frac>span:first-child{border-bottom:3px solid currentColor;padding:2px 9px 5px}.frac>span:last-child{padding:5px 9px 2px}.whole{color:#126550}.fraction{color:#543394}.answer{display:inline-flex;align-items:center;gap:12px}.answer .frac{gap:0}.answer .frac>span{padding:5px 0}.answer input{width:69px;height:58px;text-align:center;font-size:30px;background:#fff6cf;border:2px solid #b17d0a;border-radius:9px;color:#20334a}.smallinput{width:72px;height:55px;text-align:center;font-size:28px;background:#fff6cf;border:2px solid #b17d0a;border-radius:9px}.actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin:22px 0 6px}.help{display:block;margin:16px auto 0;border:0;text-decoration:underline;background:transparent;font-size:17px;font-weight:normal}.hint{font-size:17px;color:#52647a;text-align:center}.feedback{padding:10px 0;min-height:40px;color:#8b3a13;font-size:18px;text-align:center}.note{background:#f0edf9;border-left:5px solid #7350a4;padding:14px 18px;border-radius:9px;line-height:1.5}.model{display:flex;flex-wrap:wrap;justify-content:center;gap:13px;margin:22px 0}.bar{display:flex;width:180px;height:48px;border:2px solid #334962;border-radius:4px;overflow:hidden}.piece{flex:1;border-right:1px solid #34475b;background:white}.piece:last-child{border-right:0}.piece.shade{background:#9c7dc6}.solid{background:#90cbb6;width:180px;height:48px;border:2px solid #334962;border-radius:4px}.barlabel{font-size:16px;text-align:center;margin:7px 0}.modelpair{display:flex;align-items:center;justify-content:center;gap:22px;flex-wrap:wrap}.calcs{display:grid;gap:13px;justify-content:center;font-size:30px;margin:22px 0}.record{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:13px;padding:14px;background:#f4f7fa;border-radius:14px;margin:18px 0}.record .mixed{font-size:28px}.record small{font-size:15px;color:#543394}.pick{font-size:40px;min-width:85px;min-height:100px;display:inline-flex;align-items:center;justify-content:center}.strategy{display:grid;gap:12px}.strategy>div{border-radius:12px;background:#f2f6fa;padding:14px 18px;display:flex;align-items:center;gap:18px}.strategy b{font-size:21px;display:block}.strategy span.text{font-size:17px;line-height:1.45}.num{font-weight:bold;background:#234f90;color:white;border-radius:50%;width:34px;height:34px;display:inline-grid;place-items:center;flex-shrink:0}.stepsummary{font-size:20px;line-height:1.7;background:#edf7f2;border-radius:12px;padding:16px 20px}.dots{display:flex;gap:7px;margin-top:7px}.dot{width:14px;height:14px;background:#dce6ef;border-radius:50%}.dot.on{background:#22755a}.footer{font-size:15px;text-align:center;color:#5a6b80;margin:18px}.symbol{font-size:30px}.audioStatus{font-size:14px;color:#5a6b80} [hidden]{display:none!important}
@media(max-width:600px){:root{font-size:18px}header{padding:16px}.brand{font-size:15px}main{margin:7px 10px;padding:20px 16px;border-radius:18px}h1{font-size:24px}.equation{gap:15px}.mixed{font-size:34px}.answer input{width:56px;height:54px;font-size:27px}.answer{gap:8px}.strategy>div{padding:12px;gap:10px}.bar,.solid{width:145px}button{padding:10px 14px}.record .mixed{font-size:25px}}
</style></head><body>
<header><div><div class="brand">MIXED NUMBERS</div><div class="sub">Same amount. Simplest form.</div></div><div><div class="sub" id="progress"></div><div class="dots" id="dots"></div></div></header>
<main id="app"></main><div class="footer">Take your time. You can work on paper.</div>
<script>
'use strict';
const $=id=>document.getElementById(id),app=$('app');
const gcd=(a,b)=>b?gcd(b,a%b):a;
const pools=[[[2,4],[3,9],[4,6],[6,9],[2,6],[3,6]],[[4,8],[6,12],[8,12],[4,12],[6,8],[9,12]],[[1,2],[2,3],[3,4],[2,5],[3,7],[5,8]]];
let q,original,streak=0,serial=0,used=new Set(),last='',stage='',readText='',speakUtterance,working,rows=[],divisor=1,remN,remD,recallQ;
const mixed=(w,n,d,colour=false)=>`<span class="mixed"><span class="${colour?'whole':''}">${w}</span><span class="frac ${colour?'fraction':''}"><span>${n}</span><span>${d}</span></span></span>`;
const frac=(n,d)=>`<span class="mixed"><span class="frac"><span>${n}</span><span>${d}</span></span></span>`;
const input=(id,label)=>`<input id="${id}" aria-label="${label}" inputmode="numeric" autocomplete="off" maxlength="3">`;
const answer=(prefix='a',whole=true)=>`<span class="answer">${whole?input(prefix+'w','Whole number'):''}<span class="frac"><span>${input(prefix+'n','Numerator')}</span><span>${input(prefix+'d','Denominator')}</span></span></span>`;
function bar(n,d){return `<div class="bar" role="img" aria-label="${n} of ${d} equal parts shaded">${Array.from({length:d},(_,i)=>`<span class="piece ${i<n?'shade':''}"></span>`).join('')}</div>`}
function pickQuestion(kind){let choices=[];for(let w=2;w<=5;w++)for(const [n,d]of pools[kind])if(!used.has(`${w},${n},${d}`)&&last!==`${w},${n},${d}`)choices.push({w,n,d});if(!choices.length){used.clear();return pickQuestion(kind)}const v=choices[Math.floor(Math.random()*choices.length)];last=`${v.w},${v.n},${v.d}`;used.add(last);return v}
function updateProgress(){$('progress').textContent=`On your own: ${streak} / 3`;$('dots').innerHTML=[0,1,2].map(i=>`<span class="dot ${i<streak?'on':''}"></span>`).join('')}
function shell(tag,title,html,spoken){if(window.speechSynthesis)window.speechSynthesis.cancel();readText=spoken||title;app.innerHTML=`<div class="topline"><span class="tag">${tag}</span><button class="secondary" id="read" aria-label="Read this page aloud">Read aloud</button></div><h1>${title}</h1>${html}<div class="feedback" id="feedback" role="status" aria-live="polite"></div><div class="audioStatus" id="audioStatus" role="status"></div>`;$('read').onclick=speak;updateProgress();window.scrollTo(0,0)}
function speak(){if(!window.speechSynthesis){$('audioStatus').textContent='Read-aloud is unavailable. All instructions are on this page.';return}speechSynthesis.cancel();speakUtterance=new SpeechSynthesisUtterance(readText);speakUtterance.lang='en-GB';speakUtterance.rate=.88;speakUtterance.onerror=()=>{if($('audioStatus'))$('audioStatus').textContent='Audio could not play. Use the words on this page.'};speechSynthesis.speak(speakUtterance);$('audioStatus').textContent='Read-aloud uses the voices available on this device.'}
function msg(t){$('feedback').textContent=t}
function bind(id,fn){$(id).onclick=fn}
function formCheck(fn){app.querySelectorAll('input').forEach(el=>el.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();fn()}}))}
function nums(ids){const v=ids.map(id=>$(id).value.trim());if(v.some(x=>!/^\d+$/.test(x))){msg('Fill each yellow box with a whole number.');return null}return v.map(Number)}
function validAnswer(prefix='a',whole=true){const v=nums(whole?[prefix+'w',prefix+'n',prefix+'d']:[prefix+'n',prefix+'d']);if(!v)return null;if(v[v.length-1]===0){msg('The denominator cannot be 0.');return null}return v}
function action(id,text,primary=true){return `<button id="${id}" class="${primary?'primary':''}">${text}</button>`}
function nextQuestion(){q=pickQuestion(serial++%3);independent(false)}
function independent(retry){stage=retry?'original':'independent';shell(retry?'Try it again':'On your own','Express this mixed number in its simplest form.',`<div class="equation">${mixed(q.w,q.n,q.d)}<span class="symbol">=</span>${answer()}</div><div class="actions">${action('check','Check')}</div><button class="help" id="help">Help me learn</button>`,`Express ${q.w} and ${q.n} over ${q.d} in its simplest form. Enter the whole number, numerator and denominator in the yellow boxes.`);const check=()=>{const a=validAnswer();if(!a)return;const g=gcd(q.n,q.d);if(a[0]===q.w&&a[1]===q.n/g&&a[2]===q.d/g){if(!retry)streak++;if(streak===3){complete();return}shell('Correct',retry?'You did it without the prompts.':'Correct — simplest form.',`<div class="equation">${mixed(q.w,q.n,q.d)}<span class="symbol">=</span>${mixed(...a)}</div><div class="actions">${action('next','Next question')}</div>`);bind('next',nextQuestion)}else{streak=0;original={...q};remN=q.n;remD=q.d;const sameValue=(a[0]*a[2]+a[1])*q.d===(q.w*q.d+q.n)*a[2];if(a[0]!==q.w)teachRole();else if(sameValue)teachDivide('The amount is right. The fraction can still be simplified.');else teachDivide()}};bind('check',check);formCheck(check);bind('help',()=>{streak=0;original={...q};remN=q.n;remD=q.d;teachRole()})}
function teachRole(){stage='teach-role';shell('Let’s look','Keep the whole number.',`<div class="equation">${mixed(original.w,original.n,original.d,true)}</div><div class="model">${Array.from({length:original.w},()=>'<div class="solid" role="img" aria-label="One whole"></div>').join('')}${bar(original.n,original.d)}</div><p class="note">${original.w} wholes <b>and</b> ${frac(original.n,original.d)}. Only the fraction needs simplifying.</p><div class="actions">${action('turn','My turn')}</div>`,`Keep the ${original.w} wholes. Only the fraction needs simplifying.`);bind('turn',retryRole)}
function retryRole(){stage='retry-role';shell('Your turn','Tap the part to simplify.',`<div class="equation"><button class="pick" id="whole">${original.w}</button><button class="pick" id="fraction" aria-label="Fraction ${original.n} over ${original.d}">${frac(original.n,original.d)}</button></div>`);bind('whole',teachRole);bind('fraction',()=>teachDivide())}
function teachDivide(intro=''){stage='teach-divide';divisor=gcd(remN,remD);if(divisor===1){teachStop();return}const nn=remN/divisor,dd=remD/divisor;shell('Let’s look','Divide the top and bottom by the same number.',`${intro?`<p class="hint">${intro}</p>`:''}<div class="calcs"><div>${remN} ÷ ${divisor} = ${nn}</div><div>${remD} ÷ ${divisor} = ${dd}</div></div><div class="modelpair"><div>${bar(remN,remD)}<div class="barlabel">${remN} out of ${remD} parts</div></div><span>=</span><div>${bar(nn,dd)}<div class="barlabel">${nn} out of ${dd} parts</div></div></div><p class="hint">The same amount is shaded.</p><div class="actions">${action('turn','Hide it — my turn')}</div>`,`${remN} divided by ${divisor} is ${nn}. ${remD} divided by ${divisor} is ${dd}. The same amount is shaded.`);bind('turn',retryDivisor)}
function retryDivisor(){stage='retry-divisor';shell('Your turn',`What number greater than 1 divides both ${remN} and ${remD} exactly?`,`<div class="equation">${frac(remN,remD)}<span style="font-size:18px">Divide both by</span><input class="smallinput" id="factor" aria-label="Number to divide both by" inputmode="numeric" maxlength="2"></div><div class="actions">${action('check','Check')}</div>`);const check=()=>{let v=nums(['factor']);if(!v)return;let f=v[0];if(f>1&&remN%f===0&&remD%f===0){divisor=f;retryCalculation()}else teachDivide('The number must divide both exactly.')};bind('check',check);formCheck(check)}
function retryCalculation(){stage='retry-calculation';shell('Your turn','Write the new fraction.',`<div class="equation">${frac(remN+' ÷ '+divisor,remD+' ÷ '+divisor)}<span class="symbol">=</span>${answer('b',false)}</div><div class="actions">${action('check','Check')}</div>`,`Divide ${remN} and ${remD} by ${divisor}. Write the new fraction.`);const check=()=>{let a=validAnswer('b',false);if(!a)return;if(a[0]===remN/divisor&&a[1]===remD/divisor){remN=a[0];remD=a[1];guidedStop()}else{shell('Let’s look','Divide both by the same number.',`<div class="calcs"><div>${remN} ÷ ${divisor} = ${remN/divisor}</div><div>${remD} ÷ ${divisor} = ${remD/divisor}</div></div><div class="actions">${action('turn','Hide it — my turn')}</div>`);bind('turn',retryCalculation)}};bind('check',check);formCheck(check)}
function guidedStop(){stage='guided-stop';shell('Your turn','Can the fraction be simplified again?',`<div class="equation">${mixed(original.w,remN,remD)}</div><div class="actions">${action('yes','Yes',false)}${action('no','No',false)}</div>`);bind('yes',()=>gcd(remN,remD)>1?retryDivisor():teachStop());bind('no',()=>gcd(remN,remD)===1?connect():teachDivide('Both numbers still share a factor greater than 1.'))}
function teachStop(){const factors=n=>Array.from({length:n},(_,i)=>i+1).filter(x=>n%x===0).join(', ');shell('Let’s look','This fraction is in its simplest form.',`<div class="equation">${frac(remN,remD)}</div><p class="note">Factors of ${remN}: ${factors(remN)}<br>Factors of ${remD}: ${factors(remD)}<br><b>Only 1 is shared. Stop simplifying.</b></p><div class="actions">${action('turn','Hide it — my turn')}</div>`);bind('turn',guidedStop)}
const memory='Keep the whole number. Divide the top and bottom by the same number. Check: can both be divided again?';
function connect(){stage='connect';let g=gcd(original.n,original.d);shell('Put it together','Keep. Simplify. Check.',`<div class="strategy"><div><span class="num">1</span><span class="text"><b>Keep the whole number.</b>${original.w} wholes stay ${original.w} wholes.</span></div><div><span class="num">2</span><span class="text"><b>Divide the top and bottom by the same number.</b>${original.n} ÷ ${g} = ${original.n/g} &nbsp; and &nbsp; ${original.d} ÷ ${g} = ${original.d/g}</span></div><div><span class="num">3</span><span class="text"><b>Check the fraction again.</b>No shared factor greater than 1? You can stop.</span></div></div><div class="equation">${mixed(original.w,original.n,original.d)}<span>=</span>${mixed(original.w,original.n/g,original.d/g)}</div><div class="actions">${action('recall','Hide it — use the method')}</div>`,memory);bind('recall',()=>{recallQ=pickQuestion(1);working={...recallQ};rows=[];recallSelect()})}
function record(){return `<div class="record">${mixed(recallQ.w,recallQ.n,recallQ.d)}${rows.map(r=>`<small>÷ ${r.f} on<br>top and bottom</small><span>=</span>${mixed(r.w,r.n,r.d)}`).join('')}</div>`}
function recallShell(title,body){shell('Use the method from memory',title,record()+body,'Use the method from memory. '+title)}
function recallSelect(){stage='recall-select';recallShell('Tap the part you will work on.',`<div class="equation"><button class="pick" id="whole">${working.w}</button><button class="pick" id="fraction" aria-label="Fraction ${working.n} over ${working.d}">${frac(working.n,working.d)}</button></div>`);bind('whole',()=>localTeach('Keep the whole number.',`<p class="note">${working.w} wholes stay ${working.w} wholes. Simplify ${frac(working.n,working.d)}.</p>`,recallSelect));bind('fraction',recallDecision)}
function localTeach(title,html,back){stage='local-teach';recallShell(title,html+`<div class="actions">${action('turn','Hide it — my turn')}</div>`);bind('turn',back)}
function recallDecision(){stage='recall-decision';recallShell('Choose what to do.',`<div class="actions">${action('divide','Divide top and bottom',false)}${action('finish','Finish',false)}</div>`);bind('divide',()=>{if(gcd(working.n,working.d)===1)localTeach('The fraction is already in simplest form.',`<p class="note">${working.n} and ${working.d} have no shared factor greater than 1. You can finish.</p>`,recallDecision);else recallFactor()});bind('finish',()=>{let g=gcd(working.n,working.d);if(g>1)localTeach('The fraction can still be simplified.',`<p class="note">${working.n} and ${working.d} can both be divided by ${g}.</p>`,recallDecision);else recallAnswer()})}
function recallFactor(){stage='recall-factor';recallShell('Choose the number to divide by.',`<div class="equation">${frac(working.n,working.d)}<span style="font-size:18px">Divide both by</span><input id="factor" class="smallinput" inputmode="numeric" aria-label="Number to divide both by" maxlength="2"></div><div class="actions">${action('check','Check')}</div>`);const check=()=>{let v=nums(['factor']);if(!v)return;let f=v[0];if(f>1&&working.n%f===0&&working.d%f===0){divisor=f;recallCalculate()}else{let g=gcd(working.n,working.d);localTeach('Use a number that divides both exactly.',`<div class="calcs"><div>${working.n} ÷ ${g} = ${working.n/g}</div><div>${working.d} ÷ ${g} = ${working.d/g}</div></div>`,recallFactor)}};bind('check',check);formCheck(check)}
function recallCalculate(){stage='recall-calculate';recallShell('Write the result.',`<p class="hint">Your choice: divide the top and bottom by ${divisor}.</p><div class="equation">${mixed(working.w,working.n,working.d)}<span>=</span>${answer('c')}</div><div class="actions">${action('check','Check')}</div>`);const check=()=>{let a=validAnswer('c');if(!a)return;if(a[0]===working.w&&a[1]===working.n/divisor&&a[2]===working.d/divisor){working={w:a[0],n:a[1],d:a[2]};rows.push({...working,f:divisor});recallDecision()}else localTeach('Keep the wholes. Divide both fraction numbers.',`<div class="calcs"><div>${working.n} ÷ ${divisor} = ${working.n/divisor}</div><div>${working.d} ÷ ${divisor} = ${working.d/divisor}</div></div><p class="hint">The whole number stays ${working.w}.</p>`,recallCalculate)};bind('check',check);formCheck(check)}
function recallAnswer(){stage='recall-done';recallShell('You remembered the whole method.',`<div class="stepsummary"><b>Keep</b> the whole number.<br><b>Divide</b> the top and bottom by the same number.<br><b>Check</b>: can both be divided again?</div><p class="hint">Your final fraction has no shared factor greater than 1.</p><div class="actions">${action('retry','Try the first question again')}</div>`);readText=memory;bind('retry',()=>{q={...original};independent(true)})}
function complete(){stage='complete';shell('Practice complete','Three fresh questions correct in a row.',`<p>You kept the wholes and wrote the fractions in their simplest form.</p><div class="note"><b>Now try one on paper.</b><p>Express ${mixed(5,8,12)} in its simplest form. Show your working.</p></div><div class="actions">${action('again','Practise again')}</div>`);bind('again',()=>{streak=0;serial=0;nextQuestion()})}
nextQuestion();
</script></body></html>
