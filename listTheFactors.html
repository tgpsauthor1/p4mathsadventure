<!doctype html><html lang="en-GB"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Find every factor</title><style>
:root{font-family:Arial,sans-serif;color:#17314b;background:#edf4fb;font-size:20px}*{box-sizing:border-box}body{margin:0}header{background:#163b5d;color:white;padding:18px max(20px,calc((100vw - 960px)/2));display:flex;align-items:center;gap:15px;justify-content:space-between}header strong{font-size:23px}button,input,textarea{font:inherit}button{border:0;border-radius:12px;background:#126b76;color:white;min-height:50px;padding:12px 22px;cursor:pointer;font-weight:bold}button:hover{filter:brightness(.94)}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:4px solid #e99719;outline-offset:3px}.secondary{background:#e5eff7;color:#17314b;border:2px solid #aec4d5}.small{font-size:16px;padding:9px 14px}main{max-width:960px;margin:24px auto;padding:0 20px}.topline{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px;font-size:16px}.dots{display:flex;gap:6px}.dot{background:#cedbe6;width:23px;height:23px;border-radius:50%;display:inline-block}.dot.on{background:#208a66}.card{background:white;border-radius:22px;padding:28px;box-shadow:0 7px 25px #163b5d0c;border-top:7px solid #19a7a0}h1{font-size:30px;line-height:1.25;margin:0 0 18px}h2{font-size:26px;line-height:1.3;margin:0 0 20px}p{line-height:1.45;margin:12px 0}.muted{color:#4a6278;font-size:17px}.badge{background:#fff0cf;color:#6a480d;padding:6px 11px;border-radius:8px;display:inline-block;font-size:16px;margin-bottom:14px}.math{font-size:32px;font-weight:bold;margin:18px 0;line-height:1.6}.math input{width:105px;font-size:30px;text-align:center;border:2px solid #567e99;border-radius:10px;padding:8px;background:#fff}textarea{display:block;width:100%;min-height:115px;border:2px solid #7693aa;border-radius:12px;padding:16px;line-height:1.5;margin:10px 0 18px;resize:vertical}label{font-weight:bold}.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:22px}.feedback{color:#744400;background:#fff2d6;border-left:5px solid #eeb644;padding:12px 16px;border-radius:5px;line-height:1.45;margin:16px 0}.good{background:#e2f5ec;color:#12563e;border-color:#21815e}.record{margin-top:24px;border-top:2px solid #e2eaf0;padding-top:16px}.pairs{display:flex;gap:9px;flex-wrap:wrap}.pair{background:#e5f4ef;border-radius:9px;padding:8px 12px;font-size:20px;font-weight:bold}.cross{background:#f1f3f7;color:#526475}.strip{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0}.strip span{background:#edf1ff;padding:10px;border-radius:8px;font-size:23px;font-weight:bold}.strip .hit{background:#ffdfa0;outline:3px solid #b47715}.chunk{display:grid;grid-template-columns:1fr 1fr;gap:8px;max-width:520px;margin:12px 0}.chunk div{background:#e6f4f5;padding:12px;border-radius:8px;text-align:center}.chunk .head{background:#d4e8f2;font-size:16px;font-weight:bold}.whole{background:#f1f0ff;padding:15px;border-radius:12px}.factorbuttons button{margin:5px;background:#e5f4ef;color:#17314b}.factorbuttons button:disabled{opacity:.5;cursor:default}.collected{min-height:65px;background:#edf4fb;padding:15px;border-radius:12px;font-size:25px;line-height:1.6}details{margin-top:25px;font-size:16px}summary{cursor:pointer}#voiceStatus{font-size:15px}footer{max-width:960px;margin:20px auto;padding:0 20px 25px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}[hidden]{display:none!important}@media(max-width:600px){:root{font-size:18px}main{padding:0 12px;margin:16px auto}.card{padding:20px}h1{font-size:26px}.math{font-size:27px}header{padding:14px}header strong{font-size:19px}.topline{align-items:flex-start}.math input{width:85px}button{padding:12px 16px}}@media print{header,footer,.actions,.topline{display:none}.card{box-shadow:none}body{background:white}}
.method{display:grid;grid-template-columns:1fr 1fr;gap:10px}.method p{background:#edf5fa;border-radius:12px;padding:14px;margin:0}.methodnav{display:flex;flex-wrap:wrap;gap:6px;margin:18px 0}.methodnav span{background:#edf1f5;padding:9px 12px;border-radius:8px;font-size:17px}.methodnav .active{background:#ffdda0;color:#523500;font-weight:bold;outline:2px solid #a16a12}#practiceTask{margin-top:22px;border-top:2px solid #dce8ef;padding-top:22px}#practiceRecord{margin-top:12px;padding-top:12px}.method b{color:#125e69}@media(max-width:600px){.method{grid-template-columns:1fr}.methodnav span{font-size:15px}} </style><header><strong>Find every factor</strong><button id="speak" class="secondary small" aria-label="Read this screen aloud">Read aloud</button></header><main><div class="topline"><span id="mode"></span><span id="progress"></span></div><section class="card" id="app"></section><div id="voiceStatus" role="status"></div></main><footer><button class="secondary small" id="restart">Start again</button></footer><script>
'use strict';
const $=id=>document.getElementById(id), app=$('app');
const pool=[20,24,28,32,36,42,45,48,49,54,56,60,63,64,70,72,75,80,81,84,90,96];
let n=84,streak=0,used=new Set(), supported=false,d=1,records=[],currentSpeech=null;
function factors(x){return Array.from({length:x},(_,i)=>i+1).filter(k=>x%k===0)}
function pairs(x){return factors(x).filter(k=>k*k<=x).map(k=>[k,x/k])}
function stopSpeech(){if('speechSynthesis'in window)speechSynthesis.cancel()}
function shell(title,body='',support=true){stopSpeech();$('voiceStatus').textContent='';$('mode').textContent=support?'Learn and practise · support is on':supported?'Try again · without hints':'Your turn · without hints';$('progress').innerHTML=`<span aria-label="${streak} of 3 fresh questions correct">Fresh questions: ${streak}/3</span>`;app.innerHTML=`${support?`<span class="badge">Factors of ${n}</span>`:''}<h1>${title}</h1>${body}<div id="feedback" role="status" aria-live="polite"></div><div class="actions" id="actions"></div>`}
function btn(text,fn,secondary=false,where='actions'){let b=document.createElement('button');b.textContent=text;b.className=secondary?'secondary':'';b.onclick=fn;$(where).append(b);return b}
function feedback(text,good=false){$('feedback').textContent=text;$('feedback').className='feedback'+(good?' good':'')}
function recordHTML(){return `<div class="record"><p class="muted">Your completed checks</p><div class="pairs">${records.length?records.map(r=>`<span class="pair ${r.q?'':'cross'}">${r.d}${r.q?` × ${r.q}`:' ✗'}</span>`).join(''):'<span class="muted">No checks yet.</span>'}</div></div>`}
function teach(title,body,retry){shell(title,body);btn('My turn',retry)}
function numeric(title,expression,expected,done,explain,extra=''){shell(title,`<form id="calc"><div class="math">${expression} <input id="answer" inputmode="numeric" autocomplete="off" aria-label="Missing number">${title==='Find the other factor.'?` = ${n}`:''}</div><button type="submit">Check</button></form>${extra}`);$('calc').onsubmit=e=>{e.preventDefault();let raw=$('answer').value.trim();if(!/^\d+$/.test(raw)){feedback('Type a whole number in the box.');return}if(+raw===expected)done();else explain(()=>numeric(title,expression,expected,done,explain,extra))}}
function nextQuestion(){let choices=pool.filter(x=>!used.has(x)&&x!==n);if(!choices.length){used=new Set([n]);choices=pool.filter(x=>x!==n)}n=choices[Math.floor(Math.random()*choices.length)];used.add(n);supported=false;fullQuestion()}
function fullQuestion(){shell(`List all the factors of ${n}.`,`<p class="muted">You may work on paper first.</p><form id="full"><label for="list">Write your factors here.</label><textarea id="list" aria-describedby="format" autocomplete="off"></textarea><p class="muted" id="format">Separate the numbers with spaces or commas.</p><button type="submit">Check my factors</button></form>`,false);btn('Help me find the factors',()=>{supported=true;streak=0;startHelp()},true);$('full').onsubmit=e=>{e.preventDefault();let raw=$('list').value.trim();if(!raw||!/^\d+(?:[\s,;]+\d+)*[\s,;]*$/.test(raw)){feedback('Write numbers separated by spaces or commas.');return}let a=raw.split(/[\s,;]+/).filter(Boolean).map(Number);if(new Set(a).size!==a.length){feedback('You have written a number more than once. Keep one copy of each.');return}let f=factors(n),wrong=a.find(x=>!f.includes(x)),missing=f.find(x=>!a.includes(x));if(wrong===undefined&&missing===undefined){if(!supported)streak++;if(streak>=3){complete();return}shell('Every factor found.',`<p class="math">${f.join(', ')}</p><p>${supported?'You have completed your retry. Now try a fresh question.':'You found them independently.'}</p>`,false);btn('Next question',nextQuestion)}else{supported=true;streak=0;shell('Let’s check your factors in order.',`<p>Find the first pair. Then check 2, 3, 4… without skipping.</p>`);btn('Work through it',startHelp)}}}
function startHelp(){records=[];d=1;partner()}
function candidate(){shell(`Can ${n} be divided by ${d} with no remainder?`,recordHTML());btn('Yes',()=>decision(true));btn('No',()=>decision(false));btn('Help with this check',()=>ruleLesson(candidate),true)}
function decision(yes){if(yes!==(n%d===0)){ruleLesson(candidate);return}if(yes)partner();else finishPair(null)}
function partner(){numeric('Find the other factor.',`${d} ×`,n/d,()=>finishPair(n/d),retry=>chunks(retry),recordHTML());btn('Help me divide',()=>chunks(partner),true)}
function finishPair(q){records.push({d,q});shell(q?`${d} × ${q} = ${n}`:`${d} is not a factor.`,`${q?`<p>Record ${d===q?'this factor once.':'both factors.'}</p>`:'<p>Mark this check with a cross.</p>'}${recordHTML()}`);btn('Next check',()=>{d++;if(d>=innerPair(records).q)stopCheck();else candidate()})}
function ruleLesson(back){if(d===1){teach('1 is a factor.',`<p class="math">1 × ${n} = ${n}</p>`,back);return}if([2,5,10].includes(d)){let ones=n%10;let rule=d===2?'0, 2, 4, 6 or 8':d===5?'0 or 5':'0';teach('Look at the ones digit.',`<p class="math">${String(n).slice(0,-1)}<mark>${ones}</mark></p><p>For ${d}, the ones digit must be ${rule}.</p><p><strong>${ones} ${n%d===0?'fits':'does not fit'} this rule.</strong></p>`,back);return}if(d===3||d===9){let digits=String(n).split('').map(Number),sum=digits.reduce((a,b)=>a+b,0);numeric('Add the digits.',digits.join(' + ')+' =',sum,()=>{shell(`Is ${sum} in the ${d} times table?`,`<p class="math">${digits.join(' + ')} = ${sum}</p>`);let check=y=>{if(y===(sum%d===0)){teach(`${d} ${n%d===0?'is':'is not'} a factor of ${n}.`,`<p class="math">${digits.join(' + ')} = ${sum}</p><p>${sum} ${sum%d===0?`= ${d} × ${sum/d}`:`is not in the ${d} times table`}.</p><p>This checks whether ${d} is a factor. We still need to find its partner.</p>`,back)}else{teach(`Look for ${sum}.`,`<div class="strip">${Array.from({length:Math.max(5,Math.ceil(sum/d)+1)},(_,i)=>(i+1)*d).map(v=>`<span class="${v===sum?'hit':''}">${v}</span>`).join('')}</div><p>${sum%d===0?`${d} × ${sum/d} = ${sum}.`:`${sum} is between ${Math.floor(sum/d)*d} and ${Math.ceil(sum/d)*d}. It is not in this times table.`}</p>`,()=>ruleLesson(back))}};btn('Yes',()=>check(true));btn('No',()=>check(false))},retry=>teach('Add the two digits.',`<p class="math">${digits.join(' + ')} = ${sum}</p>`,retry));return}chunks(back)}
function chunks(back){let remain=n,groups=0,rows=[];function table(){return `<div class="chunk"><div class="head">Amount removed</div><div class="head">Groups of ${d}</div>${rows.map(r=>`<div>${r.amount}</div><div>${r.groups}</div>`).join('')}</div>`}function step(){if(remain>=10*d){shell(`Remove 10 groups of ${d}.`,`<div class="whole"><p class="math">${remain} left</p><p>10 × ${d} = ${10*d}</p></div>${table()}`);btn(`Subtract ${10*d}`,()=>{let before=remain;remain-=10*d;groups+=10;rows.push({amount:10*d,groups:10});shell(`${before} − ${10*d} = ${remain}`,`${table()}<p class="math">${remain} left</p><p>${groups} groups of ${d} removed.</p>`);btn('Continue',step)});return}let q=Math.floor(remain/d),r=remain%d;if(r){teach(`${r} left over.`,`${table()}<p class="math">${remain} = ${q} × ${d} + ${r}</p><p>${r} is smaller than ${d}. It cannot make another whole group.</p><p><strong>${d} is not a factor of ${n}.</strong></p>`,back);return}numeric('Count the remaining groups.',`${remain} ÷ ${d} =`,q,()=>{if(remain>0)rows.push({amount:remain,groups:q});let total=groups+q;numeric('How many groups altogether?',(rows.length?rows.map(x=>x.groups).join(' + '):'0')+' =',total,()=>teach('Connect the groups to the factor pair.',`${table()}<p class="math">${d} × ${total} = ${n}</p>`,back),retry=>teach('Add the group counts.',`${table()}<p class="math">${rows.map(x=>x.groups).join(' + ')} = ${total}</p>`,retry),table())},retry=>teach('Use the multiplication fact.',`<p class="math">${d} × ${q} = ${remain}</p><p>${remain} makes ${q} groups of ${d}.</p>`,retry),table())}step()}
function innerPair(rows){return rows.filter(r=>r.q).reduce((a,b)=>b.q<a.q?b:a)}
function gapView(rows){const p=innerPair(rows);let middle=[];for(let k=p.d+1;k<p.q;k++){let r=rows.find(x=>x.d===k);middle.push(`<span class="${r?'cross':''}">${k}${r?' ✗':''}</span>`)}return `<p class="math">${p.d} × ${p.q} = ${n}</p><div class="strip" aria-label="Numbers between the closest pair"><span class="hit">${p.d}</span>${middle.length?middle.join(''):'<span class="muted">no numbers between</span>'}${p.d!==p.q?`<span class="hit">${p.q}</span>`:''}</div>`}
function gapReason(rows){const p=innerPair(rows);return p.d===p.q?`Both factors are ${p.d}. There is no gap left.`:p.q===p.d+1?`There are no whole numbers between ${p.d} and ${p.q}.`:`Every whole number between ${p.d} and ${p.q} has been checked and crossed out.`}
function stopCheck(){shell('Are there any numbers left to check between this pair?',`${gapView(records)}${recordHTML()}`);btn('Yes',()=>teach('There are none left to check.',`${gapView(records)}<p>${gapReason(records)}</p>`,stopCheck));btn('No',()=>{shell('You can stop checking.',`${gapView(records)}<p>${gapReason(records)}</p><p>Checking the partner again would repeat a pair you already found.</p>${recordHTML()}`);btn('Collect all the factors',collect)})}

function collect(){let pp=records.filter(r=>r.q),chosen=new Set(),list=new Set();shell('Collect both numbers from each pair.',`<p class="muted">Tap each pair. Write a repeated factor only once.</p><div class="factorbuttons" id="pairButtons"></div><p>Your factors, from smallest to greatest:</p><div class="collected" id="collected" aria-live="polite">—</div>`);pp.forEach((r,i)=>{let b=btn(`${r.d} × ${r.q}`,()=>{chosen.add(i);list.add(r.d);list.add(r.q);b.disabled=true;b.textContent+=' ✓';$('collected').textContent=[...list].sort((a,b)=>a-b).join(', ');if(chosen.size===pp.length){feedback('Every pair checked. Every factor recorded.',true);btn('Put the steps together',strategySummary)}},false,'pairButtons')})}
// Whole-method retrieval: pupil chooses the next check; completed work stays visible.
let practiceRecords=[],practiceLast=0;
function strategySummary(){
 shell('How do I find every factor?',`<div class="method"><p><b>1 · Start</b><br>Write 1 × ${n}.</p><p><b>2 · Check in order</b><br>Try 2, 3, 4… Write both factors, or mark ✗.</p><p><b>3 · Know when to stop</b><br>Look between the closest pair. Stop when no whole numbers there remain unchecked.</p><p><b>4 · List</b><br>Take both numbers from every pair. Write each factor once.</p></div>${recordHTML()}<p class="whole"><b>Start with 1. Check in order. Write both factors. No numbers left between the closest pair? Stop and list.</b></p>`);
 btn('Hide this. My turn.',()=>{practiceRecords=[];practiceLast=0;practiceFirst()});
}
function practiceFrame(step,prompt,body){
 const work=practiceRecords.map(r=>`<span class="pair ${r.q?'':'cross'}">${r.d}${r.q?` × ${r.q}`:' ✗'}</span>`).join('');
 shell(`Find all the factors of ${n}.`,`<p class="muted">Put the whole method together.</p><div class="methodnav" aria-label="Method"><span class="${step===1?'active':''}">1 · Start</span><span class="${step===2?'active':''}">2 · Check in order</span><span class="${step===3?'active':''}">3 · Stop</span><span class="${step===4?'active':''}">4 · List</span></div><div class="record" id="practiceRecord"><p class="muted">Your working</p><div class="pairs">${work||'—'}</div></div><section id="practiceTask"><h2>${prompt}</h2>${body}<div id="localFeedback" role="status" aria-live="polite"></div><div class="actions" id="practiceActions"></div></section>`);
 $('mode').textContent='Practise the whole method · support is on';
}
function practiceMessage(text){$('localFeedback').className='feedback';$('localFeedback').textContent=text}
function practiceTeach(html,retry){stopSpeech();$('practiceTask').innerHTML=`<h2>Look at this step.</h2>${html}<div class="actions" id="practiceActions"></div>`;btn('Hide it. My turn.',retry,false,'practiceActions')}
function practiceNumber(step,prompt,expression,expected,done,explanation,suffix=''){
 practiceFrame(step,prompt,`<form id="practiceForm"><div class="math">${expression} <input id="practiceAnswer" inputmode="numeric" autocomplete="off" aria-label="Missing number"> ${suffix}</div><button type="submit">Check</button></form>`);
 $('practiceForm').onsubmit=e=>{e.preventDefault();let raw=$('practiceAnswer').value.trim();if(!/^\d+$/.test(raw)){practiceMessage('Type a whole number in the box.');return}if(+raw===expected)done();else practiceTeach(explanation,()=>practiceNumber(step,prompt,expression,expected,done,explanation,suffix))};
}
function practiceFirst(){practiceNumber(1,'Write the first factor pair.','1 ×',n,()=>{practiceRecords.push({d:1,q:n});practiceLast=1;practiceChoose()},`<p class="math">1 × ${n} = ${n}</p><p>Start with 1 and the number itself.</p>`,`= ${n}`)}
function practiceChoose(){
 const next=practiceLast+1,p=innerPair(practiceRecords),canStop=next>=p.q;
 practiceFrame(2,'What should you do next?','');
 btn('Check another number',()=>{if(canStop)practiceTeach(`${gapView(practiceRecords)}<p>${gapReason(practiceRecords)}</p><p>You can stop. Checking the partner repeats a pair.</p>`,practiceChoose);else practiceNext()},false,'practiceActions');
 btn('Stop checking',()=>{if(canStop)practiceStop();else practiceTeach(`${gapView(practiceRecords)}<p>${next} is still between ${p.d} and ${p.q}. You have not checked it yet. Keep checking in order.</p>`,practiceChoose)},false,'practiceActions');
}

function practiceNext(){const next=practiceLast+1;practiceNumber(2,'Which number will you check next?','Next number =',next,()=>practicePair(next),`<p class="math">${practiceLast}, ${next}</p><p>Add 1 to the last number you checked. Do not skip a number.</p>`)}
function practicePair(k){
 practiceFrame(2,`Check ${k}. Write its partner or mark ✗.`,`<form id="pairForm"><div class="math">${k} × <input id="practiceAnswer" inputmode="numeric" autocomplete="off" aria-label="Other factor"> = ${n}</div><button type="submit">Record this pair</button></form>`);
 const explain=()=>{let q=Math.floor(n/k),r=n%k;practiceTeach(r?`<p class="math">${n} = ${k} × ${q} + ${r}</p><p>${r} left over. ${k} is not a factor. Mark ✗.</p>`:`<p class="math">${k} × ${q} = ${n}</p><p>No remainder. Write both factors.</p>`,()=>practicePair(k))};
 const record=q=>{practiceRecords.push({d:k,q});practiceLast=k;practiceChoose()};
 $('pairForm').onsubmit=e=>{e.preventDefault();let raw=$('practiceAnswer').value.trim();if(!/^\d+$/.test(raw)){practiceMessage('Enter the other factor, or choose “Not a factor”.');return}if(n%k===0&&+raw===n/k)record(n/k);else explain()};
 btn('Not a factor · ✗',()=>n%k!==0?record(null):explain(),true,'practiceActions');
}
function practiceStop(){practiceFrame(3,'Why can you stop?',gapView(practiceRecords));btn('No unchecked numbers remain between this pair',practiceList,false,'practiceActions');btn('I have found enough pairs',()=>practiceTeach(`<p>${gapReason(practiceRecords)}</p><p>Do not stop just because you have found some pairs. Check that no numbers remain unchecked between the closest pair.</p>`,practiceStop),true,'practiceActions')}

function practiceList(){
 practiceFrame(4,'Write every factor once.',`<form id="practiceListForm"><label for="practiceList">Use both numbers from each pair.</label><textarea id="practiceList"></textarea><p class="muted">Separate the numbers with spaces or commas.</p><button type="submit">Check all my factors</button></form>`);
 $('practiceListForm').onsubmit=e=>{e.preventDefault();let raw=$('practiceList').value.trim();if(!raw||!/^\d+(?:[\s,;]+\d+)*[\s,;]*$/.test(raw)){practiceMessage('Write numbers separated by spaces or commas.');return}let a=raw.split(/[\s,;]+/).filter(Boolean).map(Number),f=factors(n);if(new Set(a).size!==a.length){practiceMessage('Write each factor only once, even when both numbers in a pair are the same.');return}if(a.length!==f.length||a.some(x=>!f.includes(x))){practiceTeach(`<p>Take both numbers from each pair. Leave out the crossed-out checks.</p><p class="math">${f.join(', ')}</p>`,practiceList);return}
 practiceFrame(4,'You used the whole method.',`<p><b>Start:</b> 1 × ${n}</p><p><b>Check in order:</b> ${practiceRecords.slice(1).map(r=>r.d).join(', ')}</p><p><b>Stop:</b> ${gapReason(practiceRecords)}</p><p><b>List:</b> ${f.join(', ')}</p><p class="whole"><b>Start with 1. Check in order. Write both factors. No numbers left between the closest pair? Stop and list.</b></p>`);btn('Hide my working. Try alone.',()=>{supported=true;fullQuestion()},false,'practiceActions')};
}

function complete(){shell('You found every factor independently.',`<p class="math">3 fresh questions correct in a row ✓</p><p>Now try one on paper. Record your factor pairs and explain when you can stop.</p>`,false);$('mode').textContent='Practice complete';btn('Practise again',restart)}
function restart(){streak=0;used=new Set([n]);nextQuestion()}
$('restart').onclick=restart;
$('speak').onclick=()=>{if(!('speechSynthesis'in window)){ $('voiceStatus').textContent='Read-aloud is unavailable on this device. All instructions are written above.';return}stopSpeech();currentSpeech=new SpeechSynthesisUtterance(app.innerText);currentSpeech.lang='en-GB';currentSpeech.rate=.9;currentSpeech.onerror=()=>{$('voiceStatus').textContent='Audio could not play. Please use the written instructions.'};speechSynthesis.speak(currentSpeech)};
restart();
</script></html>
