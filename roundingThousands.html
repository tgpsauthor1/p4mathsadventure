</style><main><header><h1>Rounding Ridge · Thousands</h1><div id="progress" aria-label="Independent progress"></div><button class="secondary" id="speak">Read aloud</button></header><section class="card" id="app"></section><footer><button class="secondary" id="help">Help me</button><button class="secondary" id="restart">Start again</button><button class="secondary" id="full-practice">Practise all steps</button></footer></main><script>
const app=document.querySelector('#app');
let n=null,streak=0,mode='independent',step=0,show=false,supported=false,used=new Set(),round=0,frame=0,animationToken=0;
const low=()=>Math.floor(n/1000)*1000, high=()=>low()+1000, deciding=()=>Math.floor(n/100)%10, answer=()=>Math.floor((n+500)/1000)*1000;
const fmt=x=>String(x).replace(/\B(?=(\d{3})+(?!\d))/g,'\u00a0');
const titles=['Tap on the digit in the thousands place.','Copy from the left. Include the thousands digit.','Put 000 after your digits.','Find the higher thousand.','Tap on the digit in the hundreds place.','Which number will you choose?'];
function stopMotion(){cancelAnimationFrame(frame);animationToken++}
function digits(value,focus=-1,labels=false,clickable=false,copyTo=-1){const a=String(value).split('');return '<div class="digits">'+a.map((d,i)=>{const label=['Ones','Tens','Hundreds','Thousands','Ten thousands','Hundred thousands'][a.length-1-i];return clickable?`<button data-digit="${i}" aria-label="Digit ${d}, position ${i+1}">${d}</button>`:`<span class="digit ${i===focus?'focus':''} ${i<=copyTo?'copy-digit':''}">${labels?`<small>${label}</small>`:''}${d}</span>`}).join('')+'</div>'}
function form(label){return `<form><label class="small" for="entry">${label}</label><div class="choices" style="width:100%;margin:0"><input id="entry" inputmode="numeric" autocomplete="off" aria-label="${label}"><button class="primary" type="submit">Check</button></div></form>`}
function teach(){const thousands=String(n).length-4,prefix=Math.floor(n/1000);switch(step){case 0:return `<p class="caption">Nearest thousand → find the thousands place.</p>${digits(n,thousands,true)}<p class="hint">Thousands is just left of hundreds.</p>`;
case 1:return digits(n,thousands,true,false,thousands)+`<p class="caption">Copy from the left. Stop after the thousands digit.</p><div class="build" id="copy-row"><span class="slot" id="copy-value"></span></div><button id="copy" class="secondary replay">Watch the digits copy</button>`;
case 2:return `<div class="build"><span>${prefix}</span><span>→</span><span>${prefix}<mark>000</mark></span></div><p class="caption">${fmt(low())} is the lower thousand.</p>`;
case 3:return `<p class="caption">Add 1 000 to the lower thousand.</p><p class="small">Lower thousand: ${fmt(low())}</p><div id="add-digits">${digits(low(),String(low()).length-4,true)}</div><p id="add-note" class="caption">Add one thousand.</p><button id="add" class="secondary replay">Watch +1 000</button><p class="hint" id="thousand-options" hidden></p>`;
case 4:return digits(n,String(n).length-3,true)+`<p class="caption">Look at the hundreds digit: ${deciding()}.</p>`;
}}
function activity(){const thousands=String(n).length-4;switch(step){case 0:return digits(n,-1,false,true);case 1:return digits(n,thousands,false,false,thousands)+`<p class="hint">Copy from the left. Stop after the thousands digit.</p>`+form('Type the copied digits');case 2:return `<div class="build">${Math.floor(n/1000)} <span>→</span> ?</div>`+form('Type the lower thousand');case 3:return `<p class="caption">Add 1 000 to the lower thousand.</p><div class="equation">${fmt(low())} + 1 000 = ?</div>`+form('Type the higher thousand');case 4:return digits(n,-1,false,true);case 5:return `<div class="number">${fmt(n)}</div><div class="choices"><button data-answer="${low()}">${fmt(low())}</button><button data-answer="${high()}">${fmt(high())}</button></div>`;}}
function render(){const playing=document.querySelector('#chant-audio');if(playing)playing.pause();stopMotion();document.querySelector('#progress').textContent='★'.repeat(streak)+'☆'.repeat(3-streak)+'  '+streak+'/3';document.querySelector('#help').hidden=!['independent','retry'].includes(mode);app.classList.toggle('hill-card',mode==='steps'&&step===5&&show);
document.querySelector('#full-practice').hidden=!['independent','retry','success','win'].includes(mode);
if(mode==='full'){renderFull();return}
if(mode==='steps'&&step===5){renderHill();return}
if(mode==='win'){app.innerHTML='<div class="tag">Practice complete</div><h2>Three in a row!</h2><div class="number">★★★</div><p>You rounded independently.</p><button id="again" class="primary">Play again</button>';document.querySelector('#again').onclick=reset;return}
if(mode==='success'){app.innerHTML=`<div class="tag">Correct</div><h2>${fmt(n)} ≈ ${fmt(answer())}</h2><p>${supported?'Now try a fresh question.':'One independent answer completed.'}</p><button id="next" class="primary">Next question</button>`;document.querySelector('#next').onclick=next;return}
if(mode==='bridge'){app.innerHTML=`<div class="tag">Write the number</div><h2>${fmt(n)} rounds to ${fmt(answer())}.</h2><p class="caption">Your answer is <strong>${fmt(answer())}</strong>.</p><p class="hint">Write the number, not “higher thousand” or “lower thousand”.</p><button id="retry" class="primary">My turn</button>`;document.querySelector('#retry').textContent='Practise all the steps together';document.querySelector('#retry').onclick=()=>beginFull();return}
const correction=mode==='steps';app.innerHTML=`<div class="tag">${correction?(show?'Watch':'Your turn'):mode==='retry'?'Try it without help':'Your question'}</div><h2>${correction?titles[step]:`Round ${fmt(n)} to the nearest thousand.`}</h2>${correction?(show?teach():activity()):form('Write your answer as a number')} ${correction&&show?'<button id="myturn" class="primary">My turn</button>':''}<div id="feedback" role="status" aria-live="polite"></div>`;
if(show&&correction){document.querySelector('#myturn').onclick=()=>{show=false;render()};if(step===1)document.querySelector('#copy').onclick=copyDigits;if(step===3)document.querySelector('#add').onclick=addThousand;return}
app.querySelectorAll('[data-digit]').forEach(b=>b.onclick=()=>submit(Number(b.dataset.digit)));
app.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>submit(Number(b.dataset.answer)));
const f=app.querySelector('form');if(f)f.onsubmit=e=>{e.preventDefault();const v=document.querySelector('#entry').value.trim();if(!/^(?:\d+|\d{1,3}(?:,\d{3})+|\d{1,3}(?: \d{3})+)$/.test(v)){document.querySelector('#feedback').textContent=/higher|lower/i.test(v)?'Write the number itself.':'Type a number, then tap Check.';return}submit(Number(v.replace(/[ ,]/g,'')))};
}
function timeline(duration,update,done){stopMotion();const token=animationToken;let start=null;function tick(t){if(token!==animationToken)return;if(start===null)start=t;const progress=Math.min(1,(t-start)/duration);update(progress);if(progress<1)frame=requestAnimationFrame(tick);else if(done)done()}frame=requestAnimationFrame(tick)}
function copyDigits(){const prefix=String(Math.floor(n/1000));timeline(prefix.length*650+400,p=>{const count=Math.min(prefix.length,Math.floor(p*(prefix.length+1)));document.querySelector('#copy-value').textContent=prefix.slice(0,count);const ds=app.querySelectorAll('.digits .digit');ds.forEach((d,i)=>d.classList.toggle('focus',i===Math.min(count,prefix.length-1)));});}
function addThousand(){document.querySelector('#thousand-options').hidden=true;const lo=low(),hi=high(),a=String(lo).padStart(String(hi).length,'0'),b=String(hi),len=b.length,carry=a[len-4]==='9';let last=-1;timeline(carry?4200:2800,p=>{const phase=Math.min(carry?3:2,Math.floor(p*(carry?4:3)));if(phase===last)return;last=phase;const box=document.querySelector('#add-digits'),note=document.querySelector('#add-note');if(phase===0){box.innerHTML=digits(lo,String(lo).length-4,true);note.textContent='Add 1 to the thousands digit.'}else if(phase===1){note.textContent=`${a[len-4]} thousands + 1 thousand = ${Number(a[len-4])+1} thousands`;box.innerHTML=digits(lo,String(lo).length-4,true)}else if(carry&&phase===2){note.textContent='10 thousands = 1 ten thousand. Carry to the left.';box.innerHTML=digits(hi,len-5,true)}else{box.innerHTML='<div class="digits">'+b.split('').map((d,i)=>`<span class="digit ${a[i]!==d?'focus':''}"><small>${['Ones','Tens','Hundreds','Thousands','Ten thousands','Hundred thousands'][len-1-i]}</small>${d}</span>`).join('')+'</div>';note.textContent=`${fmt(lo)} + 1 000 = ${fmt(hi)}. The higher thousand is ${fmt(hi)}.`;const options=document.querySelector('#thousand-options');options.hidden=false;options.textContent=`When rounding, choose ${fmt(lo)} or ${fmt(hi)}.`}})}
let hillPhase='place';
function renderHill(){
 hillPhase='place';app.classList.add('hill-card');
 app.innerHTML=`<div class="tag">Your turn</div><h2 id="hill-title">Place the ball.</h2><div class="number">${fmt(n)}</div><p class="caption" id="motion-note">Tap on the digit in the hundreds place.</p><div class="mountain"><svg viewBox="0 0 680 350" preserveAspectRatio="none" aria-label="Rounding mountain" role="img"><path d="M55 230 L340 70 L625 230 Z" fill="#e3eff0" stroke="#547e85" stroke-width="4"/><g id="ball" visibility="hidden"><circle r="14" fill="#e9a829" stroke="#70480e" stroke-width="3"/><path d="M-13 0 H13 M0 -13 V13" stroke="#70480e" stroke-width="2"/></g></svg>${Array.from({length:11},(_,i)=>`<button class="hill-point" data-point="${i}" style="left:${(55+i*57)/680*100}%;top:${(230-Math.min(i,10-i)*32)/350*100}%" aria-label="Place ball at ${i}" ${i===10?'disabled':''}>${i}</button>`).join('')}<button class="hill-end left" data-end="${low()}" disabled>${fmt(low())}</button><button class="hill-end right" data-end="${high()}" disabled>${fmt(high())}</button></div><button id="roll" class="secondary replay" hidden>Watch it roll</button><button id="hill-retry" class="primary" hidden>My turn</button><div id="feedback" role="status" aria-live="polite"></div>`;
 app.querySelectorAll('[data-point]').forEach(b=>b.onclick=()=>placeBall(Number(b.dataset.point)));
 app.querySelectorAll('[data-end]').forEach(b=>b.onclick=()=>chooseEnd(Number(b.dataset.end)));
 document.querySelector('#roll').onclick=rollBall;
}
function mountainBall(p,angle=0){const b=document.querySelector('#ball');b.setAttribute('visibility','visible');b.setAttribute('transform',`translate(${55+p*57} ${211-Math.min(p,10-p)*32}) rotate(${angle})`)}
function placeBall(p){if(hillPhase!=='place')return;app.querySelectorAll('[data-point]').forEach(b=>b.disabled=true);mountainBall(p);
 if(p!==deciding()){hillPhase='teach';document.querySelector('#motion-note').textContent=`The hundreds digit is ${deciding()}. Put the ball at ${deciding()}.`;mountainBall(deciding());app.querySelector(`[data-point="${deciding()}"]`).classList.add('teach-point');const retry=document.querySelector('#hill-retry');retry.hidden=false;retry.onclick=render;return}
 hillPhase='ready';document.querySelector('#hill-title').textContent='Watch the ball roll.';document.querySelector('#motion-note').textContent=`Hundreds digit: ${deciding()}`;document.querySelector('#roll').hidden=false;
}
function rollBall(){if(!['ready','choose'].includes(hillPhase))return;hillPhase='rolling';app.querySelectorAll('[data-end]').forEach(b=>b.disabled=true);const start=deciding(),end=start<5?0:10,roll=document.querySelector('#roll'),note=document.querySelector('#motion-note');roll.disabled=true;mountainBall(start);note.textContent=start===0?'0: the ball stays at the lower thousand.':start<5?'0–4: roll to the lower thousand.':'5–9: roll to the higher thousand.';
 timeline(3000,p=>{const t=p===1?1:Math.max(0,(p-.18)/.82),pos=start+(end-start)*t;mountainBall(pos,(pos-start)*160)},()=>{hillPhase='choose';document.querySelector('#hill-title').textContent='Tap the thousand where the ball stopped.';note.textContent=`${fmt(low())} or ${fmt(high())}?`;app.querySelectorAll('[data-end]').forEach(b=>b.disabled=false);roll.disabled=false;roll.textContent='Roll again'})
}
function chooseEnd(v){if(hillPhase!=='choose')return;if(v===answer()){if(mode==='full'){fullAnswers[5]=v;fullStep=6;render()}else{mode='bridge';show=false;render()}return}hillPhase='teach';app.querySelectorAll('[data-end]').forEach(b=>b.disabled=true);document.querySelector('#roll').hidden=true;document.querySelector('#feedback').textContent=`The hundreds digit is ${deciding()}. Choose ${fmt(answer())}.`;const retry=document.querySelector('#hill-retry');retry.hidden=false;retry.onclick=()=>{document.querySelector('#ball').setAttribute('visibility','hidden');document.querySelector('#feedback').textContent='';retry.hidden=true;hillPhase='choose';app.querySelectorAll('[data-end]').forEach(b=>b.disabled=false)}}

let fullStep=0,fullAnswers=[],fullTeaching=false;
const fullLabels=['Find the thousands digit','Copy from the left, including the thousands digit','Put 000 after → lower thousand','Add 1 000 → higher thousand','Find the hundreds digit','Choose where the ball stops','Write the rounded number'];

function fullTable(){return '<table class="full-sheet" aria-label="My rounding steps"><tbody>'+fullLabels.map((label,i)=>{let value='—';if(i<fullStep){if(i===0||i===4)value=String(n)[fullAnswers[i]];else if(i===2)value=fullAnswers[1]+' → '+fmt(fullAnswers[i]);else if(i===3)value=fmt(fullAnswers[2])+' + 1 000 = '+fmt(fullAnswers[i]);else value=fmt(fullAnswers[i]);}return `<tr class="${i===fullStep?'active':''}"><th scope="row"><span class="row-number">${i+1}</span>${label}</th><td class="${i<fullStep?'done':'pending'}">${i<fullStep?'✓ ':''}${value}</td></tr>`}).join('')+'</tbody></table>'}
function renderFull(){
 if(fullStep===5){renderHill();const box=document.createElement('section');box.className='full-summary';box.innerHTML='<h2 class="full-heading">Put all the steps together</h2>'+fullTable();app.prepend(box);return}

function startHelp(){streak=0;supported=true;mode='steps';step=0;show=true;render()}
function submit(v){if(mode==='steps'){const expected=[String(n).length-4,Math.floor(n/1000),low(),high(),String(n).length-3,answer()][step];if(v!==expected){show=true;render();return}step++;if(step===6){mode='bridge';show=false}else show=true;render();return}if(!['independent','retry'].includes(mode))return;if(v===answer()){if(mode==='independent'&&!supported)streak++;mode=streak===3?'win':'success';render()}else startHelp()}
function next(){round++;const d=[4,5,0,9,1,6,3,8,2,7][(round-1)%10];let candidates=[];for(let base=10;base<100;base++){for(let tail=0;tail<100;tail++){const v=base*1000+d*100+tail;if(v%1000!==0&&!used.has(v))candidates.push(v)}}if(!candidates.length){used=new Set([n]);return next()}n=candidates[Math.floor(Math.random()*candidates.length)];if(round%4===0){const cross=candidates.filter(v=>Math.floor(v/1000)%10===9);if(cross.length)n=cross[Math.floor(Math.random()*cross.length)]}used.add(n);mode='independent';show=false;supported=false;render()}
function reset(){const previous=n;do{n=10000+Math.floor(Math.random()*90000)}while(n===previous||n%1000===0);streak=0;mode='independent';step=0;show=false;supported=false;used=new Set([n]);round=0;render()}
