const app=document.querySelector('#app'),names=['ones','tens','hundreds','thousands','ten thousands'],singular=['one','ten','hundred','thousand'];
let n=0,k=1,mode='test',stage=0,teaching=false,phase='guided',earned=[],selected=[],streak=0,bag=[],last='',frame=0,token=0,hillPhase='place',seen=new Set();
const unit=()=>10**k,lo=()=>Math.floor(n/unit())*unit(),hi=()=>lo()+unit(),digit=()=>Math.floor(n/(unit()/10))%10,ans=()=>n-lo()<unit()/2?lo():hi(),idx=()=>String(n).length-k-1;
const fmt=v=>String(v).replace(/\B(?=(\d{3})+(?!\d))/g,'\u00a0');
const question=()=>`Round <strong>${fmt(n)}</strong> to the nearest <strong>${names[k]}</strong>.`;
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function next(){if(!bag.length)bag=shuffle([1,2,3]);k=bag.pop();let key;do{const length=k+1+Math.floor(Math.random()*(5-k));n=10**(length-1)+Math.floor(Math.random()*9*10**(length-1));key=n+':'+k}while(n%unit()===0||key===last||seen.has(key));seen.add(key);last=key;mode='test';render()}
function reset(){streak=0;bag=[];seen.clear();next()}
function stop(){cancelAnimationFrame(frame);token++;document.querySelectorAll('audio').forEach(a=>a.pause());if('speechSynthesis'in window)speechSynthesis.cancel()}
function form(label){return `<form><label for="entry">${label}</label><div class="choices"><input id="entry" inputmode="numeric" autocomplete="off" aria-label="${label}"><button type="submit" class="primary">Check</button></div></form>`}
function digits(click=false,underline=false,focus=-1){return '<div class="digits">'+String(n).split('').map((d,i)=>`<${click?'button':'span'} class="digit ${underline&&i<=idx()?'copy-digit':''} ${i===focus?'focus':''} ${selected.includes(i)?'pick':''}" ${click?`data-digit="${i}" aria-pressed="${selected.includes(i)}" aria-label="Digit ${d}, position ${i+1}"`:''}>${d}</${click?'button':'span'}>`).join('')+'</div>'}
function choices(items){return '<div class="choices">'+items.map(([v,t])=>`<button data-value="${v}">${t}</button>`).join('')+'</div>'}
function expected(){return [k,idx(),Math.floor(n/unit()),k,lo(),unit(),hi(),k-1,idx()+1,ans(),ans()][stage]}
function start(guided=true){streak=0;mode='steps';phase=guided?'guided':'together';stage=0;earned=[];selected=[];teaching=false;render()}
const titles=()=>['Which place does the question ask for?','Tap the '+names[k]+' digit.','Mark the digits you will copy.','How many zeros go after them?','Write the lower '+singular[k]+'.','What must you add to find the higher '+singular[k]+'?','Write the higher '+singular[k]+'.','Which place do you look at next?','Tap the '+names[k-1]+' digit.','Place the ball, then watch it roll.','Write the rounded number.'];
function record(){const labels=['Round to',names[k]+' digit','Copied digits','Zeros','Lower '+singular[k],'Add','Higher '+singular[k],'Look at',names[k-1]+' digit','Chosen number','Rounded number'];return '<div class="record">'+earned.map((v,i)=>`<span>✓ ${labels[i]}: <b>${i===0||i===7?names[v]:i===1||i===8?String(n)[v]:fmt(v)}</b></span>`).join('')+'</div>'}
function lesson(){switch(stage){case 0:return `The question says nearest <mark>${names[k]}</mark>. Choose ${names[k]}.`;case 1:return digits(false,false,idx())+`The ${names[k]} digit is <b>${String(n)[idx()]}</b>. Count ${k+1} places from the right.`;case 2:return digits(false,true,idx())+`Copy from the left. Include the ${names[k]} digit.<div class="build">${Math.floor(n/unit())}</div><p>Leave out the ${names.slice(0,k).reverse().join(', ')} ${k===1?'digit':'digits'}.</p>`;case 3:return `<div class="build">${Math.floor(n/unit())}<mark>${'0'.repeat(k)}</mark></div>There ${k===1?'is 1 place':'are '+k+' places'} to the right of ${names[k]}. Put ${k} ${k===1?'zero':'zeros'} there.`;case 4:return `<div class="build">${Math.floor(n/unit())} → ${Math.floor(n/unit())}<mark>${'0'.repeat(k)}</mark></div>This is the lower ${singular[k]}: <b>${fmt(lo())}</b>.`;case 5:return `To find the higher ${singular[k]}, add <b>one ${singular[k]}</b>.<div class="build">+ ${fmt(unit())}</div>`;case 6:return `<div id="add-view" class="build">${fmt(lo())}</div><p id="add-note">Add one ${singular[k]}.</p><button id="animate-add" class="secondary">Watch +${fmt(unit())}</button>`;case 7:return `Look one place to the right of <b>${names[k]}</b>: the <b>${names[k-1]}</b> place.<div class="build">${names[k]} → ${names[k-1]}</div>`;case 8:return digits(false,false,idx()+1)+`The ${names[k-1]} digit is <b>${digit()}</b>.<p>0–4: lower ${singular[k]}.<br>5–9: higher ${singular[k]}.</p>`;case 10:return `${fmt(n)} rounds to <b>${fmt(ans())}</b>. Write the answer as a number.`}}
function control(){if(stage===0)return choices([1,2,3].map(x=>[x,names[x]]));if(stage===1||stage===8)return digits(true);if(stage===2)return `<p class="hint">Tap each digit to copy, from the left through the ${names[k]} digit.</p>${digits(true)}<button id="check-mark" class="primary">Copy my marked digits</button>`;if(stage===3)return choices([1,2,3].map(x=>[x,x+' '+(x===1?'zero':'zeros')]));if(stage===5)return choices([10,100,1000].map(x=>[x,'Add '+fmt(x)]));if(stage===7)return '<p class="hint">To choose '+fmt(lo())+' or '+fmt(hi())+'.</p>'+choices([0,1,2,3].map(x=>[x,names[x]]));return form(stage===4?'Write the lower '+singular[k]:stage===6?'Write the higher '+singular[k]:'Write your answer as a number')}
function render(){stop();app.classList.remove('hill-card');document.querySelector('#progress').textContent='★'.repeat(streak)+'☆'.repeat(3-streak)+' · '+streak+'/3 independently';document.querySelector('#help').hidden=!['test','retry'].includes(mode);document.querySelector('#practise').hidden=!['test','retry','success'].includes(mode);
if(mode==='test'||mode==='retry'){app.innerHTML=`<div class="tag">${mode==='retry'?'Try it without help':'Your question'}</div><h2 class="question">${question()}</h2>${form('Write your answer as a number')}<div id="feedback" class="feedback" role="status"></div>`;bindForm(checkFinal);return}
if(mode==='success'||mode==='win'){app.innerHTML=`<div class="tag">${mode==='win'?'Practice complete':'Correct'}</div><h2>${fmt(n)} → ${fmt(ans())}</h2><p>${mode==='win'?'Three fresh questions correct in a row!':streak?'Now read the next question carefully.':'Now try a fresh question.'}</p><button id="next" class="primary">${mode==='win'?'Play again':'Next question'}</button>`;document.querySelector('#next').onclick=mode==='win'?reset:next;return}
if(mode==='summary'){summary();return}
app.innerHTML=`<div class="context"><div class="tag">${phase==='guided'?'Let’s do it step by step':'Put all the steps together'}</div><h2 class="question">${question()}</h2></div>${record()}<h3 class="step-title">${stage+1}. ${titles()[stage]}</h3>`;
if(stage===9){hill();return}
app.innerHTML+=teaching?`<section class="lesson"><div class="tag">Watch this step</div>${lesson()}</section><button id="myturn" class="primary">My turn</button>`:control();app.innerHTML+='<div id="feedback" class="feedback" role="status" aria-live="polite"></div>';
if(teaching){document.querySelector('#myturn').onclick=()=>{teaching=false;selected=[];render()};if(stage===6)document.querySelector('#animate-add').onclick=animateAdd;return}
app.querySelectorAll('[data-value]').forEach(b=>b.onclick=()=>checkStep(Number(b.dataset.value)));
app.querySelectorAll('[data-digit]').forEach(b=>b.onclick=()=>{const i=+b.dataset.digit;if(stage===2){selected=selected.includes(i)?selected.filter(x=>x!==i):[...selected,i];b.classList.toggle('pick',selected.includes(i));b.setAttribute('aria-pressed',String(selected.includes(i)))}else checkStep(i)});
if(stage===2)document.querySelector('#check-mark').onclick=()=>{if(!selected.length){document.querySelector('#feedback').textContent='Tap the digits you will copy.';return}const correct=selected.length===idx()+1&&selected.every(i=>i<=idx());checkStep(correct?Math.floor(n/unit()):-1)};bindForm(checkStep)
}
function bindForm(fn){const f=app.querySelector('form');if(f)f.onsubmit=e=>{e.preventDefault();const text=document.querySelector('#entry').value.trim();if(!/^(?:\d+|\d{1,3}(?:,\d{3})+|\d{1,3}(?: \d{3})+)$/.test(text)){document.querySelector('#feedback').textContent='Write a number, then tap Check.';return}fn(Number(text.replace(/[ ,]/g,'')))}}
function checkFinal(v){if(v!==ans()){start();return}if(mode==='test')streak++;mode=streak===3?'win':'success';render()}
function checkStep(v){if(v!==expected()){teaching=true;selected=[];render();return}earned[stage]=v;stage++;selected=[];teaching=false;if(stage===11)mode='summary';render()}
function timeline(ms,update,done){cancelAnimationFrame(frame);const t=++token;let start=null;function tick(now){if(t!==token)return;if(start===null)start=now;const p=Math.min(1,(now-start)/ms);update(p);if(p<1)frame=requestAnimationFrame(tick);else if(done)done()}frame=requestAnimationFrame(tick)}
function animateAdd(){const button=document.querySelector('#animate-add');button.disabled=true;timeline(2600,p=>{const final=p>.65;const value=String(final?hi():lo());const at=value.length-k-1;document.querySelector('#add-view').innerHTML=value.split('').map((d,i)=>`<span class="${i===at?'focus':''}">${d}</span>`).join('');document.querySelector('#add-note').textContent=p<.35?'Add 1 to the '+names[k]+' digit.':final?fmt(lo())+' + '+fmt(unit())+' = '+fmt(hi())+'. This is the higher '+singular[k]+'.':String(lo())[String(lo()).length-k-1]==='9'?'9 + 1 = 10. Carry to the left.':'Increase the '+names[k]+' digit by 1.'},()=>{button.disabled=false;button.textContent='Watch again'})}
function hill(){hillPhase='place';app.classList.add('hill-card');app.innerHTML+=`<p id="motion-note">Tap the position for the ${names[k-1]} digit.</p><div class="mountain"><svg viewBox="0 0 680 350" preserveAspectRatio="none" aria-label="Rounding memory hill"><path d="M55 230 L340 70 L625 230 Z" fill="#e3eff0" stroke="#547e85" stroke-width="4"/><g id="ball" visibility="hidden"><circle r="14" fill="#e9a829" stroke="#70480e" stroke-width="3"/><path d="M-13 0 H13 M0 -13 V13" stroke="#70480e" stroke-width="2"/></g></svg>${Array.from({length:11},(_,i)=>`<button class="hill-point" data-point="${i}" style="left:${(55+i*57)/680*100}%;top:${(230-Math.min(i,10-i)*32)/350*100}%" ${i===10?'disabled':''}>${i}</button>`).join('')}<button class="hill-end left" data-end="${lo()}" disabled>${fmt(lo())}</button><button class="hill-end right" data-end="${hi()}" disabled>${fmt(hi())}</button></div><button id="roll" class="secondary" hidden>Watch it roll</button><button id="hill-retry" class="primary" hidden>My turn</button><div id="feedback" class="feedback" role="status"></div>`;app.querySelectorAll('[data-point]').forEach(b=>b.onclick=()=>place(+b.dataset.point));app.querySelectorAll('[data-end]').forEach(b=>b.onclick=()=>{if(hillPhase!=='choose')return;if(+b.dataset.end===ans())checkStep(ans());else{document.querySelector('#feedback').textContent=`${digit()} means choose ${fmt(ans())}.`;app.querySelectorAll('[data-end]').forEach(x=>x.disabled=true);const retry=document.querySelector('#hill-retry');retry.hidden=false;retry.onclick=render}});document.querySelector('#roll').onclick=roll}
function ball(p){document.querySelector('#ball').setAttribute('visibility','visible');document.querySelector('#ball').setAttribute('transform',`translate(${55+p*57} ${211-Math.min(p,10-p)*32}) rotate(${p*160})`)}
function place(v){if(hillPhase!=='place')return;app.querySelectorAll('[data-point]').forEach(b=>b.disabled=true);ball(v);if(v!==digit()){hillPhase='teach';ball(digit());document.querySelector('#feedback').textContent=`The ${names[k-1]} digit is ${digit()}. Put the ball at ${digit()}.`;const retry=document.querySelector('#hill-retry');retry.hidden=false;retry.onclick=render;return}hillPhase='ready';document.querySelector('#roll').hidden=false}
function roll(){if(!['ready','choose'].includes(hillPhase))return;hillPhase='rolling';const start=digit(),end=start<5?0:10;const b=document.querySelector('#roll');b.disabled=true;app.querySelectorAll('[data-end]').forEach(x=>x.disabled=true);ball(start);document.querySelector('#motion-note').textContent=start===0?'0: the ball stays at the lower '+singular[k]+'.':start<5?'0–4: roll to the lower '+singular[k]+'.':'5–9: roll to the higher '+singular[k]+'.';timeline(2600,p=>ball(start+(end-start)*Math.max(0,(p-.15)/.85)),()=>{hillPhase='choose';b.disabled=false;b.textContent='Roll again';document.querySelector('#motion-note').textContent=`Tap the ${singular[k]} where the ball stopped: ${fmt(lo())} or ${fmt(hi())}.`;app.querySelectorAll('[data-end]').forEach(x=>x.disabled=false)})}
function summary(){app.innerHTML=`<div class="tag">Remember the whole method</div><h2 class="question">${question()}</h2>${record()}<div class="full-final">${fmt(n)} → ${fmt(ans())}</div><div class="memory"><p><b>Read the place before you start!</b></p><p>Find the ${names[k]} digit.<br>Copy from the left, including that digit.<br>Put <b>${'0'.repeat(k)}</b> at the end: lower ${singular[k]}.<br>Add <b>${fmt(unit())}</b>: higher ${singular[k]}.</p><p>Look at the <b>${names[k-1]}</b> digit.<br><b>0 to 4? Choose the lower ${singular[k]}.<br>5 to 9? Choose the higher ${singular[k]}.</b></p></div><button id="chant" class="secondary">Hear the chant for ${names[k]}</button><audio id="audio" controls preload="metadata" src="${audioSources[k]}" style="display:block;width:100%;max-width:400px;margin:15px auto"></audio><p id="audio-status" role="status"></p><button id="finish" class="primary">Try this question without help</button><button id="repeat-steps" class="secondary">Practise the steps again</button>`;const a=document.querySelector('#audio'),b=document.querySelector('#chant');b.onclick=()=>{if(!a.paused){a.pause();a.currentTime=0}else{a.currentTime=0;a.play().catch(()=>document.querySelector('#audio-status').textContent='Tap the play triangle to hear the chant.')}};a.onplay=()=>b.textContent='Stop the chant';a.onpause=()=>b.textContent='Hear the chant for '+names[k];document.querySelector('#finish').onclick=()=>{mode='retry';earned=[];selected=[];teaching=false;render()};document.querySelector('#repeat-steps').onclick=()=>start(false)}
document.querySelector('#help').onclick=()=>start();document.querySelector('#practise').onclick=()=>start(false);document.querySelector('#restart').onclick=reset;document.querySelector('#speak').onclick=()=>{if(!('speechSynthesis'in window)){alert('Read aloud is unavailable on this device.');return}speechSynthesis.cancel();document.querySelectorAll('audio').forEach(a=>a.pause());const u=new SpeechSynthesisUtterance(app.innerText);u.lang='en-GB';u.rate=.85;speechSynthesis.speak(u)};reset();
</script></html>
