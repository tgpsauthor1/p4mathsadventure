<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Wholes and parts</title><style>
*{box-sizing:border-box}body{margin:0;background:#eef3fa;color:#203047;font-family:Arial,sans-serif;font-size:20px}main{max-width:1000px;margin:24px auto;padding:24px;background:white;border-radius:24px;box-shadow:0 8px 35px #24395813}header{display:flex;justify-content:space-between;align-items:center;gap:14px;border-bottom:1px solid #d9e1ed;padding-bottom:16px}h1{font-size:25px;margin:0}h2{font-size:27px;line-height:1.3;margin:20px 0 12px}p{line-height:1.45}button{font:inherit;padding:12px 22px;border:2px solid #294f90;border-radius:12px;background:#294f90;color:white;cursor:pointer;min-height:48px}button.secondary{background:white;color:#294f90}button:focus-visible,input:focus-visible,[role=button]:focus-visible{outline:4px solid #f5ab20;outline-offset:4px}.top{font-size:16px}.diagram{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin:18px 0}.shape{width:190px;max-width:42vw;text-align:center}.shape svg{width:100%;display:block}.caption{font-size:17px;min-height:22px}.mixed{display:inline-flex;align-items:center;gap:12px;vertical-align:middle;white-space:nowrap}.fraction{display:inline-flex;flex-direction:column;align-items:center;gap:7px}.line{width:100%;height:3px;background:#23334b;min-width:68px}input{font:700 30px Arial;width:76px;height:59px;text-align:center;border:3px solid #b27808;background:#fff5d9;border-radius:10px;color:#203047}input:disabled{background:#edf1f6;border:1px solid #b8c3d2;opacity:1;color:#203047}input.active{border-color:#2765b2;background:#eaf3ff}input::placeholder{color:transparent}.answer{display:flex;justify-content:center;align-items:center;gap:24px;margin:18px 0}.note{padding:14px 18px;border-radius:14px;background:#edf4ff;margin:14px 0;line-height:1.45}.actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:18px}#feedback{min-height:30px;text-align:center;font-weight:bold;margin-top:12px}.record{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}.record span{padding:8px 12px;background:#edf1f6;border-radius:9px;font-size:17px}.record .current{outline:2px solid #294f90}.read{font-size:16px;padding:8px 12px}.staticnum{font-size:32px;font-weight:bold;min-width:40px;text-align:center}.selectable{cursor:pointer}.selected{stroke:#b76a00;stroke-width:5}footer{display:flex;justify-content:space-between;gap:10px;margin-top:20px;font-size:16px;color:#52627b}[hidden]{display:none!important}@media(max-width:600px){main{margin:8px;padding:16px}h2{font-size:23px}.shape{width:150px}header{align-items:flex-start}.top{max-width:110px}input{width:65px}.answer{gap:12px}}
</style><main><header><h1>Wholes & parts</h1><span class="top" id="progress"></span><button class="secondary read" id="read">Read aloud</button></header><section id="screen"></section><div id="feedback" role="status" aria-live="polite"></div><footer><span>Take your time.</span><button class="secondary read" id="restart">Start again</button></footer></main><script>
'use strict';
const $=id=>document.getElementById(id), names={w:'Whole number',n:'Numerator',d:'Denominator'}, order=['w','d','n'];
let q,phase='test',streak=0,used=new Set(),last='',queue=[],part='w',earned={},stage=0,selected=new Set(),localTeach=false,utterance;
function makeQuestion(){let a;do{let type=['circle','bar','triangle'][Math.floor(Math.random()*3)],d=type==='triangle'?3:[3,4,5,6,8][Math.floor(Math.random()*5)];a={type,d,w:1+Math.floor(Math.random()*2),n:1+Math.floor(Math.random()*(d-1)),offset:Math.floor(Math.random()*d),divided:Math.random()<.3};a.key=[a.type,a.d,a.w,a.n,a.offset,a.divided].join('-')}while(used.has(a.key)||a.key===last);used.add(a.key);last=a.key;return a}
function frac(v={},active=[],whole=true){const field=k=>`<input id="${k}" aria-label="${names[k]}" inputmode="numeric" autocomplete="off" maxlength="3" ${active.includes(k)?'':'disabled'} value="${v[k]??''}">`;return `<span class="mixed">${whole?field('w'):''}<span class="fraction">${field('n')}<span class="line"></span>${field('d')}</span></span>`}
function fixed(v,whole=true){return `<span class="mixed">${whole?`<span class="staticnum">${v.w}</span>`:''}<span class="fraction"><span class="staticnum">${v.n}</span><span class="line"></span><span class="staticnum">${v.d}</span></span></span>`}
function shaded(i){return (i-q.offset+q.d)%q.d<q.n}
function svg(full,index,mode='',labels=false){let d=q.d,paths='',items=[];const polygon=(points,i,cx,cy)=>items.push({tag:`<polygon points="${points}"`,i,cx,cy});
if(q.type==='circle'){for(let i=0;i<d;i++){let a=-Math.PI/2+i*2*Math.PI/d,b=a+2*Math.PI/d,m=(a+b)/2;items.push({tag:`<path d="M100 100 L${100+82*Math.cos(a)} ${100+82*Math.sin(a)} A82 82 0 0 1 ${100+82*Math.cos(b)} ${100+82*Math.sin(b)} Z"`,i,cx:100+53*Math.cos(m),cy:100+53*Math.sin(m)})}}
else if(q.type==='bar'){for(let i=0;i<d;i++)items.push({tag:`<rect x="${12+i*176/d}" y="38" width="${176/d}" height="124"`,i,cx:12+(i+.5)*176/d,cy:100})}
else{polygon('100,18 18,172 100,121',0,73,104);polygon('100,18 100,121 182,172',1,127,104);polygon('18,172 182,172 100,121',2,100,153)}
let clickable=mode==='w'?'whole':mode==='d'||mode==='n'?'part':'';
if(full&&!q.divided&&!labels){paths=q.type==='circle'?'<circle cx="100" cy="100" r="82" fill="#b9cee9" stroke="#466b9b" stroke-width="2"/>':q.type==='bar'?'<rect x="12" y="38" width="176" height="124" fill="#b9cee9" stroke="#466b9b" stroke-width="2"/>':'<polygon points="100,18 18,172 182,172" fill="#b9cee9" stroke="#466b9b" stroke-width="2"/>'}
else paths=items.map(o=>{let isShade=full||shaded(o.i),sel=selected.has(o.i)&&!full,click=clickable==='part'&&!full;return `${o.tag} fill="${isShade?'#b9cee9':'#fff'}" stroke="${sel?'#b76a00':'#466b9b'}" stroke-width="${sel?5:2}" ${click?`class="selectable" role="button" tabindex="0" aria-label="Part ${o.i+1}, ${isShade?'shaded':'unshaded'}" aria-pressed="${sel}" data-part="${o.i}"`:''}/>${labels||sel?`<text x="${o.cx}" y="${o.cy+6}" text-anchor="middle" font-size="20" font-weight="bold" pointer-events="none">${labels?o.i+1:'✓'}</text>`:''}`}).join('');
let wholeClick=clickable==='whole',selWhole=selected.has(index);return `<div class="shape"><svg viewBox="0 0 200 200" ${wholeClick?`role="button" tabindex="0" class="selectable" aria-label="Shape ${index+1}" aria-pressed="${selWhole}" data-whole="${index}"`:'role="img" aria-label="'+(full?'Fully shaded':'Partly shaded')+' '+q.type+'"'}>${paths}${wholeClick&&selWhole?'<rect x="4" y="4" width="192" height="192" rx="16" fill="none" stroke="#b76a00" stroke-width="5"/><text x="174" y="25" font-size="23">✓</text>':''}</svg><div class="caption">${labels&&full?'1 whole':''}</div></div>`}
function diagram(mode='',labels=false,only=false){return `<div class="diagram">${only?'':Array.from({length:q.w},(_,i)=>svg(true,i,mode,labels)).join('')}${svg(false,q.w,mode,labels)}</div>`}
function prompt(k){return k==='w'?'How many whole shapes are shaded?':k==='d'?'How many equal parts make one whole?':'How many parts of the last shape are shaded?'}
function explanation(k){return k==='w'?`${q.w} completely shaded shapes = ${q.w} wholes.`:k==='d'?`All ${q.d} equal parts make one whole. Include the white parts.`:`${q.n} of the ${q.d} equal parts are shaded.`}
function button(id,t,secondary=false){return `<button id="${id}" ${secondary?'class="secondary"':''}>${t}</button>`}
function render(){if('speechSynthesis'in window)speechSynthesis.cancel();$('feedback').textContent='';$('progress').textContent=`Fresh answers: ${streak} / 3`;
let html='';
if(phase==='test'||phase==='original')html=`<h2>Write the mixed number shown.</h2>${diagram()}<div class="answer">${frac({},['w','n','d'])}</div><div class="actions">${button('check','Check')}${button('help','Help me',true)}</div>`;
if(phase==='teach')html=`<h2>${prompt(part)}</h2>${diagram('',true,part!=='w')}<div class="note">${explanation(part)}</div><div class="answer">${frac({[part]:q[part]},[])}</div><div class="actions">${button('myturn','My turn')}</div>`;
if(phase==='partRetry')html=`<h2>${prompt(part)}</h2>${diagram('',false,part!=='w')}<div class="answer">${frac({},[part])}</div><div class="actions">${button('check','Check')}</div>`;
if(phase==='connect')html=`<h2>Put the three counts together.</h2>${diagram()}<div class="note">${q.w} whole shapes • ${q.d} equal parts in one whole • ${q.n} shaded parts in the last shape</div><div class="answer">${fixed(q)}</div><div class="actions">${button('rehearse','Practise all steps')}</div>`;
if(phase==='rehearsal'){let k=order[stage];html=`<h2>Practise all steps</h2><div class="record">${order.map((s,i)=>`<span class="${i===stage?'current':''}">${s==='w'?'Whole shapes':s==='d'?'All equal parts':'Shaded parts'}${earned[s]!=null?' ✓':''}</span>`).join('')}</div><h2>${localTeach?prompt(k):k==='w'?'Tap each completely shaded shape.':k==='d'?'Tap every part of the last shape.':'Tap each shaded part of the last shape.'}</h2>${diagram(localTeach?'':k,localTeach)}${localTeach?`<div class="note">${explanation(k)}</div>`:''}<div class="answer">${frac(localTeach?{...earned,[k]:q[k]}:earned,[])}</div><div class="actions">${localTeach?button('localRetry','My turn'):button('checkSelection','Check selection')}</div>`}
if(phase==='remember')html=`<h2>You put the method together.</h2>${diagram()}<div class="answer">${fixed(earned)}</div><div class="note">Count the whole shapes: write on the left.<br>Count all equal parts in one whole: write below the line.<br>Count its shaded parts: write above the line.</div><div class="actions">${button('retryOriginal','Now try without help')}</div>`;
if(phase==='success')html=`<h2>✓ That matches the shaded amount.</h2>${diagram()}<div class="answer">${fixed(earned)}</div><div class="actions">${button('next','Next question')}</div>`;
if(phase==='done')html=`<h2>✓ Three fresh answers, without help!</h2><p>Now try a new question on paper. Write the whole number beside the fraction.</p><div class="actions">${button('again','Practise again')}</div>`;
$('screen').innerHTML=html;bind();let inp=document.querySelector('input:not(:disabled)');if(inp)inp.focus({preventScroll:true});}
function say(t){$('feedback').textContent=t}
function values(keys){let v={};for(let k of keys){let s=$(k).value.trim();if(!/^\d{1,3}$/.test(s)){say('Type a whole number in each highlighted box.');$(k).focus();return null}v[k]=Number(s)}return v}
function equivalent(v){return v.w===q.w&&v.d>0&&v.n>0&&v.n<v.d&&v.n*q.d===q.n*v.d}
function help(keys){streak=0;queue=keys.length?keys:[...order];part=queue.shift();phase='teach';render()}
function check(){if(phase==='test'||phase==='original'){let v=values(['w','n','d']);if(!v)return;if(!v.d){say('The denominator must be greater than 0.');$('d').focus();return}if(equivalent(v)){earned=v;if(phase==='test')streak++;phase=streak>=3?'done':'success';render()}else help(order.filter(k=>v[k]!==q[k]))}
else if(phase==='partRetry'){let v=values([part]);if(!v)return;if(v[part]!==q[part]){phase='teach';render()}else{if(queue.length){part=queue.shift();phase='teach'}else phase='connect';render()}}}
function selectionCheck(){let k=order[stage],target=k==='w'?Array.from({length:q.w},(_,i)=>i):Array.from({length:q.d},(_,i)=>i).filter(i=>k==='d'||shaded(i));if(!selected.size){say('Tap the shapes or parts first.');return}if(selected.size===target.length&&target.every(i=>selected.has(i))){earned[k]=target.length;selected.clear();stage++;if(stage===3)phase='remember';render()}else{localTeach=true;selected.clear();render()}}
function select(el){let key=el.hasAttribute('data-part')?'part':'whole',i=Number(el.dataset[key]);selected.has(i)?selected.delete(i):selected.add(i);render();document.querySelector(`[data-${key}="${i}"]`)?.focus({preventScroll:true})}
function on(id,fn){if($(id))$(id).onclick=fn}
function bind(){on('check',check);on('help',()=>help([...order]));on('myturn',()=>{phase='partRetry';render()});on('rehearse',()=>{phase='rehearsal';stage=0;earned={};selected.clear();localTeach=false;render()});on('checkSelection',selectionCheck);on('localRetry',()=>{localTeach=false;selected.clear();render()});on('retryOriginal',()=>{phase='original';earned={};render()});on('next',()=>{q=makeQuestion();phase='test';render()});on('again',restart);document.querySelectorAll('[data-whole],[data-part]').forEach(el=>{el.onclick=()=>select(el);el.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();select(el)}}});document.querySelectorAll('input:not(:disabled)').forEach(el=>el.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();check()}})}
function restart(){streak=0;used.clear();q=makeQuestion();phase='test';earned={};selected.clear();render()}
$('restart').onclick=restart;$('read').onclick=()=>{if(!('speechSynthesis'in window)){say('Read aloud is unavailable. Follow the words on screen.');return}speechSynthesis.cancel();utterance=new SpeechSynthesisUtterance($('screen').innerText);utterance.lang='en-GB';utterance.rate=.85;utterance.onerror=()=>say('Read aloud is unavailable on this device.');speechSynthesis.speak(utterance)};restart();
</script></html>
