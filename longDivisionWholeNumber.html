0 14px}.label{display:block;font-size:16px;font-weight:700;margin:7px 0}.answer{border:2px solid #9aafb9;border-radius:10px;height:59px;font:700 30px 'Courier New',monospace;padding:8px 12px;color:var(--ink);width:100%;min-width:0;background:white}.equation{display:flex;gap:12px;align-items:center;justify-content:center;flex-wrap:wrap;font:700 31px 'Courier New',monospace;margin:20px 0 12px}.equation .answer{width:118px;height:61px;text-align:center}.controls{max-width:360px;margin:0 auto}.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:12px 0}.keypad button{min-height:47px;font-size:23px;padding:5px}.keypad .word{font-size:14px}.check{width:100%;margin:0 0 6px}.feedback{font-size:17px;padding:10px 12px;margin:12px 0;background:#fff5de;border-left:4px solid #bc810c;border-radius:8px}.work{background:var(--paper);border:1px solid #e0e6df;border-radius:13px;padding:10px 8px;margin-top:13px;overflow:auto}.board{display:grid;grid-template-columns:51px repeat(var(--n),var(--cell));grid-auto-rows:var(--row);width:max-content;margin:auto;padding-bottom:5px}.sq{height:var(--row);width:var(--cell);min-height:0;display:flex;align-items:center;justify-content:center;position:relative;font:700 29px 'Courier New',monospace;border:0;border-radius:0;padding:0;background:transparent;color:var(--ink)}.gutter{display:flex;align-items:center;justify-content:center;font-size:25px}.answerlabel{font:700 11px Arial;color:#60757e}.sq.original{background:#f6f4e9;border-top:3px solid var(--ink)}.sq.first{border-left:3px solid var(--ink)}.sq.lane{border-right:1px solid #dbe5df}.sq.used:after{content:'✓';position:absolute;bottom:1px;right:5px;font:700 12px Arial;color:var(--teal)}.sq.subline{border-bottom:2px solid var(--ink)}button.sq{min-height:44px;height:44px;width:calc(var(--cell) - 4px);margin:1px 2px 2px;border:1px dashed #9db6bd;border-radius:5px}.sq.demo{background:#fff0bd;outline:3px solid #b87c04;outline-offset:-3px}.sq.source{background:#fff4d3;box-shadow:inset 0 -3px #bd8a18}.history{margin-top:17px}.history .work{max-height:310px}.historylabel{font-size:13px;color:#657980;margin:0 0 3px}.choices{display:flex;gap:12px;margin:18px 0}.choices button{flex:1;min-height:55px}.model{margin:12px 0}.equation-demo{font-size:30px;font-weight:bold;margin:12px 0}.groups{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.group{padding:9px;border:1px solid #88b4a8;border-radius:9px;background:#f1faf5;min-height:48px}.tokens{display:flex;flex-wrap:wrap;gap:4px}.token{width:12px;height:12px;background:var(--teal);border:1px solid #075852;border-radius:50%;display:inline-block}.token.usedtoken{background:#d9e0dc;border-color:#9caea5}.token.lefttoken{background:#edbd4d;border:2px solid #785d15}.small{font-size:14px;color:#5b737b;margin:7px 0}.continue{width:100%;margin-top:14px}.summary h2{font-size:27px;line-height:1.3;margin:4px 0 10px}.summary .big{font-size:34px;font-weight:bold;color:var(--teal)}.summary p{margin:10px 0}.memory{padding:12px 15px;background:var(--pale);border-radius:11px;margin:15px 0}.memory p{font-size:18px;margin:7px 0}.status{max-width:650px;margin:7px auto;color:#815b13;font-size:14px;min-height:18px}.footer{text-align:center;color:#647a80;font-size:13px;margin-top:14px}.flying{position:fixed;z-index:10;pointer-events:none;font:700 29px 'Courier New',monospace;color:#075d58;background:#fff5cf;padding:3px 7px;border-radius:5px}@media(max-width:600px){.wrap{padding:14px 10px 22px}.top{margin-bottom:12px}h1{font-size:23px}.progress{font-size:12px;max-width:125px}.card{padding:16px 12px}.testcard{padding:20px}.instruction{font-size:21px}.instruction-row{flex-wrap:wrap}.instruction-row .instruction{min-width:210px}.question{font-size:33px}.result{font-size:25px}.work{padding:9px 2px}.equation{font-size:28px}.equation .answer{width:105px}}@media(max-width:365px){:root{--cell:55px}.board{grid-template-columns:43px repeat(var(--n),var(--cell))}.instruction{font-size:20px}.question{font-size:30px}}@media(prefers- </style></head><body><div class="wrap"><header class="top"><h1>Long division</h1><div class="progress"><div class="dots" id="dots"></div><div id="progressText"></div></div></header><main id="app"></main><div class="status" id="speechStatus" role="status"></div><footer class="footer">Take your time.</footer></div><script>
'use strict';
const $=id=>document.getElementById(id),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const places=['ones','tens','hundreds','thousands','ten thousands'];
let state,serial=0,utterance=null,voiceTimer=null,voiceVersion=0,animation=null,locked=false;
const recent=new Set(['2820/3']);
function makeProblem(N,d){const digits=String(N).split('').map(Number),n=digits.length,stages=[];let r=0;digits.forEach((digit,i)=>{const current=r*10+digit,q=Math.floor(current/d),prod=q*d;r=current-prod;stages.push({i,current,q,prod,r,pr:2+i*2,rr:3+i*2});});return{N,d,digits,n,stages,answer:Math.floor(N/d),remainder:r,rows:2+n*2};}
function freshProblem(){const kind=serial++%4;for(let k=0;k<2000;k++){const d=2+Math.floor(Math.random()*8);let q;if(kind===0)q=(10+Math.floor(Math.random()*89))*10;else if(kind===1)q=(1+Math.floor(Math.random()*9))*100+1+Math.floor(Math.random()*9);else if(kind===2)q=111+Math.floor(Math.random()*888);else q=1000+Math.floor(Math.random()*3000);const N=q*d,key=N+'/'+d;if(N>=1000&&N<=9999&&!recent.has(key)){recent.add(key);return makeProblem(N,d);}}recent.clear();return freshProblem();}
function tasksFor(p){const tasks=[];for(const s of p.stages){tasks.push({kind:'divide',i:s.i},{kind:'placeQ',i:s.i,row:0,col:s.i,digit:String(s.q)},{kind:'multiply',i:s.i});const digits=String(s.prod);for(let j=0;j<digits.length;j++)tasks.push({kind:'placeP',i:s.i,row:s.pr,col:s.i-digits.length+1+j,digit:digits[j],last:j===digits.length-1});tasks.push({kind:'subtract',i:s.i},{kind:'placeR',i:s.i,row:s.rr,col:s.i,digit:String(s.r)});if(s.i===p.n-1||s.r===0)tasks.push({kind:'finished',i:s.i,expected:s.i===p.n-1});if(s.i<p.n-1)tasks.push({kind:'bring',i:s.i,row:s.rr,col:s.i+1,digit:String(p.digits[s.i+1])});}tasks.push({kind:'answer',i:p.n-1},{kind:'check',i:p.n-1});return tasks;}
const blank=p=>Array.from({length:p.rows},()=>Array(p.n).fill(''));
function stopVoice(){voiceVersion++;clearTimeout(voiceTimer);if('speechSynthesis'in window)speechSynthesis.cancel();utterance=null;}
function say(text){stopVoice();$('speechStatus').textContent='';if(!('speechSynthesis'in window)||!('SpeechSynthesisUtterance'in window)){$('speechStatus').textContent='Read-aloud is unavailable. The instructions are shown on screen.';return;}const version=voiceVersion;const play=()=>{if(version!==voiceVersion)return;const voices=speechSynthesis.getVoices();if(!voices.length){$('speechStatus').textContent='No voice is available. The instructions are shown on screen.';return;}utterance=new SpeechSynthesisUtterance(text);utterance.voice=voices.find(v=>/^en-GB/.test(v.lang))||voices.find(v=>/^en/.test(v.lang))||voices[0];utterance.rate=.87;utterance.onstart=()=>{$('speechStatus').textContent='Reading…';};utterance.onend=()=>{$('speechStatus').textContent='';};utterance.onerror=()=>{$('speechStatus').textContent='The sound did not play. Read the instructions on screen.';};speechSynthesis.speak(utterance);};if(speechSynthesis.getVoices().length)play();else voiceTimer=setTimeout(play,650);}
function startProblem(p,reset=false){stopVoice();animation?.cancel();locked=false;state={p,tasks:tasksFor(p),index:0,mode:'independent',streak:reset?0:state?.streak||0,eligible:true,board:blank(p),lines:new Set(),used:new Set(),value:'',message:'',teaching:false,retrying:false,errors:{}};render();}
const task=()=>state.tasks[state.index];
const isPlace=t=>['placeQ','placeP','placeR','bring'].includes(t.kind);
const isCalc=t=>['divide','multiply','subtract','answer','check'].includes(t.kind);
function expected(t){const s=state.p.stages[t.i];return({divide:s.q,multiply:s.prod,subtract:s.r,answer:state.p.answer,check:state.p.N})[t.kind];}
function expression(t){const p=state.p,s=p.stages[t.i];return({divide:`${s.current} ÷ ${p.d}`,multiply:`${s.q} × ${p.d}`,subtract:`${s.current} − ${s.prod}`,check:`${p.answer} × ${p.d}`})[t.kind]||'';}
function placementContext(t){const s=state.p.stages[t.i];if(t.kind==='placeQ')return`${s.current} ÷ ${state.p.d}`;if(t.kind==='placeP')return`${s.q} × ${state.p.d} = ${s.prod}`;if(t.kind==='placeR')return`${s.current} − ${s.prod} = ${s.r}`;return`Bring down ${t.digit}.`;}
function instruction(t){if(t.kind==='placeQ')return`Tap the square where you should write ${t.digit} in the answer.`;if(t.kind==='placeP'&&String(state.p.stages[t.i].prod).length>1)return`Tap the square where you should write the ${t.digit} in ${state.p.stages[t.i].prod}.`;if(isPlace(t))return`Tap the square where you should write ${t.digit}.`;if(t.kind==='finished')return`Have you divided all the digits in ${state.p.N}?`;if(t.kind==='answer')return'What is the complete answer?';if(t.kind==='check')return'Check your answer by multiplying.';return`What is ${expression(t)}?`;}
function explanation(t){const p=state.p,s=p.stages[t.i],place=places[p.n-1-t.i];switch(t.kind){case'divide':return s.current<p.d?`${s.current} is smaller than ${p.d}. You can make 0 whole groups of ${p.d}.`:`${s.q} × ${p.d} = ${s.prod}. Another ${p.d} would make ${(s.q+1)*p.d}, which is more than ${s.current}.`;case'multiply':return`${s.q} × ${p.d} = ${s.prod}.`;case'subtract':return`${s.current} − ${s.prod} = ${s.r}.`;case'placeQ':return`Write ${s.q} above the ${p.digits[t.i]} in the ${place} place.`;case'placeP':return String(s.prod).length===1?`After multiplying ${s.q} by ${p.d}, you get ${s.prod}. Write ${s.prod} below ${s.current}, as shown.`:`Write ${s.prod} below ${s.current}, as shown. The ${t.digit} of ${s.prod} goes in the highlighted square.`;case'placeR':return`Write ${s.r} directly below the subtraction line, as shown.`;case'bring':return`Bring ${t.digit} straight down. Write ${t.digit} beside the ${s.r} left after subtracting.`;case'finished':return t.expected?`Yes. Each digit in ${p.N} has been divided.`:`No. You have not divided the ${p.digits[t.i+1]} in the ${places[p.n-2-t.i]} place. Bring it down next.`;case'answer':return String(p.answer).endsWith('0')?`The answer is ${p.answer}. Keep the 0 in the ones place.`:`The answer is ${p.answer}. You can leave out a zero at the beginning.`;case'check':return`${p.answer} × ${p.d} = ${p.N}. This matches the number you started with.`;}}
function keypad(){return`<div class="keypad" aria-label="Number keypad">${[1,2,3,4,5,6,7,8,9,'clear',0,'erase'].map(k=>`<button data-key="${k}" class="${typeof k==='string'?'word':''}" aria-label="${k==='erase'?'Delete last digit':k}">${k==='erase'?'⌫':k==='clear'?'Clear':k}</button>`).join('')}</div>`;}
function feedback(){return state.message?`<div class="feedback" role="status">${esc(state.message)}</div>`:'';}
function listener(){return'<button class="listen" data-action="listen">Listen</button>';}
function boardHTML(t,teaching=false){const p=state.p,b=state.board.map(r=>r.slice());if(teaching&&isPlace(t))b[t.row][t.col]=t.digit;let highest=1;b.forEach((r,i)=>{if(r.some(c=>c!==''))highest=Math.max(highest,i);});let rows=Math.min(p.rows,Math.max(2,highest+1,isPlace(t)?t.row+1:0));if(t.kind==='finished')rows=Math.min(p.rows,highest+1);let h=`<div class="board" style="--n:${p.n}" aria-label="Long division working">`;for(let r=0;r<rows;r++){h+=`<div class="gutter ${r===0?'answerlabel':''}">${r===0?'Answer':r===1?p.d:state.lines.has(r)?'−':''}</div>`;for(let c=0;c<p.n;c++){const value=r===1?String(p.digits[c]):b[r][c];let cls='sq';if(r===1)cls+=' original';if(r===1&&c===0)cls+=' first';if(!state.retrying)cls+=' lane';if(r===1&&state.used.has(c)&&!state.retrying)cls+=' used';if(state.lines.has(r))cls+=' subline';if(teaching&&isPlace(t)&&r===t.row&&c===t.col)cls+=' demo';if(teaching&&r===1&&c===(t.kind==='bring'?t.i+1:t.i))cls+=' source';const click=isPlace(t)&&!teaching&&r!==1&&value===''&&r===t.row;const aria=`${r===0?'Answer':r===1?'Number':`Working row ${r-1}`}, ${places[p.n-1-c]} column${value!==''?', '+value:''}`;h+=click?`<button class="${cls}" data-cell="${r},${c}" aria-label="${aria}">${esc(value)}</button>`:`<div class="${cls}" data-reference="${r},${c}" aria-label="${aria}">${esc(value)}</div>`;} }return h+'</div>';}
function model(t){const p=state.p,s=p.stages[t.i];if(t.kind==='divide'||t.kind==='multiply'){const amount=t.kind==='divide'?s.current:s.prod,remainder=t.kind==='divide'?s.r:0;return`<div class="model"><p class="equation-demo">${expression(t)} = ${expected(t)}${t.kind==='divide'?' remainder '+s.r:''}</p><p class="small">Each dot represents 1 ${places[p.n-1-t.i].replace(/s$/,'')}.</p><div class="groups">${Array.from({length:p.d},()=>`<div class="group"><div class="tokens">${'<span class="token"></span>'.repeat(s.q)}</div><div class="small">${s.q} in each group</div></div>`).join('')}</div>${t.kind==='divide'?`<p class="small">${s.prod} shared. ${remainder} left.</p><div class="tokens">${'<span class="token lefttoken"></span>'.repeat(remainder)}</div>`:''}</div>`;}
if(t.kind==='subtract')return`<div class="model"><p class="equation-demo">${expression(t)} = ${s.r}</p><div class="tokens">${'<span class="token usedtoken"></span>'.repeat(s.prod)}${'<span class="token lefttoken"></span>'.repeat(s.r)}</div><p class="small">Grey: ${s.prod} taken away. Gold: ${s.r} left.</p></div>`;if(t.kind==='answer'||t.kind==='check')return`<p class="equation-demo">${t.kind==='answer'?`${p.N} ÷ ${p.d} = ${p.answer}`:`${expression(t)} = ${p.N}`}</p>`;return'';}
function render(){stopVoice();$('speechStatus').textContent='';$('dots').innerHTML=Array.from({length:3},(_,i)=>`<span class="dot ${i<state.streak?'done':''}" aria-label="${i<state.streak?'Complete':'Not yet'}">${i<state.streak?'✓':''}</span>`).join('');$('progressText').textContent=`${state.streak} of 3 correct in a row`;
if(['summary','passed','complete'].includes(state.mode)){renderSummary();return;}
if(state.mode==='independent'){$('app').innerHTML=`<section class="card testcard"><div class="badge">${state.eligible?'Your turn':'Try the same question again'}</div><div class="question">${state.p.N} ÷ ${state.p.d} = ?</div><div class="instruction-row"><h2 class="instruction" id="prompt">Work on paper. Type your answer.</h2>${listener()}</div><label class="label" for="entry">Answer</label><input id="entry" class="answer" inputmode="numeric" autocomplete="off" aria-label="Answer" value="${esc(state.value)}">${keypad()}<button class="primary check" data-action="checkAnswer">Check answer</button>${feedback()}</section>`;bindInput();return;}
const t=task(),head=`<div class="context"><span>${state.p.N} ÷ ${state.p.d}</span>${listener()}</div>`;let body='';
if(state.teaching){body=`<div class="instruction-row"><h2 class="instruction" id="prompt">${esc(explanation(t))}</h2></div>${model(t)}${isPlace(t)||t.kind==='finished'?`<div class="work">${boardHTML(t,true)}</div>`:''}<button class="primary continue" data-action="retryStep">Now try this step</button>`;}
else if(isPlace(t)){body=`<div class="result">${esc(placementContext(t))}</div><div class="instruction-row"><h2 class="instruction" id="prompt">${esc(instruction(t))}</h2></div><div class="work">${boardHTML(t)}</div>${feedback()}`;}
else if(t.kind==='finished'){body=`<div class="instruction-row"><h2 class="instruction" id="prompt">${esc(instruction(t))}</h2></div><div class="choices"><button data-choice="yes">Yes</button><button data-choice="no">No</button></div><div class="work">${boardHTML(t)}</div>`;}
else{const line=t.kind==='answer'?`${state.p.N} ÷ ${state.p.d}`:expression(t);body=`${t.kind==='check'?'<p class="small">Check your answer by multiplying.</p>':''}<div class="instruction-row"><h2 class="instruction" id="prompt">${t.kind==='answer'?'What is the complete answer?':'What is '+esc(expression(t))+'?'}</h2></div><div class="equation"><span>${esc(line)} =</span><input id="entry" class="answer" inputmode="numeric" autocomplete="off" aria-label="Answer to ${esc(line)}" value="${esc(state.value)}"></div><div class="controls">${keypad()}<button class="primary check" data-action="checkStep">Check</button>${feedback()}</div><div class="history"><p class="historylabel">Your working</p><div class="work">${boardHTML(t)}</div></div>`;}
$('app').innerHTML=`<section class="card">${head}${body}</section>`;bindInput();}
function bindInput(){$('entry')?.addEventListener('input',e=>{state.value=e.target.value;});}
function renderSummary(){let title,body,action,label;if(state.mode==='complete'){title='3 correct answers in a row!';body='<p>You have completed the practice.</p>';action='again';label='Practise again';}else if(state.mode==='passed'){title='Correct.';body=`<p class="big">${state.p.N} ÷ ${state.p.d} = ${state.p.answer}</p><p>${state.eligible?`${state.streak} of 3 correct in a row.`:'Now try a new question without help.'}</p>`;action='next';label='Next question';}else{title='Now try the question on your own.';body=`<p class="big">${state.p.N} ÷ ${state.p.d} = ${state.p.answer}</p><div class="memory"><p><strong>Divide.</strong> Write the answer above.</p><p><strong>Multiply.</strong> Write the result below.</p><p><strong>Subtract.</strong> Write what is left.</p><p><strong>Bring down</strong> the next digit.</p></div><p>The working will disappear when you continue.</p>`;action='retryQuestion';label='Try without help';}$('app').innerHTML=`<section class="card summary"><div class="instruction-row"><h2 id="prompt">${title}</h2>${listener()}</div>${body}<button class="primary continue" data-action="${action}">${label}</button></section>`;}
function parseNumber(raw){const text=String(raw).trim();if(!text)return null;if(!/^(?:\d+|\d{1,3}(?:[ ,]\d{3})+)$/.test(text))return NaN;return Number(text.replace(/[ ,]/g,''));}
function message(text){state.message=text;render();}
function checkAnswer(){if(state.mode!=='independent')return;const v=parseNumber(state.value);if(v===null){message('Type your answer first.');return;}if(Number.isNaN(v)){message('Type a whole number, for example 24.');return;}if(v===state.p.answer){if(state.eligible)state.streak++;state.mode=state.streak>=3?'complete':'passed';render();}else startCorrection();}
function startCorrection(){state.mode='guided';state.streak=0;state.eligible=false;state.board=blank(state.p);state.lines=new Set();state.used=new Set();state.tasks=tasksFor(state.p);state.index=0;state.value='';state.message='';state.teaching=false;state.retrying=false;state.errors={};render();}
function teach(){state.teaching=true;state.retrying=false;state.value='';state.message='';state.errors[state.index]=(state.errors[state.index]||0)+1;render();}
function completeStep(){const t=task();if(isPlace(t)){state.board[t.row][t.col]=t.digit;if(t.kind==='placeQ')state.used.add(t.i);if(t.kind==='placeP'&&t.last)state.lines.add(t.row);}state.index++;state.value='';state.message='';state.teaching=false;state.retrying=false;if(state.index===state.tasks.length)state.mode='summary';render();}
function checkStep(){if(state.mode!=='guided'||state.teaching||locked||!isCalc(task()))return;const v=parseNumber(state.value);if(v===null){message('Type your answer first.');return;}if(Number.isNaN(v)){message('Type a whole number, for example 24.');return;}if(v===expected(task()))completeStep();else teach();}
async function placeDigit(row,col){if(state.mode!=='guided'||state.teaching||locked||!isPlace(task()))return;const t=task();if(row!==t.row||col!==t.col){teach();return;}if(t.kind==='bring'&&!matchMedia('(prefers-reduced-motion: reduce)').matches){const source=document.querySelector(`[data-reference="1,${t.i+1}"]`),destination=document.querySelector(`[data-cell="${row},${col}"]`);if(source&&destination){const a=source.getBoundingClientRect(),b=destination.getBoundingClientRect(),fly=document.createElement('span');fly.className='flying';fly.textContent=t.digit;fly.style.left=(a.left+a.width/2-16)+'px';fly.style.top=(a.top+a.height/2-19)+'px';document.body.append(fly);locked=true;animation=fly.animate([{transform:'translateY(0)'},{transform:`translate(${b.left-a.left}px,${b.top-a.top}px)`}],{duration:430,easing:'ease-in-out'});try{await animation.finished;}catch{}fly.remove();locked=false;animation=null;}}completeStep();}
function choose(value){if(state.mode!=='guided'||state.teaching||task().kind!=='finished'||locked)return;if((value==='yes')===task().expected)completeStep();else teach();}
function key(k){if(locked||state.teaching)return;const field=$('entry');if(!field)return;let v=field.value;if(k==='clear')v='';else if(k==='erase')v=v.slice(0,-1);else if(v.length<10)v+=k;field.value=v;state.value=v;}
function doAction(a){if(locked)return;if(a==='listen'){let text=$('prompt')?.textContent||'';if(state.mode==='independent')text=`${state.p.N} divided by ${state.p.d}. `+text;else if(state.mode==='guided'&&!state.teaching&&isPlace(task()))text=placementContext(task())+' '+text;say(text);return;}if(a==='checkAnswer')checkAnswer();if(a==='checkStep')checkStep();if(a==='retryStep'){state.teaching=false;state.retrying=true;state.value='';state.message='';render();}if(a==='retryQuestion'){state.mode='independent';state.value='';state.board=blank(state.p);state.lines=new Set();state.used=new Set();state.teaching=false;state.retrying=false;state.eligible=false;render();}if(a==='next')startProblem(freshProblem());if(a==='again')startProblem(freshProblem(),true);}
$('app').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.action){doAction(b.dataset.action);return;}if(b.dataset.key!==undefined){key(b.dataset.key);return;}if(b.dataset.choice){choose(b.dataset.choice);return;}if(b.dataset.cell){const[r,c]=b.dataset.cell.split(',').map(Number);placeDigit(r,c);}});
document.addEventListener('keydown',e=>{if(e.ctrlKey||e.metaKey||e.altKey||locked)return;if(e.key==='Enter'){if(state.mode==='independent'){e.preventDefault();checkAnswer();}else if(state.mode==='guided'&&!state.teaching&&isCalc(task())){e.preventDefault();checkStep();}return;}if(e.target.tagName==='INPUT')return;if(/^[0-9]$/.test(e.key)){e.preventDefault();key(e.key);}if(['Backspace','Delete'].includes(e.key)){e.preventDefault();key('erase');}});
window.addEventListener('pagehide',()=>{stopVoice();animation?.cancel();});
startProblem(makeProblem(2820,3),true);
</script></body></html>
