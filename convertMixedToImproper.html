<!doctype html>
<html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mixed numbers to improper fractions</title>
<style>
:root{font-family:Arial,sans-serif;color:#183249;background:#eaf3f7;font-size:20px}*{box-sizing:border-box}body{margin:0}header{max-width:940px;margin:auto;padding:22px 24px 12px;display:flex;justify-content:space-between;align-items:center;gap:12px}header strong{font-size:20px}header small{display:block;margin-top:6px;color:#4d6375}main{max-width:900px;margin:12px auto 30px;background:white;border-radius:24px;border:1px solid #d0e1e9;padding:28px 36px;box-shadow:0 8px 30px #153e4b0c}h1{font-size:29px;line-height:1.25;margin:8px 0 20px}h2{font-size:24px;margin:16px 0}p{line-height:1.45;margin:12px 0}.eyebrow{color:#52677a;font-size:16px;font-weight:bold;letter-spacing:.04em}.math{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:14px;font-size:34px;margin:20px 0}.token,.mixed{display:inline-flex;align-items:center;gap:9px;white-space:nowrap}.frac{display:inline-flex;flex-direction:column;align-items:stretch;text-align:center;vertical-align:middle;line-height:1.15;min-width:38px}.frac>span:first-child{border-bottom:2px solid currentColor;padding:3px 8px 5px}.frac>span:last-child{padding:5px 8px 3px}.frac.input>span{padding:4px}.frac input{width:70px}.whole input{width:70px}input{height:52px;font:inherit;font-size:28px;text-align:center;background:#fff7d7;border:2px solid #a77713;border-radius:9px;color:#183249}input:focus,button:focus-visible{outline:4px solid #42a0cc;outline-offset:3px}button{font:inherit;font-weight:bold;min-height:48px;border:2px solid transparent;border-radius:12px;padding:11px 20px;background:#176c78;color:white;cursor:pointer}button:hover{filter:brightness(.95)}.secondary{background:#f0f5f7;color:#264958;border-color:#b9d2dc;font-size:17px}.actions{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-top:22px}.note{font-size:18px;color:#506677;text-align:center}.feedback{min-height:28px;text-align:center;color:#8b341f;font-size:18px;margin-top:10px}.source{background:#f3f7fa;border-radius:16px;padding:3px 14px}.wholecolour{color:#176e65}.partcolour{color:#7044a0}.explain{background:#f0f8f6;border-left:5px solid #278b7f;border-radius:10px;padding:12px 18px}.record{border-left:4px solid #bfd4df;padding-left:16px;margin:10px 0;color:#4d6472}.record .math{font-size:25px;margin:9px 0;justify-content:flex-start}.record .frac{min-width:28px}.choices{display:flex;flex-wrap:wrap;justify-content:center;gap:12px}.choices button{background:#f3f7fc;color:#183249;border-color:#a5bfce;min-width:140px}.choices .math{margin:0;font-size:23px}.bar{display:flex;width:240px;height:42px;border:2px solid #21475e;margin:7px auto}.cell{flex:1;border-right:1px solid #536a79;background:#fff}.cell:last-child{border:0}.cell.fill{background:#8d72bc}.cell.wh{background:#56a99b}.bars{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}.barunit{width:250px;text-align:center}.barunit small{font-size:16px}.reviewrow{display:flex;align-items:center;gap:16px;padding:12px;border-bottom:1px solid #dbe6ec;flex-wrap:wrap}.reviewrow b{font-size:19px;flex:1;min-width:180px}.reviewrow .math{margin:0;font-size:28px}.badge{background:#e4f4ed;color:#1c6951;padding:8px 13px;border-radius:30px;font-size:17px;white-space:nowrap}footer{text-align:center;font-size:15px;color:#52677a;padding:0 12px 20px}[hidden]{display:none!important}@media(max-width:600px){header{padding:14px;align-items:flex-start}header strong{font-size:17px}.badge{font-size:14px}main{margin:6px 10px;padding:22px 16px;border-radius:18px}h1{font-size:25px}.math{font-size:29px;gap:9px}.frac input,.whole input{width:58px}.reviewrow{padding:10px 0}.bar{width:220px}.barunit{width:230px}.choices button{min-width:110px;padding:9px}.record{padding-left:10px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
.source .math{margin:10px 0;font-size:30px}.reviewrow{padding:8px 12px}.reviewrow .math{font-size:26px}.reviewrow .frac>span{padding:2px 6px}
.splitwhole{width:240px;height:64px;padding:0;border:2px solid #1b655d;border-radius:3px;background:#77b9ae;display:flex;position:relative;color:#173c35;overflow:hidden}.splitwhole:disabled{opacity:1;cursor:default}.piece{flex:1;position:relative;display:flex;align-items:center;justify-content:center;font-size:22px}.piece+.piece:before{content:'';position:absolute;left:0;top:0;height:100%;width:3px;background:#fff;transform:scaleY(0);transform-origin:top}.cut .piece+.piece:before{transform:scaleY(1);transition:transform 850ms ease}.piece span{opacity:0}.cut .piece span{opacity:1;transition:opacity 400ms 850ms}.splitrow{display:flex;justify-content:center;flex-wrap:wrap;gap:18px;margin:20px 0}.splitunit{text-align:center}.splitunit small{display:block;margin-bottom:8px}.meaning{display:flex;align-items:center;justify-content:center;gap:18px}.meaning p{font-size:18px}.guidedfraction{display:flex;flex-direction:column;align-items:center;gap:9px}.guidedfraction small{font-size:17px}.countmath{margin:12px 0}@media(prefers-reduced-motion:reduce){.cut .piece+.piece:before,.cut .piece span{transition:none}}
.piece .frac{font-size:18px;min-width:24px}.piece .frac>span{padding:2px 5px}.meaning .math{margin:8px 0}main:has(.splitrow) .math{margin:12px 0}main:has(.splitrow) .actions{margin-top:10px}main:has(.splitrow) .feedback:empty{min-height:8px}
</style></head><body><header><div><strong>Mixed numbers → improper fractions</strong><small id="progress"></small></div><button class="secondary" id="read" aria-label="Read this screen aloud">Read aloud</button></header><main id="app"></main><footer>Take your time. You can work on paper.</footer>
<script>
'use strict';
const $=s=>document.querySelector(s), app=$('#app');
const gcd=(a,b)=>b?gcd(b,a%b):a;
const pool=[];for(let w=1;w<=4;w++)for(let d=2;d<=12;d++)for(let n=1;n<d;n++){const g=gcd(n,d);if(d/g<=6)pool.push({w,n,d,g,sn:n/g,sd:d/g,id:`${w}-${n}-${d}`});}
let splitSet=new Set(),splitBusy=false,splitToken=0,splitPhase='cut',splitReturn='guide';
let used=new Set(), q,original,stage='test',step=0,streak=0,reviewQ,recallQ,recStep=0,chosen=null,records=[],demoReturn='guide',demoStep=0,successNext='',lastId='',speech;
const f=(n,d)=>`<span class="frac"><span>${n}</span><span>${d}</span></span>`;
const m=x=>`<span class="mixed"><span>${x.w}</span>${f(x.n,x.d)}</span>`;
const simple=x=>m({w:x.w,n:x.sn,d:x.sd});
const input=(id,label)=>`<input id="${id}" aria-label="${label}" inputmode="numeric" autocomplete="off" maxlength="4">`;
const fi=(prefix,label)=>`<span class="frac input"><span>${input(prefix+'n',label+' numerator')}</span><span>${input(prefix+'d',label+' denominator')}</span></span>`;
const mi=()=>`<span class="mixed"><span class="whole">${input('w','Whole number')}</span>${fi('s','Fractional part')}</span>`;
const btn=(text,action,cls='')=>`<button class="${cls}" data-action="${action}">${text}</button>`;
function pick(type){let a=pool.filter(x=>!used.has(x.id)&&x.id!==lastId&&(type==='simple'?x.g===1:type==='reduce'?x.g>1:true));if(!a.length)a=pool.filter(x=>x.id!==lastId);let x=a[Math.floor(Math.random()*a.length)];used.add(x.id);lastId=x.id;return {...x};}
function nextQuestion(){q=pick(streak===1?'simple':'reduce');stage='test';render();}
function frame(tag,title,body,actions=''){if(window.speechSynthesis) speechSynthesis.cancel();app.innerHTML=`<div class="eyebrow">${tag}</div><h1>${title}</h1>${body}<div class="feedback" id="feedback" role="status" aria-live="polite"></div><div class="actions">${actions}</div>`;$('#progress').textContent=`Fresh answers in a row: ${streak} of 3`;}
function bar(d,n,colour='fill'){return `<div class="bar" role="img" aria-label="${n} of ${d} equal parts shaded">${Array.from({length:d},(_,i)=>`<span class="cell ${i<n?colour:''}"></span>`).join('')}</div>`;}
function values(ids){const out=[];for(const id of ids){const e=$('#'+id),s=e.value.trim();if(!/^\d+$/.test(s)){feedback('Fill each yellow box with a whole number.',e);return null;}out.push(Number(s));}if(ids.some((id,i)=>id.endsWith('d')&&out[i]===0)){feedback('A denominator must be greater than 0.');return null;}return out;}
function feedback(t,e){$('#feedback').textContent=t;if(e)e.focus();}
function expected(x,k){if(k===0)return [x.w,x.sn,x.sd];if(k===1)return [x.w*x.sd,x.sd,x.sn,x.sd];return [x.w*x.sd+x.sn,x.sd];}
function ids(k){return k===0?['w','sn','sd']:k===1?['an','ad','bn','bd']:['zn','zd'];}
function form(k){return k===0?mi():k===1?`${fi('a','First fraction')}<span>+</span>${fi('b','Second fraction')}`:fi('z','Answer');}
function work(x,k){return k===0?simple(x):k===1?`${f(x.w*x.sd,x.sd)} + ${f(x.sn,x.sd)}`:f(x.w*x.sd+x.sn,x.sd);}
function recordView(){return records.length?`<div class="record" aria-label="Your completed working">${records.map(s=>`<div class="math">= ${s}</div>`).join('')}</div>`:'';}
function source(x){return `<div class="source"><div class="math">${m(x)}</div></div>`;}
function render(){
 if(stage==='test'||stage==='original'){frame(stage==='test'?'YOUR TURN':'TRY THE ORIGINAL QUESTION','Write an improper fraction in its simplest form.',`<div class="math">${m(q)}<span>=</span>${fi('z','Answer')}</div>`,btn('Check','check'));return;}
 if(stage==='split'){renderSplit();return;}
 if(stage==='guide'){const x=original;let title=['Simplify only the fractional part.',`Write ${x.w} whole${x.w===1?'':'s'} as a fraction.`,'Add the fractional parts.'][step];let body=step===0?`<div class="math">${m(x)} = ${mi()}</div><p class="note">Keep the whole number unchanged.</p>`:step===1?`<p class="note">Use ${partName(x.sd)}. Fill the two yellow boxes.</p><div class="math"><span class="guidedfraction"><small>Whole-number part</small><span>${x.w}</span></span> = ${fi('a','Wholes as a fraction')}</div><div class="math"><span class="guidedfraction"><small>Keep this extra fraction unchanged</small>${f(x.sn,x.sd)}</span></div>`:`<div class="math">${f(x.w*x.sd,x.sd)} + ${f(x.sn,x.sd)} = ${form(2)}</div>`;frame('LET’S WORK IT OUT',title,body,btn('Check','check'));return;}
 if(stage==='demo'){renderDemo();return;}
 if(stage==='review'||stage==='remember'){let x=stage==='review'?original:recallQ;frame(stage==='review'?'PUT THE METHOD TOGETHER':'YOUR COMPLETED METHOD',stage==='review'?'Three connected steps':'Remember the method',`${source(x)}<div class="reviewrow"><b>1. Simplify the fractional part.</b><div class="math">${simple(x)}</div></div><div class="reviewrow"><b>2. Change the wholes into parts.</b><div class="math">${work(x,1)}</div></div><div class="reviewrow"><b>3. Add. Keep the denominator.</b><div class="math">${work(x,2)}</div></div><p class="note">Simplify first. Multiply the whole number by the new denominator. Add the extra parts.</p>`,btn(stage==='review'?'Hide this · My turn':'Try the original question',stage==='review'?'recall':'original'));return;}
 if(stage==='recall'){let body=source(recallQ)+recordView();if(chosen===null){body+=`<h2>Choose how to write your next line.</h2><div class="choices">${[2,0,1].map(k=>`<button data-layout="${k}" aria-label="${['Mixed number layout','Two fractions added layout','One fraction layout'][k]}"><span class="math">${k===0?`<span class="mixed">□ ${f('□','□')}</span>`:k===1?`${f('□','□')} + ${f('□','□')}`:f('□','□')}</span></button>`).join('')}</div>`;frame('USE THE METHOD FROM MEMORY','Show your working.',body);}
 else frame('USE THE METHOD FROM MEMORY','Write your next line.',body+`<div class="math">= ${form(chosen)}</div>`,btn('Check line','check')+btn('Choose a different form','layout','secondary'));return;}
 if(stage==='success'){frame('✓ CORRECT','You have it.',`<div class="math">${m(q)} = ${f(q.w*q.sd+q.sn,q.sd)}</div><p class="note">${successNext==='complete'?'Three fresh answers correct in a row.':successNext==='fresh'?'Now use the method on a fresh question.':'Ready for another question?'}</p>`,btn(successNext==='complete'?'Finish':'Next question','next'));return;}
 if(stage==='complete'){frame('PRACTICE COMPLETE','You used the method independently.',`<p>You answered three fresh questions correctly in a row.</p><p class="note">Next time you meet a mixed number on paper, write the method yourself.</p>`,btn('Practise again','restart'));}
}

function partName(d){return ({2:'halves',3:'thirds',4:'quarters',5:'fifths',6:'sixths'})[d]||'equal parts';}
function startSplit(where){splitToken++;splitSet=new Set();splitBusy=false;splitPhase='cut';splitReturn=where;stage='split';render();}
function splitX(){return splitReturn==='recall'?recallQ:original;}
function renderSplit(){const x=splitX(),all=splitSet.size===x.w;let title=splitPhase==='meaning'?`${x.w} wholes make ${x.w*x.sd} ${partName(x.sd)}.`:all?`How many ${partName(x.sd)} altogether?`:`Tap each whole to split it into ${x.sd} equal parts.`;
let body=`<p class="note">${x.sd} equal parts in each whole means ${partName(x.sd)}.</p><div class="splitrow">${Array.from({length:x.w},(_,i)=>`<div class="splitunit"><small>Whole ${i+1}</small><button class="splitwhole ${splitSet.has(i)?'cut':''}" data-whole="${i}" aria-label="Split whole ${i+1} into ${x.sd} equal parts" ${splitSet.has(i)?'disabled':''}>${Array.from({length:x.sd},()=>`<span class="piece">${f(1,x.sd)}</span>`).join('')}</button></div>`).join('')}</div>`;
if(splitPhase==='meaning')body+=`<div class="meaning"><div class="math">${x.w} = ${f(x.w*x.sd,x.sd)}</div><div><p><b>${x.w*x.sd}</b> ${partName(x.sd)} altogether</p><p><b>${x.sd}</b> equal parts in each whole</p></div></div><div class="math">${simple(x)} = <span class="wholecolour">${f(x.w*x.sd,x.sd)}</span> + <span class="partcolour">${f(x.sn,x.sd)}</span></div><p class="note">The extra fraction stays the same.</p>`;
else if(all)body+=`<div class="math countmath">${x.w} × ${x.sd} = ${input('count','Total number of fractional parts')}</div>`;
else body+='<p class="note">Each green bar is one whole.</p>';
frame('SEE WHY',title,(splitReturn==='recall'?recordView():'')+body,splitPhase==='meaning'?btn('Hide model · My turn','split-hide')+btn('Replay splitting','split-replay','secondary'):all?btn('Check','check'):'');}
function cutWhole(i){if(stage!=='split'||splitBusy||splitSet.has(i))return;splitBusy=true;const token=splitToken;const b=app.querySelector(`[data-whole="${i}"]`);b.classList.add('cut');app.querySelectorAll('[data-whole]').forEach(e=>e.disabled=true);app.querySelector('h1').textContent=`Splitting whole ${i+1} into ${splitX().sd} equal parts…`;setTimeout(()=>{if(stage!=='split'||token!==splitToken)return;splitSet.add(i);splitBusy=false;render();},matchMedia('(prefers-reduced-motion: reduce)').matches?20:1300);}
function checkSplit(){const v=values(['count']);if(!v)return;const x=splitX();if(v[0]!==x.w*x.sd){feedback(`${x.w} groups of ${x.sd}: ${Array(x.w).fill(x.sd).join(' + ')} = ${x.w*x.sd}. Count the parts in the bars, then enter the total.`);return;}splitPhase='meaning';render();}

function renderDemo(){let x=demoReturn==='recall'?recallQ:original,k=demoStep,body='',title='';
 if(k===0){title=x.g===1?'This fraction is already simplest.':'Divide both numbers by the same number.';body=`<div class="math">${m(x)} = ${simple(x)}</div>`;if(x.g>1)body+=`<div class="explain"><div class="math">${x.n} ÷ ${x.g} = ${x.sn}<span>;</span>${x.d} ÷ ${x.g} = ${x.sd}</div><div class="bars"><div class="barunit">${bar(x.d,x.n)}<small>${x.n} shaded parts out of ${x.d}</small></div><div class="barunit">${bar(x.sd,x.sn)}<small>${x.sn} shaded parts out of ${x.sd}</small></div></div><p class="note">The shaded amount stays the same. The ${x.w} whole${x.w===1?'':'s'} stay${x.w===1?'s':''} unchanged.</p></div>`;else body+=`<p class="note">Only 1 divides both ${x.n} and ${x.d}. Keep the fraction as it is.</p>`;}
 if(k===1){title=`Each whole has ${x.sd} equal parts.`;body=`<div class="bars">${Array.from({length:x.w},()=>`<div class="barunit">${bar(x.sd,x.sd,'wh')}<small>1 whole = ${x.sd} parts</small></div>`).join('')}</div><div class="math"><span class="wholecolour">${x.w} × ${x.sd} = ${x.w*x.sd}</span></div><div class="math">${simple(x)} = <span class="wholecolour">${f(x.w*x.sd,x.sd)}</span> + <span class="partcolour">${f(x.sn,x.sd)}</span></div><p class="note">Keep the extra fraction. All the parts have the same size.</p>`;}
 if(k===2){title='Add the counts. Keep the part size.';body=`<div class="math"><span class="wholecolour">${f(x.w*x.sd,x.sd)}</span> + <span class="partcolour">${f(x.sn,x.sd)}</span> = ${f(x.w*x.sd+x.sn,x.sd)}</div><div class="explain"><p>${x.w*x.sd} parts + ${x.sn} parts = ${x.w*x.sd+x.sn} parts.</p><p>There are still ${x.sd} equal parts in each whole.</p></div>`;}
 const prior=demoReturn==='recall'?source(x)+recordView():'';frame('LOOK, THEN TRY',title,prior+body,btn('Hide answer · My turn','hide'));}
function showDemo(k,where){if(k===1){startSplit(where);return;}demoStep=k;demoReturn=where;stage='demo';render();}
function check(){if(stage==='split'){checkSplit();return;}if(stage==='test'||stage==='original'){let v=values(['zn','zd']);if(!v)return;const ok=v[0]===q.w*q.sd+q.sn&&v[1]===q.sd;if(ok){let retry=stage==='original';if(!retry)streak++;successNext=retry?'fresh':streak>=3?'complete':'next';stage='success';render();}else{streak=0;original={...q};step=0;stage='guide';render();}return;}
 if(stage==='guide'||stage==='recall'){let recall=stage==='recall',k=recall?recStep:step;if(recall&&chosen===null)return;let v=values(!recall&&k===1?['an','ad']:ids(recall?chosen:k));if(!v)return;let x=recall?recallQ:original,e=(!recall&&k===1)?[x.w*x.sd,x.sd]:expected(x,k),ok=v.length===e.length&&v.every((n,i)=>n===e[i]);if(k===1&&v.length===4)ok=ok||(v[0]===x.sn&&v[1]===x.sd&&v[2]===x.w*x.sd&&v[3]===x.sd);if(!ok){showDemo(k,recall?'recall':'guide');return;}if(recall){records.push(work(x,k));recStep++;chosen=null;if(recStep===3)stage='remember';}else{step++;if(step===1){startSplit('guide');return;}if(step===3)stage='review';}render();}}
app.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.whole!==undefined){cutWhole(Number(b.dataset.whole));return;}if(b.dataset.layout!==undefined){let k=Number(b.dataset.layout);if(stage!=='recall')return;if(k!==recStep){showDemo(recStep,'recall');return;}chosen=k;render();return;}switch(b.dataset.action){case 'split-replay':startSplit(splitReturn);break;case 'split-hide':splitToken++;stage=splitReturn;if(stage==='guide')step=1;else chosen=null;render();break;case 'check':check();break;case 'hide':stage=demoReturn;if(stage==='guide')step=demoStep;else chosen=null;render();break;case 'recall':recallQ=pick('reduce');recStep=0;records=[];chosen=null;stage='recall';render();break;case 'layout':chosen=null;render();break;case 'original':q={...original};stage='original';render();break;case 'next':if(successNext==='complete'){stage='complete';render();}else nextQuestion();break;case 'restart':streak=0;used=new Set();nextQuestion();break;}});
app.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.tagName==='INPUT'){e.preventDefault();check();}});
$('#read').addEventListener('click',()=>{if(!('speechSynthesis'in window)){feedback('Read-aloud is unavailable here. All instructions are on screen.');return;}speechSynthesis.cancel();const spoken=app.cloneNode(true);spoken.querySelectorAll('.frac').forEach(el=>{const parts=Array.from(el.children).map(c=>c.querySelector('input')?(c.querySelector('input').value||'blank'):c.textContent);el.replaceWith(document.createTextNode(parts[0]+' over '+parts[1]));});spoken.querySelectorAll('.mixed').forEach(el=>{const a=el.firstElementChild;if(a)a.after(document.createTextNode(' and '));});spoken.querySelectorAll('input').forEach(el=>el.replaceWith(document.createTextNode(el.value||'blank')));speech=new SpeechSynthesisUtterance(spoken.textContent.replace(/□/g,'blank').replace(/×/g,' times ').replace(/÷/g,' divided by ').replace(/=/g,' equals '));speech.lang='en-GB';speech.rate=.85;speech.onerror=()=>feedback('Read-aloud is unavailable here. All instructions are on screen.');speechSynthesis.speak(speech);});
nextQuestion();
</script></body></html>
