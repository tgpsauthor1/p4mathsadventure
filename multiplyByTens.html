<!doctype html><html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Multiply by tens</title><style>
:root{font-family:Arial,sans-serif;color:#182d48;background:#eef3fc;font-size:20px}*{box-sizing:border-box}body{margin:0}header{max-width:850px;margin:auto;padding:22px 22px 12px;display:flex;justify-content:space-between;align-items:center;gap:12px}.brand{font-weight:800;color:#4053a5}.small{font-size:.8rem;color:#506179}main{max-width:810px;margin:10px auto 35px;background:white;border:2px solid #dce4f4;border-radius:24px;padding:28px;box-shadow:0 10px 30px #263a7510;min-height:490px}h1{font-size:1.65rem;margin:10px 0 20px}h2{font-size:1.16rem;margin:16px 0}p{line-height:1.45}button,input{font:inherit}button{border:2px solid #4c5cc1;border-radius:13px;background:#4c5cc1;color:white;padding:12px 22px;min-height:48px;cursor:pointer;font-weight:700}button:hover{filter:brightness(.95)}button:focus-visible,input:focus-visible{outline:4px solid #edae37;outline-offset:3px}.secondary{background:white;color:#3d4b9e;border-color:#c9d2ee;font-size:.84rem;padding:9px 15px}.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:24px}.equation{font-size:1.8rem;font-weight:700;display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:22px 0}.token{white-space:nowrap}.equation input{width:155px}input{border:2px solid #6878b2;border-radius:10px;padding:10px;min-height:54px;text-align:center;font-weight:bold;background:#fff;font-size:1.5rem;max-width:100%}.hint{background:#fff4d7;border-left:5px solid #e2a324;padding:16px;border-radius:8px;line-height:1.5}.record{background:#edf8f4;border:1px solid #b6ddce;border-radius:14px;padding:14px 18px;margin:14px 0}.record p{margin:7px 0}.outline{font-size:.86rem;color:#586780;margin:0 0 20px}.options{display:grid;gap:14px;margin:20px 0}.options button{background:#f3f5ff;color:#25365e;text-align:left;border-color:#bac6e8;line-height:1.5;font-size:1.15rem}.tag{display:inline-block;background:#e9e5ff;color:#504092;border-radius:20px;padding:6px 12px;font-size:.8rem;font-weight:bold}.feedback{min-height:28px;margin-top:16px;color:#9c3e17;font-weight:700}.success{color:#167050}.long{display:grid;grid-template-columns:50px 60px 60px 60px;grid-auto-rows:52px;justify-content:center;align-items:center;text-align:center;font-size:1.9rem;margin:16px 0}.long .line{border-top:3px solid #344967;padding-top:8px;align-self:stretch}.carry{font-size:1.1rem;color:#a14e13}.long input{width:56px;padding:5px;font-size:1.6rem}.long .wide{grid-column:2/4;justify-self:end;width:112px}.long .heading{font-size:.65rem;color:#627089}.long .focus{background:#fff0c9;border-radius:8px}.visual{width:100%;max-width:550px;display:block;margin:12px auto}.memory{background:#edeaff;border-left:5px solid #7f69d3;padding:15px;border-radius:8px;line-height:1.6}.dots{display:flex;gap:8px;align-items:center}.dot{width:15px;height:15px;border-radius:50%;border:2px solid #7385b8}.dot.on{background:#278577;border-color:#278577}.audioStatus{max-width:800px;margin:auto;padding:0 22px;font-size:.75rem}.checkline{margin:10px 0;font-size:1.2rem} [hidden]{display:none!important}@media(max-width:600px){:root{font-size:18px}header{padding:14px}main{margin:6px 10px 24px;padding:20px 16px;border-radius:18px}h1{font-size:1.45rem}.equation{font-size:1.55rem}.equation input{width:120px}.options button{font-size:1.05rem;padding:12px}.long{grid-template-columns:35px 56px 56px 56px}.tag{font-size:.72rem}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style></head><body><header><div class="brand">Multiply by tens<div class="small" id="progress"></div></div><button class="secondary" id="listen">Listen / stop</button></header><div class="audioStatus" role="status" id="audioStatus"></div><main id="app"></main><script>
'use strict';
const app=document.getElementById('app');let q,streak=0,used=new Set(),previous='',mode='test',stage='',record={},supported=false,notationOnly=false,questionCount=0,utterance;
const shuffle=a=>a.map(v=>[Math.random(),v]).sort((a,b)=>a[0]-b[0]).map(x=>x[1]);
const data=()=>({a:q.a,b:q.b,d:q.b>=10?q.b/10:q.b,p:q.a*(q.b>=10?q.b/10:q.b),ans:q.a*q.b,ones:q.a%10,tens:Math.floor(q.a/10)});
const fmt=n=>String(n);const token=s=>`<span class="token">${s}</span>`;
function stopAudio(){if(window.speechSynthesis)window.speechSynthesis.cancel();utterance=null}
function page(label,title,body){stopAudio();app.innerHTML=`<span class="tag">${label}</span><h1>${title}</h1>${body}<div id="feedback" class="feedback" role="status" aria-live="polite"></div>`;document.getElementById('progress').innerHTML=`${streak} of 3 fresh questions correct in a row`;window.scrollTo(0,0)}
function btn(text,fn,secondary=false){const b=document.createElement('button');b.textContent=text;if(secondary)b.className='secondary';b.onclick=fn;let a=app.querySelector('.actions');if(!a){a=document.createElement('div');a.className='actions';app.insertBefore(a,document.getElementById('feedback'))}a.appendChild(b);return b}
function feedback(s){document.getElementById('feedback').textContent=s}
function number(raw){raw=raw.trim();if(!/^(\d+|\d{1,3}(?:,\d{3})+|\d{1,3}(?: \d{3})+)$/.test(raw))return null;const n=Number(raw.replace(/[ ,]/g,''));return Number.isSafeInteger(n)?n:null}
function inputUI(html,submit){let container=document.createElement('form');container.innerHTML=html;app.insertBefore(container,document.getElementById('feedback'));const check=document.createElement('button');check.type='submit';check.textContent='Check';container.appendChild(check);container.onsubmit=e=>{e.preventDefault();const v=number(container.querySelector('input').value);if(v===null){feedback('Write a number first. You can use 24000 or 24,000.');return}submit(v)};}
function field(label){return `<input id="answer" aria-label="${label}" inputmode="numeric" autocomplete="off">`}
function choices(items,fn){const div=document.createElement('div');div.className='options';shuffle(items).forEach(([id,text])=>{const b=document.createElement('button');b.innerHTML=text;b.dataset.choice=id;b.onclick=()=>fn(id);div.appendChild(b)});app.insertBefore(div,document.getElementById('feedback'))}
function nextQuestion(){const contrast=questionCount%3===2;let pool=[];for(let a=23;a<=79;a++)for(let d=3;d<=9;d++){if((a%10)*d<10||a%10===0)continue;const b=contrast?d:d*10,id=`${a}x${b}`;if(!used.has(id)&&id!==previous)pool.push({a,b,id})}if(!pool.length){used.clear();return nextQuestion()}q=pool[Math.floor(Math.random()*pool.length)];used.add(q.id);previous=q.id;questionCount++;supported=false;mode='test';test()}
function test(){stage='test';const {a,b}=data();page(mode==='retry'?'Your turn again':'Try it yourself',`What is ${a} × ${b}?`,`<p>Use long multiplication on paper.</p>`);inputUI(`<label class="equation">${token(`${a} × ${b} =`)}${field('Answer')}</label>`,v=>{if(v===a*b){notation(false)}else{streak=0;supported=true;notationOnly=false;if(v===data().p&&b>=10)teachTen(()=>connect());else diagnose()}});btn('Help me',()=>{streak=0;supported=true;notationOnly=false;diagnose()},true)}
function diagnose(){stage='diagnose';const {a,d}=data();page('Find the tricky part',`First, ${a} × ${d}`,`<p>Use long multiplication on paper.</p>`);inputUI(`<label class="equation">${token(`${a} × ${d} =`)}${field('First product')}</label>`,v=>{if(v===data().p){if(q.b>=10)teachTen(()=>connect());else connect()}else teachAlgorithm(0)})}
function longHTML(vals={},active=''){const {a,d}=data();const cell=(key,label)=>active===key?`<input id="answer" inputmode="numeric" aria-label="${label}" autocomplete="off">`:(vals[key]??'');return `<div class="long" aria-label="Long multiplication"><span></span><span class="heading">hundreds</span><span class="heading">tens</span><span class="heading">ones</span><span></span><span></span><span class="carry">${cell('carry','Carried tens')}</span><span></span><span></span><span></span><span>${Math.floor(a/10)}</span><span>${a%10}</span><span>×</span><span></span><span></span><span>${d}</span><span class="line"></span><span class="line ${active==='left'?'wide':''}">${active==='left'?`<input id="answer" style="width:108px" inputmode="numeric" aria-label="Remaining answer digits">`:(vals.left!==undefined?String(vals.left).padStart(2,' ').slice(0,-1).trim():'')}</span>${active==='left'?'':`<span class="line">${vals.left!==undefined?String(vals.left).slice(-1):''}</span>`}<span class="line">${cell('unit','Ones digit of answer')}</span></div>`}
function teachAlgorithm(i){stage='teach-algorithm';const {a,d,ones,tens,p}=data(),u=ones*d,c=Math.floor(u/10),t=tens*d+c;const steps=[{title:`${d} × ${ones} ones = ${u} ones`,body:`<div class="hint">${u} ones = ${c} tens and ${u%10} ones.<br>Write ${u%10} in the ones column. Carry ${c} tens.</div>${longHTML({unit:u%10,carry:c})}`,prompt:`${d} × ${ones} =`,ans:u},{title:'Multiply the tens. Add the carried tens.',body:`<div class="hint">${d} × ${tens} tens = ${d*tens} tens<br>${d*tens} tens + ${c} tens = ${t} tens</div>${longHTML({unit:u%10,carry:c,left:t})}`,prompt:`${d*tens} tens + ${c} tens =`,ans:t}];const s=steps[i];page('Watch this part',s.title,s.body);btn('Hide it. My turn.',()=>{page('Your turn',i===0?'Multiply the ones.':'Include the carried tens.','');inputUI(`<label class="equation">${token(s.prompt)}${field(i===0?'Product':'Number of tens')}${i===1?'tens':''}</label>`,v=>{if(v!==s.ans)return teachAlgorithm(i);if(i===0)teachAlgorithm(1);else if(q.b>=10)teachTen(()=>connect());else connect()})})}
function placeVisual(p){const digits=String(p).padStart(4,' ').split('');const names=['thousands','hundreds','tens','ones'];let svg=`<svg class="visual" viewBox="0 0 540 215" role="img" aria-label="Each digit moves one place to the left when multiplied by ten"><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="none" stroke="#576b94"/></marker></defs>`;names.forEach((n,i)=>{svg+=`<rect x="${10+i*130}" y="10" width="130" height="195" fill="${i%2?'#f4f2ff':'#eaf7f4'}"/><text x="${75+i*130}" y="32" text-anchor="middle" font-size="16" fill="#33465c">${n}</text>`});digits.forEach((d,i)=>{if(d===' ')return;svg+=`<text x="${75+i*130}" y="78" text-anchor="middle" font-size="32" font-weight="bold" fill="#344b95">${d}</text><path d="M${70+i*130},88 L${85+(i-1)*130},151" stroke="#576b94" stroke-width="2" marker-end="url(#arrow)"/><text x="${75+(i-1)*130}" y="185" text-anchor="middle" font-size="32" font-weight="bold" fill="#344b95">${d}</text>`});return svg+`<text x="465" y="185" text-anchor="middle" font-size="32" font-weight="bold" fill="#ad5812">0</text></svg>`}
function teachTen(done){stage='teach-ten';const {a,b,d,p,ans}=data();page('Finish the multiplication',`${b} = ${d} × 10`,`<div class="record">${a} × ${d} = ${p}</div><p>Now make ${p} ten times as large.</p>${placeVisual(p)}<p class="hint">Each digit moves one place left.<br>0 holds the ones place: <strong>${p} × 10 = ${ans}</strong>.</p>`);btn('Hide it. My turn.',()=>{page('Your turn',`Finish ${a} × ${b}`,`<div class="record">${a} × ${d} = ${p}</div>`);choices([['ten','Multiply by 10'],['add','Add 10'],['stop',`Stop at ${p}`]],id=>{if(id!=='ten')return teachTen(done);page('Your turn','Multiply the answer by 10.','');inputUI(`<label class="equation">${token(`${p} × 10 =`)}${field('Final product')}</label>`,v=>v===ans?done():teachTen(done))})})}
function notation(isRehearsal){stage=isRehearsal?'recall-notation':'notation';const {a,b,d,p,ans}=data();if(!isRehearsal)page(mode==='retry'?'Your turn again':'Check the equals signs','Which working is correct?',`<div class="record">Your answer: ${a} × ${b} = ${ans}</div>`);else{rehearsalShell('Which working is correct?')}
const good=b>=10?`${a} × ${d} = ${p}<br>${p} × 10 = ${ans}`:`${a} × ${b} = ${ans}`;const bad=b>=10?`${a} × ${b} = ${a} × ${d}<br>= ${p} = ${ans}`:`${a} × ${b} = ${ans} × 10<br>= ${ans*10}`;
choices([['good',good],['bad',bad]],id=>{if(id==='good'){if(isRehearsal){record.notation=true;remember()}else finishQuestion()}else{streak=0;supported=true;if(isRehearsal)localRepair('= means “the same value as”.',`<p>${p} and ${b>=10?ans:ans*10} are different amounts.</p><div class="record">${good}</div>`,()=>notation(true));else{notationOnly=true;teachNotation(()=>connect())}}})}
function teachNotation(done){const {a,b,d,p,ans}=data();page('Equals means the same value','= does not mean “next”.',`<div class="hint">${b>=10?`${p} ≠ ${ans}`:`${ans} ≠ ${ans*10}`}<br>These amounts are different.</div><p>Write each calculation on a new line.</p><div class="record">${a} × ${d} = ${p}${b>=10?`<br>${p} × 10 = ${ans}`:''}</div>`);btn('Hide it. My turn.',()=>{page('Your turn','Which working is correct?','');choices([['good',`${a} × ${d} = ${p}${b>=10?`<br>${p} × 10 = ${ans}`:''}`],['bad',`${a} × ${b} = ${a} × ${d} = ${p}${b>=10?` = ${ans}`:` = ${ans*10}`}`]],id=>id==='good'?done():teachNotation(done))})}
function memory(){const {b,d}=data();return b>=10?`Multiply the ones, then the tens. Add the carried tens.<br>Multiply that answer by 10.<br>Finish with the answer to ×${b}.<br>Use = only for equal amounts.`:`Multiply the ones, then the tens. Add the carried tens.<br>Answer the original question.<br>No extra ×10.<br>Use = only for equal amounts.`}
function connect(){stage='connect';const {a,b,d,p,ans}=data();page('Put it all together',`${a} × ${b}`,`<div class="record"><p><strong>1. Plan</strong> &nbsp; ${b>=10?`${b} = ${d} × 10`:`Multiply by ${d}`}</p><p><strong>2. Multiply</strong> &nbsp; ${a} × ${d} = ${p}</p><p><strong>3. Finish</strong> &nbsp; ${b>=10?`${p} × 10 = ${ans}`:`${a} × ${b} = ${ans}`}</p></div><div class="memory">${memory()}</div><p>Next, the working will be hidden.<br>You will write all the steps.</p>`);btn('Hide it. Practise all steps.',()=>{record={};stage='recall-plan';rehearsal()})}
function earned(){const {a,b,d,p,ans}=data();let h='';if(record.first!==undefined)h+=`<p>First: ${a} × ${record.first}</p>`;if(record.unit!==undefined||record.carry!==undefined||record.left!==undefined)h+=longHTML(record);if(record.op!==undefined)h+=`<p>Next: ${record.op==='ten'?'×10':'finish'}</p>`;if(record.final!==undefined)h+=`<p>${a} × ${b} = ${record.final}</p>`;return h?`<div class="record">${h}</div>`:''}
function rehearsalShell(prompt){const {a,b}=data();page('Practise all steps',`${a} × ${b}`,`<p class="outline">Plan · Multiply · Finish</p>${earned()}<h2>${prompt}</h2>`)}
function localRepair(title,html,retry){const box=document.createElement('div');box.className='hint';box.innerHTML=`<strong>${title}</strong>${html}`;app.querySelectorAll('form,.options').forEach(el=>el.hidden=true);app.insertBefore(box,document.getElementById('feedback'));btn('Hide it. Try this part.',retry)}
function rehearsal(){const {a,b,d,p,ans,ones,tens}=data(),u=ones*d,c=Math.floor(u/10),left=tens*d+c;
if(stage==='recall-plan'){rehearsalShell('Which number will you multiply by first?');inputUI(`<label class="equation">${token(`${a} ×`)}${field('First multiplier')}</label>`,v=>{if(v!==d)return localRepair(`${b>=10?`${b} = ${d} × 10`:`The question asks for ×${d}`}`,`<p>First, calculate ${a} × ${d}.</p>`,rehearsal);record.first=v;stage='recall-unit';rehearsal()})}
else if(['recall-unit','recall-carry','recall-left'].includes(stage)){const key=stage.slice(7),expected=key==='unit'?u%10:key==='carry'?c:left,prompt=key==='unit'?`Multiply ${ones} ones by ${d}. Write the ones digit below.`:key==='carry'?'Write the number of tens to carry.':`Multiply ${tens} tens by ${d}. Add the ${c} carried tens.`;rehearsalShell(prompt);const old=app.querySelector('.record .long');if(old)old.remove();inputUI(longHTML(record,key),v=>{if(v!==expected)return localRepair(key==='left'?`${d} × ${tens} tens + ${c} tens = ${left} tens`:`${d} × ${ones} ones = ${u} ones`,key==='left'?`<p>Write ${left} to the left of ${u%10}.</p>`:`<p>${u} ones = ${c} tens and ${u%10} ones.</p><p>${key==='unit'?`Write ${u%10} in the ones column.`:`Carry ${c} tens.`}</p>`,rehearsal);record[key]=v;stage=key==='unit'?'recall-carry':key==='carry'?'recall-left':'recall-next';rehearsal()})}
else if(stage==='recall-next'){rehearsalShell(`You have ${p}. What next?`);choices([['ten','Multiply by 10'],['stop','The calculation is finished'],['add','Add 10']],id=>{const correct=b>=10?'ten':'stop';if(id!==correct)return localRepair(b>=10?`${b} = ${d} × 10`:`The question is ${a} × ${b}.`,b>=10?`<p>You have multiplied by ${d}. You still need to multiply by 10.</p>`:`<p>${p} already answers the question. Stop here.</p>`,rehearsal);record.op=id;stage='recall-final';rehearsal()})}
else if(stage==='recall-final'){rehearsalShell('Write the answer to the original question.');inputUI(`<label class="equation">${token(`${a} × ${b} =`)}${field('Final answer')}</label>`,v=>{if(v!==ans)return localRepair('Finish the original question.',b>=10?`${placeVisual(p)}<p>${p} × 10 = ${ans}</p>`:`<p>${a} × ${b} = ${ans}</p>`,rehearsal);record.final=v;notation(true)})}}
function remember(){stage='remember';rehearsalShell('You put the steps together.');let m=document.createElement('div');m.className='memory';m.innerHTML=memory();app.insertBefore(m,document.getElementById('feedback'));btn('Hide my working. Try alone.',()=>{record={};mode='retry';supported=true;test()})}
function finishQuestion(){stage='success';if(!supported&&mode==='test')streak++;if(streak===3){stage='complete';page('Practice complete','Three fresh questions solved!',`<p>You calculated independently and checked the equals signs.</p><div class="memory">On paper: try <strong>46 × 60</strong> without this page.<br>Tomorrow, try <strong>57 × 40</strong> from memory.</div>`);btn('Practise again',()=>{streak=0;questionCount=0;nextQuestion()});return}page('Correct',supported?'Now try a fresh question.':'Your calculation and equals signs are correct.',`<p>${supported?'This was practice with help. The next question is a fresh start.':`${streak} of 3 fresh questions correct in a row.`}</p>`);btn('Next question',nextQuestion)}
document.getElementById('listen').onclick=()=>{const status=document.getElementById('audioStatus');if(!window.speechSynthesis){status.textContent='Reading aloud is unavailable. All instructions are on the page.';return}if(speechSynthesis.speaking){stopAudio();return}const voices=speechSynthesis.getVoices();if(!voices.length){status.textContent='No reading voice is ready on this device. Try Listen again, or read the page.';return}utterance=new SpeechSynthesisUtterance(app.innerText.replace(/×/g,' times ').replace(/≠/g,' is not equal to ').replace(/=/g,' equals '));utterance.lang='en-GB';utterance.rate=.88;utterance.voice=voices.find(v=>v.lang==='en-GB')||voices.find(v=>v.lang.startsWith('en'))||voices[0];utterance.onerror=()=>{status.textContent='Reading aloud did not work. All instructions remain on the page.'};status.textContent='';speechSynthesis.speak(utterance)};
nextQuestion();
</script></body></html>
