<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mixed numbers on a number line</title><style>
*{box-sizing:border-box}body{margin:0;background:#eef4fa;color:#20334b;font:20px Arial,sans-serif}main{max-width:960px;margin:20px auto;padding:24px;background:white;border-radius:24px;box-shadow:0 8px 35px #2342}header,footer,.actions{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}header{border-bottom:2px solid #e8edf5;padding-bottom:14px}h1{font-size:23px;margin:0}h2{font-size:27px;line-height:1.3;margin:20px 0 12px}button{font:inherit;background:#244f91;color:white;border:2px solid #244f91;border-radius:12px;padding:12px 20px;min-height:48px;cursor:pointer}button.secondary{background:white;color:#244f91}button:focus-visible,input:focus-visible{outline:4px solid #efad26;outline-offset:3px}.small{font-size:16px}#progress{font-size:16px}.diagram{margin:8px 0}.diagram svg{width:100%;height:auto;display:block}.mixed{display:inline-flex;align-items:center;gap:12px;white-space:nowrap}.fraction{display:flex;flex-direction:column;align-items:center;gap:6px}.bar{height:3px;background:#23334b;width:80px}.answer{display:flex;justify-content:center;align-items:center;gap:18px;margin:16px 0}input{width:80px;height:58px;border:3px solid #b87908;background:#fff3ce;border-radius:10px;text-align:center;font:700 30px Arial;color:#20334b}input:disabled{border:1px solid #c5cfdb;background:#edf1f6;color:#20334b}.value{width:80px;text-align:center;font-size:30px;font-weight:bold}.note{padding:16px;background:#eaf2ff;border-radius:14px;line-height:1.5;margin:12px 0}.actions{justify-content:center}#feedback{font-weight:bold;min-height:30px;margin:12px 0;text-align:center}footer{margin-top:18px;color:#51637b}.steps{display:flex;gap:8px;flex-wrap:wrap;font-size:17px}.steps span{padding:8px 12px;background:#edf2f8;border-radius:10px}.steps .current{border:2px solid #244f91}.gaprow{display:flex;margin:0 7.32%;gap:0}.gaprow button{padding:0;border-radius:8px;background:#fff7df;border:2px dashed #98701e;color:#244f91;flex:1;min-width:0;font-size:23px}.gaprow button[aria-pressed=true]{background:#dcecfb;border:3px solid #245291}.gaplabel{text-align:center;font-size:16px;margin-top:8px}.memory{line-height:1.6}.worked{display:flex;justify-content:center;gap:18px;flex-wrap:wrap}.worked span{background:#edf4fc;padding:10px;border-radius:10px} @media(max-width:600px){main{margin:8px;padding:16px}h2{font-size:23px}header{gap:8px}h1{font-size:21px}.diagram{overflow:auto}.diagram svg{min-width:450px}.gaprow{min-width:384px;margin-left:33px;margin-right:33px}.linewrap{overflow:auto}.bar,input,.value{width:68px}.small{font-size:15px}}
</style><main><header><h1>Mixed numbers · Number lines</h1><span id="progress"></span><button id="read" class="secondary small">Read aloud</button></header><section id="screen"></section><div id="feedback" role="status" aria-live="polite"></div><footer><span class="small">Take your time. You can use paper.</span><button id="restart" class="secondary small">Start again</button></footer></main><script>
'use strict';
const $=id=>document.getElementById(id),order=['w','d','n'],labels={w:'Whole number',d:'Denominator',n:'Numerator'};
let originalQ,recall=false,choose=false,wholeSelected=false,orderError=false;
let q,phase,streak=0,used=new Set(),last='',queue=[],part,earned={},stage=0,selected=new Set(),local=false,marking=true,utterance;
function newQ(){let a;do{let d=[3,4,5,6,8][Math.floor(Math.random()*5)];a={w:1+Math.floor(Math.random()*5),d,n:1+Math.floor(Math.random()*(d-1))};a.key=[a.w,a.d,a.n].join('-')}while(used.has(a.key)||a.key===last);used.add(a.key);last=a.key;return a}
function frac(v={},active=[],fixed=false){let f=k=>fixed?`<span class="value">${v[k]??''}</span>`:`<input id="${k}" aria-label="${labels[k]}" inputmode="numeric" autocomplete="off" maxlength="3" value="${v[k]??''}" ${active.includes(k)?'':'disabled'}>`;return `<span class="mixed">${f('w')}<span class="fraction">${f('n')}<span class="bar"></span>${f('d')}</span></span>`}
function diagram(mode='',interactive=false){let x=i=>60+i*700/q.d,paths='',ticks='';for(let i=0;i<=q.d;i++)ticks+=`<line x1="${x(i)}" x2="${x(i)}" y1="${i===0||i===q.d?90:100}" y2="130" stroke="#20334b" stroke-width="3"/>`;
let count=mode==='d'?q.d:mode==='n'?q.n:0;for(let i=0;i<q.d;i++){if(i<count||mode==='chosen'&&selected.has(i))paths+=`<path d="M${x(i)} 105 Q${x(i+.5)} 55 ${x(i+1)} 105" fill="none" stroke="${mode==='n'?'#a0448e':'#2875a0'}" stroke-width="4"/><text x="${x(i+.5)}" y="66" text-anchor="middle" font-size="22" fill="#244f91">${mode==='chosen'?'✓':i+1}</text>`}
return `<div class="linewrap"><div class="diagram"><svg viewBox="0 0 820 205" aria-label="A number line from ${q.w} to ${q.w+1}, with equal spaces and point A."><line x1="45" x2="775" y1="115" y2="115" stroke="#20334b" stroke-width="3"/>${ticks}${paths}${mode==='wholeTap'?`<foreignObject x="26" y="142" width="68" height="60"><button xmlns="http://www.w3.org/1999/xhtml" data-whole="${q.w}" aria-label="Whole number ${q.w}" style="width:64px;padding:8px">${q.w}</button></foreignObject><foreignObject x="726" y="142" width="68" height="60"><button xmlns="http://www.w3.org/1999/xhtml" data-whole="${q.w+1}" aria-label="Whole number ${q.w+1}" style="width:64px;padding:8px">${q.w+1}</button></foreignObject>`:`<text x="60" y="176" text-anchor="middle" font-size="28" font-weight="bold">${q.w}</text><text x="760" y="176" text-anchor="middle" font-size="28" font-weight="bold">${q.w+1}</text>`}<text x="${x(q.n)}" y="28" text-anchor="middle" font-size="28" font-weight="bold" fill="#a0448e">A</text><line x1="${x(q.n)}" x2="${x(q.n)}" y1="35" y2="95" stroke="#a0448e" stroke-width="3"/><circle cx="${x(q.n)}" cy="115" r="6" fill="#a0448e"/>${mode==='w'||wholeSelected&&phase==='rehearse'?'<path d="M43 184 H77" stroke="#2875a0" stroke-width="5"/>':''}</svg></div>${interactive?`<div class="gaprow">${Array.from({length:q.d},(_,i)=>`<button data-gap="${i}" aria-label="Space ${i+1}" aria-pressed="${selected.has(i)}">${selected.has(i)?'✓':'⌒'}</button>`).join('')}</div><div class="gaplabel">Tap a box to mark its space. Tap again to undo.</div>`:''}</div>`}
const btn=(id,t,secondary=false)=>`<button id="${id}" ${secondary?'class="secondary"':''}>${t}</button>`;
function prompt(k){return k==='w'?'Which whole number comes just before A?':k==='d'?`How many equal spaces from ${q.w} to ${q.w+1}?`:`How many spaces from ${q.w} to A?`}
function explain(k){return k==='w'?`A is between ${q.w} and ${q.w+1}. Write ${q.w} on the left.`:k==='d'?`${q.d} equal spaces make one whole. Count spaces, not lines. Write ${q.d} below the fraction line.`:`Start at ${q.w}. Cross ${q.n} ${q.n===1?'space':'spaces'} to reach A. Write ${q.n} above the fraction line.`}
function outline(){return `<div class="steps">${order.map((k,i)=>`<span class="${i===stage?'current':''}">${i+1}. ${labels[k]}${earned[k]!=null?' ✓':''}</span>`).join('')}</div>`}
function memory(){return `<div class="note memory">Whole number first.<br>Spaces in one whole → below the fraction line.<br>Spaces to A → above the fraction line.<br>Stop at A. Keep the whole number!</div>`}
function render(){if('speechSynthesis'in window)speechSynthesis.cancel();$('feedback').textContent='';$('progress').textContent=`Independent answers: ${streak} / 3`;let h='';
if(phase==='test'||phase==='original')h=`<h2>What mixed number does A show?</h2>${diagram()}<div class="answer"><b>A =</b>${frac({},['w','d','n'])}</div><div class="actions">${btn('check','Check')}${btn('help','Help me',true)}</div>`;
if(phase==='connect')h=`<h2>Remember the three steps</h2>${diagram()}<div class="answer"><b>A =</b>${frac(earned,[],true)}</div><div class="note memory"><b>1. Whole number first:</b> ${q.w} goes on the left.<br><b>2. Spaces in one whole:</b> ${q.d} goes below the line.<br><b>3. Spaces to A:</b> ${q.n} goes above the line.</div><p>Say the three steps. Next, use them on a different number line with the reminders hidden.</p><div class="actions">${btn('practise','Hide the steps · My turn')}</div>`;
if(phase==='rehearse'){
let k=order[stage],tap=marking;
let heading=recall?'Use the method from memory':'Build your mixed number';
let instruction=choose?'Tap the answer box you should fill next.':tap?(recall?(k==='w'?'Show where you found this number.':'Mark the spaces you counted.'):(k==='w'?'Tap the whole number just before A.':k==='d'?`Mark every space from ${q.w} to ${q.w+1}.`:`Mark the spaces from ${q.w} to A.`)):(k==='w'?'Write the whole number.':`Write the ${labels[k].toLowerCase()}.`);
if(local)instruction=prompt(k);
h=`<h2>${heading}</h2>${recall?'':outline()}<h2>${instruction}</h2>${diagram(local?k:choose?'':tap&&k==='w'?'wholeTap':k==='w'?'w':'chosen',!local&&!choose&&tap&&k!=='w')}${local?`<div class="note">${explain(k)}</div>`:''}${orderError?`<div class="note">${memory()}</div>`:''}<div class="answer"><b>A =</b>${choose?slots():frac(local?{...earned,[k]:q[k]}:earned,local||tap?[]:[k])}</div><div class="actions">${orderError?btn('orderRetry','Hide reminder · Try again'):local?btn('localRetry','My turn'):choose||tap&&k==='w'?'':tap?btn('marks','Check spaces'):btn('check','Check')}</div>`}
if(phase==='remember')h=`<h2>✓ You used all three steps</h2>${diagram()}<div class="answer"><b>A =</b>${frac(earned,[],true)}</div>${memory()}<div class="actions">${btn('retry','Try the first question without help')}</div>`;
if(phase==='success')h=`<h2>✓ Your answer matches A.</h2>${diagram()}<div class="answer"><b>A =</b>${frac(earned,[],true)}</div><div class="actions">${btn('next','Next question')}</div>`;
if(phase==='done')h=`<h2>✓ Three new questions, without help!</h2><p>Try a new number-line question on paper. Add your own marks if they help.</p><div class="actions">${btn('again','Practise again')}</div>`;
$('screen').innerHTML=h;bind();document.querySelector('input:not(:disabled)')?.focus({preventScroll:true})}
function msg(t){$('feedback').textContent=t}
function values(keys){let v={};for(let k of keys){let s=$(k).value.trim();if(!/^\d{1,3}$/.test(s)){msg(`Enter a number in the ${labels[k].toLowerCase()} box.`);$(k).focus();return null}v[k]=Number(s)}return v}
function equivalent(v){return v.w===q.w&&v.d>0&&v.n>0&&v.n<v.d&&v.n*q.d===q.n*v.d}
function slots(){const f=k=>earned[k]!=null?`<span class="value">${earned[k]}</span>`:`<button data-slot="${k}" aria-label="${labels[k]} box" ${orderError?'disabled':''} style="width:80px;background:#fff3ce;color:#20334b;border-color:#b87908">?</button>`;return `<span class="mixed">${f('w')}<span class="fraction">${f('n')}<span class="bar"></span>${f('d')}</span></span>`}
function help(keys,v={}){streak=0;recall=false;choose=false;orderError=false;originalQ={...q};earned={};stage=order.findIndex(k=>keys.includes(k));for(let i=0;i<stage;i++)earned[order[i]]=v[order[i]];wholeSelected=earned.w!=null;phase='rehearse';local=false;marking=true;selected.clear();render()}
function check(){if(phase==='test'||phase==='original'){let v=values(order);if(!v)return;if(equivalent(v)){earned=v;if(phase==='test')streak++;phase=streak===3?'done':'success';render()}else{let keys=order.filter(k=>v[k]!==q[k]);help(keys.length?keys:order,v)}}else if(phase==='rehearse'){let k=order[stage],v=values([k]);if(!v)return;if(v[k]!==q[k]){local=true;selected.clear()}else{earned[k]=v[k];stage++;selected.clear();marking=true;choose=recall;if(stage===3){choose=false;phase=recall?'remember':'connect'}}render()}}
function marks(){let k=order[stage],target=k==='d'?q.d:q.n;if(!selected.size){msg('Mark the spaces before checking.');return}if(selected.size===target&&Array.from({length:target},(_,i)=>i).every(i=>selected.has(i))){marking=false}else{local=true;selected.clear()}render()}
function selectWhole(value){if(value===q.w){wholeSelected=true;marking=false}else{local=true}render()}
function selectSlot(k){if(k!==order[stage]){orderError=true;render();return}choose=false;marking=true;render()}
function on(id,fn){if($(id))$(id).onclick=fn}
function bind(){on('check',check);on('help',()=>help(order));on('practise',()=>{q=newQ();phase='rehearse';recall=true;choose=true;stage=0;earned={};selected.clear();local=false;wholeSelected=false;marking=true;render()});on('marks',marks);on('localRetry',()=>{local=false;selected.clear();marking=true;render()});on('orderRetry',()=>{orderError=false;render()});on('retry',()=>{q={...originalQ};phase='original';earned={};wholeSelected=false;selected.clear();render()});on('next',()=>{q=newQ();phase='test';earned={};wholeSelected=false;render()});on('again',restart);document.querySelectorAll('[data-slot]').forEach(el=>el.onclick=()=>selectSlot(el.dataset.slot));document.querySelectorAll('[data-whole]').forEach(el=>el.onclick=()=>selectWhole(Number(el.dataset.whole)));document.querySelectorAll('[data-gap]').forEach(el=>el.onclick=()=>{let i=Number(el.dataset.gap);selected.has(i)?selected.delete(i):selected.add(i);render();document.querySelector(`[data-gap="${i}"]`).focus()});document.querySelectorAll('input:not(:disabled)').forEach(el=>el.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();check()}})}
function restart(){streak=0;used.clear();q=newQ();phase='test';earned={};recall=false;choose=false;wholeSelected=false;orderError=false;selected.clear();render()}
$('restart').onclick=restart;$('read').onclick=()=>{if(!('speechSynthesis'in window)){msg('Read aloud is unavailable. Follow the words on screen.');return}speechSynthesis.cancel();utterance=new SpeechSynthesisUtterance($('screen').innerText);utterance.lang='en-GB';utterance.rate=.85;utterance.onerror=()=>msg('Read aloud is unavailable on this device. Follow the words on screen.');speechSynthesis.speak(utterance)};restart();
</script></html>
