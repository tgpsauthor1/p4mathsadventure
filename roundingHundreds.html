</style><main><header><h1>Rounding Ridge · Hundreds</h1><div id="progress" aria-label="Independent progress"></div><button class="secondary" id="speak">Read aloud</button></header><section class="card" id="app"></section><footer><button class="secondary" id="help">Help me</button><button class="secondary" id="restart">Start again</button><button class="secondary" id="full-practice">Practise all steps</button></footer></main><script>
const app=document.querySelector('#app');
let n=null,streak=0,mode='independent',step=0,show=false,supported=false,used=new Set(),round=0,frame=0,animationToken=0;
const low=()=>Math.floor(n/100)*100, high=()=>low()+100, deciding=()=>Math.floor(n/10)%10, answer=()=>Math.floor((n+50)/100)*100;
const fmt=x=>String(x).replace(/\B(?=(\d{3})+(?!\d))/g,'\u00a0');
const titles=['Tap on the digit in the hundreds place.','Copy from the left. Include the hundreds digit.','Put 00 after your digits.','Find the higher hundred.','Tap on the digit in the tens place.','Which number will you choose?'];
function stopMotion(){cancelAnimationFrame(frame);animationToken++}
function digits(value,focus=-1,labels=false,clickable=false,copyTo=-1){const a=String(value).split('');return '<div class="digits">'+a.map((d,i)=>{const label=['Ones','Tens','Hundreds','Thousands','Ten thousands','Hundred thousands'][a.length-1-i];return clickable?`<button data-digit="${i}" aria-label="Digit ${d}, position ${i+1}">${d}</button>`:`<span class="digit ${i===focus?'focus':''} ${i<=copyTo?'copy-digit':''}">${labels?`<small>${label}</small>`:''}${d}</span>`}).join('')+'</div>'}
function form(label){return `<form><label class="small" for="entry">${label}</label><div class="choices" style="width:100%;margin:0"><input id="entry" inputmode="numeric" autocomplete="off" aria-label="${label}"><button class="primary" type="submit">Check</button></div></form>`}
function teach(){const hundreds=String(n).length-3,prefix=Math.floor(n/100);switch(step){case 0:return `<p class="caption">Nearest hundred → find the hundreds place.</p>${digits(n,hundreds,true)}<p class="hint">Hundreds is just left of tens.</p>`;
case 1:return digits(n,hundreds,true,false,hundreds)+`<p class="caption">Copy from the left. Stop after the hundreds digit.</p><div class="build" id="copy-row"><span class="slot" id="copy-value"></span></div><button id="copy" class="secondary replay">Watch the digits copy</button>`;
case 2:return `<div class="build"><span>${prefix}</span><span>→</span><span>${prefix}<mark>00</mark></span></div><p class="caption">${fmt(low())} is the lower hundred.</p>`;
case 3:return `<p class="caption">Add 100 to the lower hundred.</p><p class="small">Lower hundred: ${fmt(low())}</p><div id="add-digits">${digits(low(),String(low()).length-3,true)}</div><p id="add-note" class="caption">Add one hundred.</p><button id="add" class="secondary replay">Watch +100</button><p class="hint" id="hundred-options" hidden></p>`;
case 4:return digits(n,String(n).length-2,true)+`<p class="caption">Look at the tens digit: ${deciding()}.</p>`;
}}
function activity(){const hundreds=String(n).length-3;switch(step){case 0:return digits(n,-1,false,true);case 1:return digits(n,hundreds,false,false,hundreds)+`<p class="hint">Copy from the left. Stop after the hundreds digit.</p>`+form('Type the copied digits');case 2:return `<div class="build">${Math.floor(n/100)} <span>→</span> ?</div>`+form('Type the lower hundred');case 3:return `<p class="caption">Add 100 to the lower hundred.</p><div class="equation">${fmt(low())} + 100 = ?</div>`+form('Type the higher hundred');case 4:return digits(n,-1,false,true);case 5:return `<div class="number">${fmt(n)}</div><div class="choices"><button data-answer="${low()}">${fmt(low())}</button><button data-answer="${high()}">${fmt(high())}</button></div>`;}}
function render(){const playing=document.querySelector('#chant-audio');if(playing)playing.pause();stopMotion();document.querySelector('#progress').textContent='★'.repeat(streak)+'☆'.repeat(3-streak)+'  '+streak+'/3';document.querySelector('#help').hidden=!['independent','retry'].includes(mode);app.classList.toggle('hill-card',mode==='steps'&&step===5&&show);
document.querySelector('#full-practice').hidden=!['independent','retry','success','win'].includes(mode);
if(mode==='full'){renderFull();return}
if(mode==='steps'&&step===5){renderHill();return}
if(mode==='win'){app.innerHTML='<div class="tag">Practice complete</div><h2>Three in a row!</h2><div class="number">★★★</div><p>You rounded independently.</p><button id="again" class="primary">Play again</button>';document.querySelector('#again').onclick=reset;return}
if(mode==='success'){app.innerHTML=`<div class="tag">Correct</div><h2>${fmt(n)} ≈ ${fmt(answer())}</h2><p>${supported?'Now try a fresh question.':'One independent answer completed.'}</p><button id="next" class="primary">Next question</button>`;document.querySelector('#next').onclick=next;return}
if(mode==='bridge'){app.innerHTML=`<div class="tag">Write the number</div><h2>${fmt(n)} rounds to ${fmt(answer())}.</h2><p class="caption">Your answer is <strong>${fmt(answer())}</strong>.</p><p class="hint">Write the number, not “higher hundred” or “lower hundred”.</p><button id="retry" class="primary">My turn</button>`;document.querySelector('#retry').textContent='Practise all the steps together';document.querySelector('#retry').onclick=()=>beginFull();return}
const correction=mode==='steps';app.innerHTML=`<div class="tag">${correction?(show?'Watch':'Your turn'):mode==='retry'?'Try it without help':'Your question'}</div><h2>${correction?titles[step]:`Round ${fmt(n)} to the nearest hundred.`}</h2>${correction?(show?teach():activity()):form('Write your answer as a number')} ${correction&&show?'<button id="myturn" class="primary">My turn</button>':''}<div id="feedback" role="status" aria-live="polite"></div>`;
if(show&&correction){document.querySelector('#myturn').onclick=()=>{show=false;render()};if(step===1)document.querySelector('#copy').onclick=copyDigits;if(step===3)document.querySelector('#add').onclick=addHundred;return}
app.querySelectorAll('[data-digit]').forEach(b=>b.onclick=()=>submit(Number(b.dataset.digit)));
app.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>submit(Number(b.dataset.answer)));
const f=app.querySelector('form');if(f)f.onsubmit=e=>{e.preventDefault();const v=document.querySelector('#entry').value.trim();if(!/^(?:\d+|\d{1,3}(?:,\d{3})+|\d{1,3}(?: \d{3})+)$/.test(v)){document.querySelector('#feedback').textContent=/higher|lower/i.test(v)?'Write the number itself.':'Type a number, then tap Check.';return}submit(Number(v.replace(/[ ,]/g,'')))};
}
function timeline(duration,update,done){stopMotion();const token=animationToken;let start=null;function tick(t){if(token!==animationToken)return;if(start===null)start=t;const progress=Math.min(1,(t-start)/duration);update(progress);if(progress<1)frame=requestAnimationFrame(tick);else if(done)done()}frame=requestAnimationFrame(tick)}
function copyDigits(){const prefix=String(Math.floor(n/100));timeline(prefix.length*650+400,p=>{const count=Math.min(prefix.length,Math.floor(p*(prefix.length+1)));document.querySelector('#copy-value').textContent=prefix.slice(0,count);const ds=app.querySelectorAll('.digits .digit');ds.forEach((d,i)=>d.classList.toggle('focus',i===Math.min(count,prefix.length-1)));});}
function addHundred(){document.querySelector('#hundred-options').hidden=true;const lo=low(),hi=high(),a=String(lo).padStart(String(hi).length,'0'),b=String(hi),len=b.length,carry=a[len-3]==='9';let last=-1;timeline(carry?4200:2800,p=>{const phase=Math.min(carry?3:2,Math.floor(p*(carry?4:3)));if(phase===last)return;last=phase;const box=document.querySelector('#add-digits'),note=document.querySelector('#add-note');if(phase===0){box.innerHTML=digits(lo,String(lo).length-3,true);note.textContent='Add 1 to the hundreds digit.'}else if(phase===1){note.textContent=`${a[len-3]} hundreds + 1 hundred = ${Number(a[len-3])+1} hundreds`;box.innerHTML=digits(lo,String(lo).length-3,true)}else if(carry&&phase===2){note.textContent='10 hundreds = 1 thousand. Carry to the left.';box.innerHTML=digits(hi,len-4,true)}else{box.innerHTML='<div class="digits">'+b.split('').map((d,i)=>`<span class="digit ${a[i]!==d?'focus':''}"><small>${['Ones','Tens','Hundreds','Thousands','Ten thousands','Hundred thousands'][len-1-i]}</small>${d}</span>`).join('')+'</div>';note.textContent=`${fmt(lo)} + 100 = ${fmt(hi)}. The higher hundred is ${fmt(hi)}.`;const options=document.querySelector('#hundred-options');options.hidden=false;options.textContent=`When rounding, choose ${fmt(lo)} or ${fmt(hi)}.`}})}
let hillPhase='place';
function renderHill(){
 hillPhase='place';app.classList.add('hill-card');
 app.innerHTML=`<div class="tag">Your turn</div><h2 id="hill-title">Place the ball.</h2><div class="number">${fmt(n)}</div><p class="caption" id="motion-note">Tap on the digit in the tens place.</p><div class="mountain"><svg viewBox="0 0 680 350" preserveAspectRatio="none" aria-label="Rounding mountain" role="img"><path d="M55 230 L340 70 L625 230 Z" fill="#e3eff0" stroke="#547e85" stroke-width="4"/><g id="ball" visibility="hidden"><circle r="14" fill="#e9a829" stroke="#70480e" stroke-width="3"/><path d="M-13 0 H13 M0 -13 V13" stroke="#70480e" stroke-width="2"/></g></svg>${Array.from({length:11},(_,i)=>`<button class="hill-point" data-point="${i}" style="left:${(55+i*57)/680*100}%;top:${(230-Math.min(i,10-i)*32)/350*100}%" aria-label="Place ball at ${i}" ${i===10?'disabled':''}>${i}</button>`).join('')}<button class="hill-end left" data-end="${low()}" disabled>${fmt(low())}</button><button class="hill-end right" data-end="${high()}" disabled>${fmt(high())}</button></div><button id="roll" class="secondary replay" hidden>Watch it roll</button><button id="hill-retry" class="primary" hidden>My turn</button><div id="feedback" role="status" aria-live="polite"></div>`;
 app.querySelectorAll('[data-point]').forEach(b=>b.onclick=()=>placeBall(Number(b.dataset.point)));
 app.querySelectorAll('[data-end]').forEach(b=>b.onclick=()=>chooseEnd(Number(b.dataset.end)));
 document.querySelector('#roll').onclick=rollBall;
}
function mountainBall(p,angle=0){const b=document.querySelector('#ball');b.setAttribute('visibility','visible');b.setAttribute('transform',`translate(${55+p*57} ${211-Math.min(p,10-p)*32}) rotate(${angle})`)}
function placeBall(p){if(hillPhase!=='place')return;app.querySelectorAll('[data-point]').forEach(b=>b.disabled=true);mountainBall(p);
 if(p!==deciding()){hillPhase='teach';document.querySelector('#motion-note').textContent=`The tens digit is ${deciding()}. Put the ball at ${deciding()}.`;mountainBall(deciding());app.querySelector(`[data-point="${deciding()}"]`).classList.add('teach-point');const retry=document.querySelector('#hill-retry');retry.hidden=false;retry.onclick=render;return}
 hillPhase='ready';document.querySelector('#hill-title').textContent='Watch the ball roll.';document.querySelector('#motion-note').textContent=`Tens digit: ${deciding()}`;document.querySelector('#roll').hidden=false;
}
function rollBall(){if(!['ready','choose'].includes(hillPhase))return;hillPhase='rolling';app.querySelectorAll('[data-end]').forEach(b=>b.disabled=true);const start=deciding(),end=start<5?0:10,roll=document.querySelector('#roll'),note=document.querySelector('#motion-note');roll.disabled=true;mountainBall(start);note.textContent=start===0?'0: the ball stays at the lower hundred.':start<5?'0–4: roll to the lower hundred.':'5–9: roll to the higher hundred.';
 timeline(3000,p=>{const t=p===1?1:Math.max(0,(p-.18)/.82),pos=start+(end-start)*t;mountainBall(pos,(pos-start)*160)},()=>{hillPhase='choose';document.querySelector('#hill-title').textContent='Tap the hundred where the ball stopped.';note.textContent=`${fmt(low())} or ${fmt(high())}?`;app.querySelectorAll('[data-end]').forEach(b=>b.disabled=false);roll.disabled=false;roll.textContent='Roll again'})
}
function chooseEnd(v){if(hillPhase!=='choose')return;if(v===answer()){if(mode==='full'){fullAnswers[5]=v;fullStep=6;render()}else{mode='bridge';show=false;render()}return}hillPhase='teach';app.querySelectorAll('[data-end]').forEach(b=>b.disabled=true);document.querySelector('#roll').hidden=true;document.querySelector('#feedback').textContent=`The tens digit is ${deciding()}. Choose ${fmt(answer())}.`;const retry=document.querySelector('#hill-retry');retry.hidden=false;retry.onclick=()=>{document.querySelector('#ball').setAttribute('visibility','hidden');document.querySelector('#feedback').textContent='';retry.hidden=true;hillPhase='choose';app.querySelectorAll('[data-end]').forEach(b=>b.disabled=false)}}

let fullStep=0,fullAnswers=[],fullTeaching=false;
const fullLabels=['Find the hundreds digit','Copy from the left, including the hundreds digit','Put 00 after → lower hundred','Add 100 → higher hundred','Find the tens digit','Choose where the ball stops','Write the rounded number'];
function beginFull(){stopMotion();supported=true;streak=0;mode='full';fullStep=0;fullAnswers=[];fullTeaching=false;render()}
function fullTable(){return '<table class="full-sheet" aria-label="My rounding steps"><tbody>'+fullLabels.map((label,i)=>{let value='—';if(i<fullStep){if(i===0||i===4)value=String(n)[fullAnswers[i]];else if(i===2)value=fullAnswers[1]+' → '+fmt(fullAnswers[i]);else if(i===3)value=fmt(fullAnswers[2])+' + 100 = '+fmt(fullAnswers[i]);else value=fmt(fullAnswers[i]);}return `<tr class="${i===fullStep?'active':''}"><th scope="row"><span class="row-number">${i+1}</span>${label}</th><td class="${i<fullStep?'done':'pending'}">${i<fullStep?'✓ ':''}${value}</td></tr>`}).join('')+'</tbody></table>'}
function renderFull(){
 if(fullStep===5){renderHill();const box=document.createElement('section');box.className='full-summary';box.innerHTML='<h2 class="full-heading">Put all the steps together</h2>'+fullTable();app.prepend(box);return}

function fullSubmit(v){if(mode!=='full'||fullTeaching)return;const expected=[String(n).length-3,Math.floor(n/100),low(),high(),String(n).length-2,answer(),answer()][fullStep];if(v!==expected){fullTeaching=true;render();return}fullAnswers[fullStep]=v;fullStep++;render()}

function startHelp(){streak=0;supported=true;mode='steps';step=0;show=true;render()}
function submit(v){if(mode==='steps'){const expected=[String(n).length-3,Math.floor(n/100),low(),high(),String(n).length-2,answer()][step];if(v!==expected){show=true;render();return}step++;if(step===6){mode='bridge';show=false}else show=true;render();return}if(!['independent','retry'].includes(mode))return;if(v===answer()){if(mode==='independent'&&!supported)streak++;mode=streak===3?'win':'success';render()}else startHelp()}
function next(){round++;const d=[4,5,0,9,1,6,3,8,2,7][(round-1)%10];let candidates=[];for(let base=100;base<1000;base++){for(let unit=0;unit<10;unit++){const v=base*100+d*10+unit;if(v%100!==0&&!used.has(v))candidates.push(v)}}if(!candidates.length){used=new Set([n]);return next()}n=candidates[Math.floor(Math.random()*candidates.length)];if(round%4===0){const cross=candidates.filter(v=>Math.floor(v/100)%10===9);if(cross.length)n=cross[Math.floor(Math.random()*cross.length)]}used.add(n);mode='independent';show=false;supported=false;render()}
function reset(){const previous=n;do{n=10000+Math.floor(Math.random()*90000)}while(n===previous||n%100===0);streak=0;mode='independent';step=0;show=false;supported=false;used=new Set([n]);round=0;render()}
